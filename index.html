<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>probaocon // NULLSCAPE VOID ARCHIVE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Pirata+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --void-bg: #020005;
            --null-purple: #8c00ff;
            --null-crimson: #ff0044;
            --null-cyan: #00f0ff;
            --card-glass: rgba(8, 2, 16, 0.88);
            --mouse-x: 50%;
            --mouse-y: 50%;
            --tilt-x: 0deg;
            --tilt-y: 0deg;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--void-bg);
            color: #ebd9ff;
            font-family: 'Cinzel Decorative', serif;
        }

        /* 全螢幕背景與開場 Canvas */
        #null-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 噪點暗角覆蓋層 (提升質感) */
        .vignette-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 30%, rgba(2, 0, 5, 0.85) 80%, #020005 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* --- 沉浸式開場封印層 --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: rgba(2, 0, 5, 0.4);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s ease, filter 1s ease;
        }

        #splash-screen.dissolve {
            opacity: 0;
            filter: blur(30px) contrast(300%) brightness(1.5);
            transform: scale(1.2);
            pointer-events: none;
        }

        .splash-text-container {
            position: absolute;
            bottom: 18%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .splash-title {
            font-family: 'Pirata One', cursive;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            letter-spacing: 16px;
            color: #fff;
            text-shadow: 0 0 20px var(--null-purple), 0 0 40px var(--null-crimson);
            animation: pulseGlow 2.5s infinite alternate ease-in-out;
        }

        .splash-sub {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: var(--null-cyan);
            letter-spacing: 6px;
            margin-top: 15px;
            text-shadow: 0 0 8px var(--null-cyan);
            animation: blinkSub 1.2s infinite;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 15px var(--null-purple), 0 0 30px var(--null-crimson); transform: scale(0.98); }
            100% { text-shadow: 0 0 30px var(--null-purple), 0 0 60px var(--null-crimson), 0 0 90px var(--null-cyan); transform: scale(1.02); }
        }

        @keyframes blinkSub { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }

        /* --- 主 3D 卡片 UI --- */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            opacity: 0;
            transform: scale(0.88);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .main-container.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .null-card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 90%;
            max-width: 580px;
            padding: 55px 45px;
            position: relative;
            border: 1px solid rgba(140, 0, 255, 0.45);
            box-shadow: 0 0 50px rgba(0,0,0,0.95), inset 0 0 35px rgba(140, 0, 255, 0.15);
            transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x));
            transition: transform 0.12s ease-out, opacity 0.4s ease;
            overflow: hidden;
        }

        .null-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(700px circle at var(--mouse-x) var(--mouse-y), rgba(255, 0, 68, 0.12), transparent 70%);
            pointer-events: none;
        }

        .header-tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.65rem;
            color: var(--null-cyan);
            letter-spacing: 6px;
            text-align: center;
            margin-bottom: 12px;
        }

        h1.user-name {
            font-family: 'Pirata One', cursive;
            font-size: clamp(3rem, 8vw, 4.2rem);
            letter-spacing: 12px;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 18px var(--null-purple), 0 0 35px var(--null-crimson);
            margin-bottom: 6px;
        }

        .sub-tag {
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: rgba(235, 217, 255, 0.6);
            margin-bottom: 40px;
        }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 180px;
        }

        .data-row {
            border-left: 2px solid var(--null-purple);
            padding-left: 18px;
            transition: all 0.3s ease;
        }

        .data-row:hover {
            border-left-color: var(--null-crimson);
            box-shadow: -8px 0 20px rgba(255, 0, 68, 0.3);
            transform: translateX(4px);
        }

        .data-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--null-cyan);
            letter-spacing: 2px;
            margin-bottom: 4px;
            display: block;
        }

        .data-value {
            font-size: 1rem;
            color: #ffffff;
            letter-spacing: 1px;
            font-family: 'Cinzel Decorative', serif;
            text-shadow: 0 0 8px rgba(140, 0, 255, 0.6);
        }

        /* 切頁按鈕 */
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            background: rgba(8, 2, 16, 0.9);
            border: 1px solid var(--null-purple);
            box-shadow: 0 0 20px rgba(140, 0, 255, 0.4);
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .nav-btn-left { left: clamp(15px, 4vw, 45px); }
        .nav-btn-right { right: clamp(15px, 4vw, 45px); }

        .nav-btn::after {
            content: "";
            width: 12px;
            height: 12px;
            border-top: 2px solid var(--null-cyan);
            border-right: 2px solid var(--null-cyan);
        }

        .nav-btn-left::after { transform: rotate(-135deg); }
        .nav-btn-right::after { transform: rotate(45deg); }

        .nav-btn:hover {
            background: var(--null-purple);
            box-shadow: 0 0 30px var(--null-purple), 0 0 50px var(--null-crimson);
            transform: translateY(-50%) scale(1.15);
        }

        /* 角邊印記 */
        .corner-glyph {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 1px solid var(--null-cyan);
            transform: rotate(45deg);
        }
        .cg-tl { top: 10px; left: 10px; }
        .cg-tr { top: 10px; right: 10px; }
        .cg-bl { bottom: 10px; left: 10px; }
        .cg-br { bottom: 10px; right: 10px; }

        .page-indicator {
            position: absolute;
            bottom: 18px;
            right: 22px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.65rem;
            color: var(--null-cyan);
            letter-spacing: 2px;
            opacity: 0.6;
        }

        /* 震盪視覺特效 Class */
        .screen-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 1px, 0); }
            20%, 80% { transform: translate3d(4px, -2px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 3px, 0); }
            40%, 60% { transform: translate3d(6px, -3px, 0); }
        }
    </style>
</head>
<body>

    <canvas id="null-canvas"></canvas>
    <div class="vignette-overlay"></div>

    <!-- 開場層 -->
    <div id="splash-screen">
        <div class="splash-text-container">
            <div class="splash-title">NULLSCAPE</div>
            <div class="splash-sub">[ BREAK THE VOID SEAL ]</div>
        </div>
    </div>

    <!-- 導航按鈕 -->
    <button class="nav-btn nav-btn-left" id="btn-prev" aria-label="Previous"></button>
    <button class="nav-btn nav-btn-right" id="btn-next" aria-label="Next"></button>

    <!-- 主 UI 卡片 -->
    <div class="main-container" id="main-container">
        <div class="null-card" id="null-card">
            <div class="corner-glyph cg-tl"></div><div class="corner-glyph cg-tr"></div>
            <div class="corner-glyph cg-bl"></div><div class="corner-glyph cg-br"></div>

            <div class="header-tag" id="card-tag">// NULL_PROFILE_ARCHIVE</div>
            <h1 class="user-name">probaocon</h1>
            <div class="sub-tag" id="card-sub">VOID WALKER // UNKNOWN ENTITY</div>

            <div class="data-list" id="data-list"></div>
            <div class="page-indicator" id="page-indicator">SECTOR 01 / 03</div>
        </div>
    </div>

    <script>
        /* --- Web Audio 音效與低音虛空聲學 --- */
        class NullAudioEngine {
            constructor() { this.ctx = null; }
            init() {
                if (this.ctx) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.playDrone();
            }
            playDrone() {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(40, this.ctx.currentTime);
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(120, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.25, this.ctx.currentTime + 3);
                osc.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                osc.start();
            }
            playSealBreakSfx() {
                if (!this.ctx) return;
                // 低頻破印衝擊波音效
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start();
            }
        }
        const audioEngine = new NullAudioEngine();

        /* --- 頁面資料集 --- */
        const profilePages = [
            {
                tag: "// NULL_PROFILE_ARCHIVE",
                sub: "VOID WALKER // UNKNOWN ENTITY",
                rows: [
                    { label: "ENTITY_ID", value: "[ EMPTY FIELD ]" },
                    { label: "STATUS / EGO", value: "[ EMPTY FIELD ]" },
                    { label: "ALIGNMENT", value: "[ UNKNOWN ]" }
                ]
            },
            {
                tag: "// RECORDS_DATABASE",
                sub: "ARCHIVED TRANSMISSIONS",
                rows: [
                    { label: "PROJECT_LOG_01", value: "[ UNASSIGNED DATA ]" },
                    { label: "PROJECT_LOG_02", value: "[ UNASSIGNED DATA ]" }
                ]
            },
            {
                tag: "// VOID_COMMUNICATIONS",
                sub: "CONNECTIVITY LINK",
                rows: [
                    { label: "SIGNAL_SOURCE", value: "[ DISCONNECTED ]" },
                    { label: "EXTERNAL_LINK", value: "[ NONE ]" }
                ]
            }
        ];

        let currentPage = 0;
        const nullCard = document.getElementById('null-card');
        const dataList = document.getElementById('data-list');
        const cardTag = document.getElementById('card-tag');
        const cardSub = document.getElementById('card-sub');
        const pageIndicator = document.getElementById('page-indicator');

        function renderPage(index) {
            const data = profilePages[index];
            cardTag.textContent = data.tag;
            cardSub.textContent = data.sub;
            dataList.innerHTML = data.rows.map(row => `
                <div class="data-row">
                    <span class="data-label">${row.label}</span>
                    <span class="data-value">${row.value}</span>
                </div>
            `).join('');
            pageIndicator.textContent = `SECTOR 0${index + 1} / 0${profilePages.length}`;
        }

        function switchPage(dir) {
            audioEngine.playSealBreakSfx();
            if (dir === 'next') currentPage = (currentPage + 1) % profilePages.length;
            else currentPage = (currentPage - 1 + profilePages.length) % profilePages.length;
            renderPage(currentPage);
        }

        document.getElementById('btn-next').addEventListener('click', () => switchPage('next'));
        document.getElementById('btn-prev').addEventListener('click', () => switchPage('prev'));

        /* --- 3D 傾斜效果 --- */
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            const rect = nullCard.getBoundingClientRect();
            nullCard.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            nullCard.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
            const tiltX = ((e.clientX - window.innerWidth / 2) / (window.innerWidth / 2)) * 7;
            const tiltY = ((e.clientY - window.innerHeight / 2) / (window.innerHeight / 2)) * -7;
            nullCard.style.setProperty('--tilt-x', `${tiltX}deg`);
            nullCard.style.setProperty('--tilt-y', `${tiltY}deg`);
        });

        /* ==========================================================================
           高精度程式化怪誕巨獸與眼花繪製引擎 (Procedural Eldritch Engine)
           ========================================================================== */
        const canvas = document.getElementById('null-canvas');
        const ctx = canvas.getContext('2d');

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        let animTime = 0;
        let isOpened = false;
        let shockwaveRadius = 0;

        // 寫實眼球結構繪製函數
        function drawRealisticEye(x, y, radius, lookX, lookY, blinkRatio = 1, irisColor = '#ff0055') {
            ctx.save();
            ctx.translate(x, y);

            // 1. 杏仁狀眼瞼輪廓 (Clipping Path)
            ctx.beginPath();
            const width = radius * 1.8;
            const height = radius * 1.1 * blinkRatio;
            ctx.moveTo(-width, 0);
            ctx.bezierCurveTo(-width * 0.5, -height, width * 0.5, -height, width, 0);
            ctx.bezierCurveTo(width * 0.5, height, -width * 0.5, height, -width, 0);
            ctx.closePath();

            // 如果閉眼過度則不繪製內部
            if (blinkRatio < 0.05) {
                ctx.strokeStyle = '#8c00ff';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
                return;
            }

            ctx.save();
            ctx.clip(); // 將眼球內容裁切在眼瞼內

            // 2. 鞏膜 (Sclera / 眼白) - 帶血管與深色漸層
            const scleraGrad = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius * 1.5);
            scleraGrad.addColorStop(0, '#1c1524');
            scleraGrad.addColorStop(0.7, '#0d0414');
            scleraGrad.addColorStop(1, '#050008');
            ctx.fillStyle = scleraGrad;
            ctx.fill();

            // 繪製微細血管紋路
            ctx.strokeStyle = 'rgba(255, 0, 68, 0.25)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * radius * 0.4, Math.sin(angle) * radius * 0.4);
                ctx.lineTo(Math.cos(angle) * radius * 1.2, Math.sin(angle) * radius * 1.2);
                ctx.stroke();
            }

            // 3. 瞳孔與虹幕偏移計算 (視線跟隨)
            const dx = lookX - (x);
            const dy = lookY - (y);
            const dist = Math.hypot(dx, dy) || 1;
            const maxOffset = radius * 0.45;
            const offsetX = (dx / dist) * Math.min(dist, maxOffset);
            const offsetY = (dy / dist) * Math.min(dist, maxOffset);

            // 4. 虹膜 (Iris) - 多層次發光放射紋
            ctx.translate(offsetX, offsetY);
            const irisRadius = radius * 0.55;

            const irisGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, irisRadius);
            irisGrad.addColorStop(0, '#ffffff');
            irisGrad.addColorStop(0.2, '#00f0ff');
            irisGrad.addColorStop(0.6, irisColor);
            irisGrad.addColorStop(1, '#05000a');

            ctx.beginPath();
            ctx.arc(0, 0, irisRadius, 0, Math.PI * 2);
            ctx.fillStyle = irisGrad;
            ctx.fill();

            // 虹膜放射狀肌肉纖維紋路
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 0.8;
            for (let a = 0; a < Math.PI * 2; a += 0.2) {
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * (irisRadius * 0.3), Math.sin(a) * (irisRadius * 0.3));
                ctx.lineTo(Math.cos(a) * irisRadius, Math.sin(a) * irisRadius);
                ctx.stroke();
            }

            // 5. 貓眼/虛空狹長瞳孔 (Slit Pupil)
            ctx.beginPath();
            const pupilWidth = irisRadius * 0.25;
            const pupilHeight = irisRadius * 0.75;
            ctx.ellipse(0, 0, pupilWidth, pupilHeight, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#020005';
            ctx.fill();

            // 6. 頂部高光 (Specular Highlight)
            ctx.beginPath();
            ctx.arc(-irisRadius * 0.3, -irisRadius * 0.3, irisRadius * 0.15, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.fill();

            ctx.restore(); // 結束眼球內部 Clip

            // 7. 肉感眼瞼邊框與陰影
            ctx.strokeStyle = 'rgba(140, 0, 255, 0.7)';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.restore();
        }

        // 繪製圍繞主眼的怪誕花瓣/觸手花（Nullscape Monster Flower）
        function drawMonsterPetals(cx, cy, count, radius, time) {
            ctx.save();
            ctx.translate(cx, cy);
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2 + Math.sin(time * 0.5 + i) * 0.05;
                ctx.save();
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(radius * 0.4, -radius * 0.3, radius * 0.8, -radius * 0.2, radius * 1.3, 0);
                ctx.bezierCurveTo(radius * 0.8, radius * 0.2, radius * 0.4, radius * 0.3, 0, 0);

                const petalGrad = ctx.createLinearGradient(0, 0, radius * 1.3, 0);
                petalGrad.addColorStop(0, '#10001f');
                petalGrad.addColorStop(0.5, '#5900b3');
                petalGrad.addColorStop(0.85, '#ff0055');
                petalGrad.addColorStop(1, 'transparent');

                ctx.fillStyle = petalGrad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 在花瓣尖端繪製附生小眼球
                if (i % 2 === 0) {
                    const blink = Math.abs(Math.sin(time * 2 + i));
                    drawRealisticEye(radius * 1.1, 0, 14, mouseX, mouseY, blink, '#00f0ff');
                }

                ctx.restore();
            }
            ctx.restore();
        }

        /* --- 主繪製迴圈 (Render Loop) --- */
        function render() {
            animTime += 0.025;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // 1. 扭曲動態虛空背景 (Winding Void Grid)
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(Math.sin(animTime * 0.2) * 0.1);

            const gridRings = 14;
            for (let r = gridRings; r > 0; r--) {
                const rad = Math.pow(r / gridRings, 2.5) * Math.max(cx, cy) * 1.2;
                const prevRad = Math.pow((r - 1) / gridRings, 2.5) * Math.max(cx, cy) * 1.2;

                for (let s = 0; s < 20; s++) {
                    const a1 = (s / 20) * Math.PI * 2 + (r * 0.04) + (animTime * 0.1);
                    const a2 = ((s + 1) / 20) * Math.PI * 2 + (r * 0.04) + (animTime * 0.1);

                    ctx.beginPath();
                    ctx.arc(0, 0, rad, a1, a2);
                    ctx.arc(0, 0, prevRad, a2, a1, true);
                    ctx.closePath();

                    ctx.fillStyle = (r + s) % 2 === 0 ? 'rgba(140, 0, 255, 0.08)' : 'rgba(2, 0, 5, 0.9)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(140, 0, 255, 0.12)';
                    ctx.stroke();
                }
            }
            ctx.restore();

            // 2. 開場畫面上：繪製中央主巨獸花與大眼 (Only on Splash Screen)
            if (!isOpened) {
                const mainEyeRadius = Math.min(canvas.width, canvas.height) * 0.14;
                
                // 繪製周圍肉質花瓣與小眼
                drawMonsterPetals(cx, cy - 40, 12, mainEyeRadius * 1.4, animTime);

                // 自然眨眼計算
                const mainBlink = Math.sin(animTime * 1.5) > 0.96 ? 0.1 : 1;

                // 繪製中央主眼
                drawRealisticEye(cx, cy - 40, mainEyeRadius, mouseX, mouseY, mainBlink, '#ff0055');
            }

            // 3. 破印衝擊波特效
            if (shockwaveRadius > 0) {
                shockwaveRadius += 25;
                ctx.beginPath();
                ctx.arc(cx, cy, shockwaveRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 240, 255, ${Math.max(0, 1 - shockwaveRadius / (canvas.width * 0.8))})`;
                ctx.lineWidth = 8;
                ctx.stroke();

                if (shockwaveRadius > canvas.width * 0.8) shockwaveRadius = 0;
            }

            requestAnimationFrame(render);
        }

        // 初始化
        renderPage(0);
        render();

        /* --- 點擊破印開場邏輯 --- */
        const splash = document.getElementById('splash-screen');
        const mainContainer = document.getElementById('main-container');

        splash.addEventListener('click', () => {
            audioEngine.init();
            audioEngine.playSealBreakSfx();

            shockwaveRadius = 10; // 觸發衝擊波
            document.body.classList.add('screen-shake');
            splash.classList.add('dissolve');

            setTimeout(() => {
                isOpened = true; // 隱藏主眼，進入主介面
                splash.style.display = 'none';
                mainContainer.classList.add('active');
                document.body.classList.remove('screen-shake');
            }, 800);
        });
    </script>
</body>
</html>
