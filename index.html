<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NULLSCAPE // VORTEX</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=Noto+Serif+TC:wght@600;900&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #010102;
            color: #fff;
            font-family: "Playfair Display", "Noto Serif TC", serif;
            overflow: hidden;
            user-select: none;
        }

        button {
            font: inherit;
        }

        /* =========================================================
           CANVAS
        ========================================================= */

        #void-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* =========================================================
           ATMOSPHERE
        ========================================================= */

        .event-horizon {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(0, 0, 0, 0.98) 0%,
                    rgba(0, 0, 0, 0.94) 10%,
                    rgba(16, 0, 29, 0.58) 30%,
                    rgba(34, 0, 58, 0.20) 54%,
                    rgba(70, 0, 120, 0.09) 74%,
                    rgba(0, 0, 0, 0.72) 100%
                );
        }

        /*
            很淡的全畫面紫色空氣感。
            不再像整片紫色濾鏡。
        */

        .void-glow {
            position: fixed;
            inset: -20%;
            z-index: 3;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at 50% 48%,
                    rgba(115, 0, 190, 0.07) 0%,
                    rgba(70, 0, 120, 0.025) 34%,
                    transparent 68%
                );

            filter: blur(18px);

            animation: ambientPulse 8s ease-in-out infinite;
        }

        @keyframes ambientPulse {
            0%,
            100% {
                opacity: 0.72;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.035);
            }
        }

        /*
            暗角，讓中央內容自然成為焦點。
        */

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 42%,
                    rgba(0, 0, 0, 0.22) 67%,
                    rgba(0, 0, 0, 0.78) 100%
                );
        }

        /* =========================================================
           TOP / BOTTOM DECORATION
        ========================================================= */

        .top-mark {
            position: fixed;
            top: 24px;
            left: 30px;
            z-index: 20;

            color: rgba(210, 191, 230, 0.34);

            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 0.32em;

            text-transform: uppercase;
            pointer-events: none;
        }

        .top-mark-right {
            position: fixed;
            top: 24px;
            right: 30px;
            z-index: 20;

            color: rgba(210, 191, 230, 0.22);

            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 0.28em;

            text-transform: uppercase;
            pointer-events: none;
        }

        .top-line,
        .bottom-line {
            position: fixed;
            left: 28px;
            right: 28px;
            height: 1px;

            z-index: 20;
            pointer-events: none;

            background:
                linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(122, 0, 190, 0.18) 28%,
                    rgba(180, 100, 255, 0.12) 50%,
                    rgba(122, 0, 190, 0.18) 72%,
                    transparent 100%
                );
        }

        .top-line {
            top: 17px;
        }

        .bottom-line {
            bottom: 17px;
            opacity: 0.45;
        }

        /* =========================================================
           MAIN CONTENT
        ========================================================= */

        .content-layer {
            position: relative;
            z-index: 10;

            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px;

            pointer-events: none;
        }

        /* =========================================================
           PROFILE CARD
        ========================================================= */

        .profile-box {
            position: relative;

            width: 720px;
            max-width: 90vw;

            padding: 54px 58px 46px;

            background:
                linear-gradient(
                    145deg,
                    rgba(11, 3, 18, 0.90),
                    rgba(4, 1, 8, 0.82)
                );

            border:
                1px solid rgba(128, 0, 190, 0.42);

            /*
                不再大面積發光。
                光只存在於卡片周圍。
            */

            box-shadow:
                0 0 50px rgba(72, 0, 110, 0.18),
                0 18px 70px rgba(0, 0, 0, 0.78),
                inset 0 0 35px rgba(89, 0, 130, 0.06);

            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);

            /*
                保留你原本的切角。
            */

            clip-path:
                polygon(
                    18px 0,
                    calc(100% - 18px) 0,
                    100% 18px,
                    100% calc(100% - 18px),
                    calc(100% - 18px) 100%,
                    18px 100%,
                    0 calc(100% - 18px),
                    0 18px
                );

            pointer-events: auto;

            transform: translate3d(0, 0, 0) scale(1);
            opacity: 1;
            filter: blur(0);

            transition:
                transform 0.62s cubic-bezier(0.22, 0.61, 0.36, 1),
                opacity 0.45s ease,
                filter 0.45s ease;
        }

        /*
            上方細線。
        */

        .profile-box::before {
            content: "";

            position: absolute;
            top: 0;
            left: 20px;

            width: 170px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    rgba(170, 66, 255, 0.75),
                    transparent
                );
        }

        /*
            下方非常淡的線。
        */

        .profile-box::after {
            content: "";

            position: absolute;
            right: 20px;
            bottom: 0;

            width: 130px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(110, 0, 170, 0.55)
                );
        }

        /* =========================================================
           PAGE TRANSITIONS
        ========================================================= */

        .profile-box.sucking-left {
            transform:
                translate3d(-70px, 0, 0)
                scale(0.94)
                rotate(-2deg);

            opacity: 0;
            filter: blur(9px);
        }

        .profile-box.sucking-right {
            transform:
                translate3d(70px, 0, 0)
                scale(0.94)
                rotate(2deg);

            opacity: 0;
            filter: blur(9px);
        }

        .profile-box.flying-left {
            animation:
                pageInFromRight
                0.62s
                cubic-bezier(0.22, 0.61, 0.36, 1)
                forwards;
        }

        .profile-box.flying-right {
            animation:
                pageInFromLeft
                0.62s
                cubic-bezier(0.22, 0.61, 0.36, 1)
                forwards;
        }

        @keyframes pageInFromRight {
            from {
                transform:
                    translate3d(70px, 0, 0)
                    scale(0.94);

                opacity: 0;
                filter: blur(9px);
            }

            to {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);

                opacity: 1;
                filter: blur(0);
            }
        }

        @keyframes pageInFromLeft {
            from {
                transform:
                    translate3d(-70px, 0, 0)
                    scale(0.94);

                opacity: 0;
                filter: blur(9px);
            }

            to {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);

                opacity: 1;
                filter: blur(0);
            }
        }

        /* =========================================================
           TITLE
        ========================================================= */

        .title {
            margin-bottom: 10px;

            color: #f3edf8;

            font-size: clamp(2.7rem, 6vw, 3.8rem);

            font-weight: 900;

            letter-spacing: 0.12em;
            line-height: 1;

            text-transform: uppercase;

            text-shadow:
                0 4px 22px rgba(0, 0, 0, 0.82),
                0 0 26px rgba(132, 31, 190, 0.12);
        }

        .title::first-letter {
            color: #ffffff;
        }

        .subtitle {
            margin-bottom: 36px;

            color: rgba(171, 105, 210, 0.78);

            font-family: Arial, sans-serif;

            font-size: 0.72rem;
            font-weight: 600;

            letter-spacing: 0.42em;

            text-transform: uppercase;

            text-shadow:
                0 0 10px rgba(137, 53, 190, 0.24);
        }

        /* =========================================================
           DESCRIPTION
        ========================================================= */

        .desc {
            position: relative;

            max-width: 510px;

            margin: 0 auto 32px;

            padding: 22px 0;

            color: rgba(221, 210, 230, 0.73);

            font-size: 0.93rem;

            line-height: 2;

            text-align: center;
        }

        /*
            不再上下雙實線。
            只在中間留一個非常細的紫線。
        */

        .desc::before {
            content: "";

            position: absolute;

            left: 50%;
            top: 0;

            width: 55px;
            height: 1px;

            transform: translateX(-50%);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(154, 61, 210, 0.55),
                    transparent
                );
        }

        .desc::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 0;

            width: 25px;
            height: 1px;

            transform: translateX(-50%);

            background:
                rgba(121, 42, 167, 0.28);
        }

        /* =========================================================
           PAGE INDICATOR
        ========================================================= */

        .page-indicator {
            margin-top: 4px;

            color: rgba(172, 123, 209, 0.65);

            font-family: Arial, sans-serif;

            font-size: 0.68rem;

            font-weight: 700;

            letter-spacing: 0.34em;

            text-transform: uppercase;
        }

        /* =========================================================
           NAVIGATION
        ========================================================= */

        .page-nav {
            position: fixed;

            top: 50%;

            width: 52px;
            height: 52px;

            z-index: 100;

            border: 1px solid rgba(169, 74, 216, 0.48);

            background:
                rgba(18, 3, 28, 0.30);

            cursor: pointer;

            transform:
                translateY(-50%)
                rotate(45deg);

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1),
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;

            outline: none;

            box-shadow:
                0 0 18px rgba(102, 26, 148, 0.12);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .nav-left {
            left: 35px;
        }

        .nav-right {
            right: 35px;
        }

        /*
            Arrow itself.
        */

        .page-nav::after {
            content: "";

            width: 9px;
            height: 9px;

            border-right:
                1.5px solid rgba(232, 216, 245, 0.78);

            border-bottom:
                1.5px solid rgba(232, 216, 245, 0.78);

            transform:
                rotate(-45deg);

            transition:
                border-color 0.3s ease,
                filter 0.3s ease;
        }

        .nav-left::after {
            transform:
                rotate(135deg);
        }

        .nav-right::after {
            transform:
                rotate(-45deg);
        }

        .page-nav:hover {
            background:
                rgba(76, 9, 105, 0.30);

            border-color:
                rgba(194, 105, 239, 0.82);

            box-shadow:
                0 0 25px rgba(147, 46, 204, 0.25),
                0 0 55px rgba(72, 0, 108, 0.14);

            transform:
                translateY(-50%)
                rotate(45deg)
                scale(1.08);
        }

        .page-nav:hover::after {
            border-color:
                rgba(255, 239, 255, 0.96);
        }

        .page-nav:active {
            transform:
                translateY(-50%)
                rotate(45deg)
                scale(0.93);
        }

        .page-nav:focus-visible {
            border-color:
                rgba(230, 192, 255, 0.9);

            box-shadow:
                0 0 0 3px rgba(131, 50, 174, 0.15);
        }

        /* =========================================================
           CANVAS CORE
        ========================================================= */

        /*
            這裡不再做非常密集的棋盤。
            改成「暗淡幾何洞穴」。
        */

        let {
            dummy
        } = {};

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 760px) {
            .content-layer {
                padding: 35px;
            }

            .profile-box {
                width: min(92vw, 620px);

                padding:
                    42px 32px 36px;
            }

            .title {
                font-size: 2.45rem;
                letter-spacing: 0.09em;
            }

            .subtitle {
                font-size: 0.62rem;
                letter-spacing: 0.28em;
            }

            .desc {
                font-size: 0.86rem;
            }

            .page-nav {
                width: 44px;
                height: 44px;
            }

            .nav-left {
                left: 13px;
            }

            .nav-right {
                right: 13px;
            }

            .top-mark,
            .top-mark-right {
                font-size: 7px;
            }
        }

        @media (max-width: 480px) {
            .content-layer {
                padding:
                    25px 48px;
            }

            .profile-box {
                padding:
                    38px 24px 32px;
            }

            .title {
                font-size: 2.05rem;
            }

            .desc {
                font-size: 0.79rem;
                line-height: 1.9;
            }

            .page-nav {
                width: 36px;
                height: 36px;
            }

            .nav-left {
                left: 9px;
            }

            .nav-right {
                right: 9px;
            }

            .page-nav::after {
                width: 7px;
                height: 7px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         BACKGROUND
    ========================================================= -->

    <canvas id="void-canvas"></canvas>

    <div class="event-horizon"></div>
    <div class="void-glow"></div>
    <div class="vignette"></div>

    <!-- =========================================================
         DECORATION
    ========================================================= -->

    <div class="top-line"></div>
    <div class="bottom-line"></div>

    <div class="top-mark">
        NULLSCAPE // VORTEX
    </div>

    <div class="top-mark-right">
        ARCHIVE 07
    </div>

    <!-- =========================================================
         NAVIGATION
    ========================================================= -->

    <button
        class="page-nav nav-left"
        id="prevButton"
        type="button"
        aria-label="上一頁"
    ></button>

    <button
        class="page-nav nav-right"
        id="nextButton"
        type="button"
        aria-label="下一頁"
    ></button>

    <!-- =========================================================
         MAIN PROFILE
    ========================================================= -->

    <main class="content-layer">

        <section
            class="profile-box"
            id="profile-card"
            aria-live="polite"
        ></section>

    </main>

    <script>
        "use strict";

        /* =========================================================
           PAGE DATA
        ========================================================= */

        const pages = [
            {
                title: "NULLSCAPE",
                subtitle: "ENTITY_VOID",
                desc:
                    "[ 第一頁內容。 ]<br>" +
                    "[ 在不存在的空間裡，一切痕跡都會被吸入中心。 ]"
            },

            {
                title: "LORE // 01",
                subtitle: "THE ABYSSAL WHISPER",
                desc:
                    "[ 第二頁內容。 ]<br>" +
                    "[ 某些存在並非消失，只是逐漸失去被觀測的資格。 ]"
            },

            {
                title: "ARCHIVE",
                subtitle: "FINAL REALM",
                desc:
                    "[ 第三頁內容。 ]<br>" +
                    "[ 所有紀錄終將沉入虛空。 ]"
            }
        ];

        let currentPage = 0;

        let isSwitching = false;

        let switchTimeout = null;

        const card =
            document.getElementById("profile-card");

        const prevButton =
            document.getElementById("prevButton");

        const nextButton =
            document.getElementById("nextButton");

        /* =========================================================
           ESCAPE HTML
        ========================================================= */

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* =========================================================
           PAGE RENDER
        ========================================================= */

        function renderPage(pageIndex) {
            const page =
                pages[pageIndex];

            card.innerHTML = `
                <div class="title">
                    ${escapeHTML(page.title)}
                </div>

                <div class="subtitle">
                    ${escapeHTML(page.subtitle)}
                </div>

                <div class="desc">
                    ${page.desc}
                </div>

                <div class="page-indicator">
                    ${String(pageIndex + 1).padStart(2, "0")}
                    /
                    ${String(pages.length).padStart(2, "0")}
                </div>
            `;
        }

        /* =========================================================
           PAGE SWITCH
        ========================================================= */

        function switchPage(direction) {
            if (isSwitching) {
                return;
            }

            if (pages.length <= 1) {
                return;
            }

            isSwitching = true;

            clearTimeout(switchTimeout);

            const exitClass =
                direction > 0
                    ? "sucking-left"
                    : "sucking-right";

            const enterClass =
                direction > 0
                    ? "flying-left"
                    : "flying-right";

            /*
                清理任何前一次動畫。
            */

            card.classList.remove(
                "sucking-left",
                "sucking-right",
                "flying-left",
                "flying-right"
            );

            /*
                強制重新計算 layout，
                確保每次切頁動畫都會重新播放。
            */

            void card.offsetWidth;

            card.classList.add(exitClass);

            switchTimeout =
                setTimeout(() => {

                    currentPage =
                        (
                            currentPage +
                            direction +
                            pages.length
                        ) %
                        pages.length;

                    renderPage(currentPage);

                    card.classList.remove(exitClass);

                    void card.offsetWidth;

                    card.classList.add(enterClass);

                    setTimeout(() => {
                        card.classList.remove(
                            enterClass
                        );

                        isSwitching = false;

                    }, 650);

                }, 420);
        }

        /* =========================================================
           BUTTON EVENTS
        ========================================================= */

        prevButton.addEventListener(
            "click",
            () => switchPage(-1)
        );

        nextButton.addEventListener(
            "click",
            () => switchPage(1)
        );

        /* =========================================================
           KEYBOARD
        ========================================================= */

        window.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {
                    switchPage(-1);
                }

                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {
                    switchPage(1);
                }
            }
        );

        /* =========================================================
           TOUCH SWIPE
        ========================================================= */

        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener(
            "touchstart",
            (event) => {

                if (!event.touches.length) {
                    return;
                }

                touchStartX =
                    event.touches[0].clientX;

                touchStartY =
                    event.touches[0].clientY;

            },
            { passive: true }
        );

        window.addEventListener(
            "touchend",
            (event) => {

                if (!event.changedTouches.length) {
                    return;
                }

                const touch =
                    event.changedTouches[0];

                const deltaX =
                    touch.clientX -
                    touchStartX;

                const deltaY =
                    touch.clientY -
                    touchStartY;

                /*
                    只把明顯的左右滑動當成換頁。
                */

                if (
                    Math.abs(deltaX) < 55 ||
                    Math.abs(deltaX) <= Math.abs(deltaY)
                ) {
                    return;
                }

                if (deltaX < 0) {
                    switchPage(1);
                } else {
                    switchPage(-1);
                }

            },
            { passive: true }
        );

        renderPage(currentPage);

        /* =========================================================
           CANVAS
        ========================================================= */

        const canvas =
            document.getElementById("void-canvas");

        const ctx =
            canvas.getContext("2d", {
                alpha: false
            });

        let width = 0;
        let height = 0;

        let cx = 0;
        let cy = 0;

        let dpr = 1;

        let animationTime = 0;

        const PARTICLE_COUNT = 95;
        const SHARD_COUNT = 24;

        const particles = [];
        const shards = [];

        /* =========================================================
           RESIZE
        ========================================================= */

        function resizeCanvas() {
            dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

            width =
                window.innerWidth;

            height =
                window.innerHeight;

            cx =
                width * 0.5;

            cy =
                height * 0.5;

            canvas.width =
                Math.floor(width * dpr);

            canvas.height =
                Math.floor(height * dpr);

            canvas.style.width =
                `${width}px`;

            canvas.style.height =
                `${height}px`;

            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );
        }

        window.addEventListener(
            "resize",
            resizeCanvas
        );

        resizeCanvas();

        /* =========================================================
           RANDOM
        ========================================================= */

        function random(min, max) {
            return Math.random() *
                (max - min) +
                min;
        }

        function randomSign() {
            return Math.random() < 0.5
                ? -1
                : 1;
        }

        /* =========================================================
           PARTICLES
        ========================================================= */

        class VoidParticle {

            constructor() {
                this.reset(true);
            }

            reset(initial = false) {

                this.angle =
                    random(
                        0,
                        Math.PI * 2
                    );

                this.radius =
                    initial
                        ? random(
                            180,
                            Math.max(
                                width,
                                height
                            ) * 0.82
                        )
                        : random(
                            Math.max(
                                width,
                                height
                            ) * 0.55,
                            Math.max(
                                width,
                                height
                            ) * 0.90
                        );

                this.speed =
                    random(0.22, 0.65);

                this.angularSpeed =
                    random(
                        0.00015,
                        0.0008
                    ) *
                    randomSign();

                this.size =
                    random(0.5, 1.8);

                this.alpha =
                    random(
                        0.15,
                        0.48
                    );

                this.phase =
                    random(
                        0,
                        Math.PI * 2
                    );
            }

            update() {

                /*
                    越接近中心，
                    吸入速度越來越明顯。
                */

                const distanceFactor =
                    Math.max(
                        0.8,
                        280 /
                        Math.max(
                            this.radius,
                            40
                        )
                    );

                this.radius -=
                    this.speed *
                    distanceFactor;

                this.angle +=
                    this.angularSpeed *
                    distanceFactor;

                this.phase +=
                    0.018;

                if (this.radius < 38) {
                    this.reset(false);
                }
            }

            draw() {

                const x =
                    cx +
                    Math.cos(this.angle) *
                    this.radius;

                const y =
                    cy +
                    Math.sin(this.angle) *
                    this.radius;

                const pulse =
                    0.72 +
                    Math.sin(this.phase) *
                    0.28;

                const alpha =
                    this.alpha *
                    pulse *
                    Math.min(
                        1,
                        this.radius / 180
                    );

                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    this.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(
                        184,
                        137,
                        216,
                        ${alpha}
                    )`;

                ctx.fill();
            }
        }

        /* =========================================================
           GEOMETRIC SHARDS
        ========================================================= */

        class VoidShard {

            constructor() {
                this.reset(true);
            }

            reset(initial = false) {

                this.angle =
                    random(
                        0,
                        Math.PI * 2
                    );

                this.radius =
                    initial
                        ? random(
                            360,
                            Math.max(
                                width,
                                height
                            ) * 0.75
                        )
                        : random(
                            Math.max(
                                width,
                                height
                            ) * 0.68,
                            Math.max(
                                width,
                                height
                            ) * 0.95
                        );

                this.size =
                    random(8, 24);

                this.speed =
                    random(0.16, 0.42);

                this.rotation =
                    random(
                        0,
                        Math.PI * 2
                    );

                this.rotationSpeed =
                    random(
                        -0.008,
                        0.008
                    );

                this.scaleY =
                    random(
                        0.65,
                        1.55
                    );

                this.alpha =
                    random(
                        0.12,
                        0.32
                    );
            }

            update() {

                const pull =
                    Math.max(
                        1,
                        220 /
                        Math.max(
                            this.radius,
                            50
                        )
                    );

                this.radius -=
                    this.speed *
                    pull;

                this.rotation +=
                    this.rotationSpeed;

                this.angle +=
                    0.00035 *
                    pull *
                    randomSign();

                if (this.radius < 55) {
                    this.reset(false);
                }
            }

            draw() {

                const x =
                    cx +
                    Math.cos(this.angle) *
                    this.radius;

                const y =
                    cy +
                    Math.sin(this.angle) *
                    this.radius;

                const visibility =
                    Math.min(
                        1,
                        this.radius / 160
                    );

                ctx.save();

                ctx.translate(x, y);

                ctx.rotate(
                    this.rotation
                );

                ctx.scale(
                    1,
                    this.scaleY
                );

                /*
                    深紫幾何碎片。
                */

                ctx.beginPath();

                ctx.moveTo(
                    0,
                    -this.size
                );

                ctx.lineTo(
                    this.size * 0.46,
                    -this.size * 0.18
                );

                ctx.lineTo(
                    this.size * 0.18,
                    this.size
                );

                ctx.lineTo(
                    -this.size * 0.58,
                    this.size * 0.55
                );

                ctx.closePath();

                ctx.fillStyle =
                    `rgba(
                        24,
                        8,
                        35,
                        ${this.alpha *
                        visibility}
                    )`;

                ctx.fill();

                ctx.strokeStyle =
                    `rgba(
                        128,
                        54,
                        165,
                        ${this.alpha *
                        0.85 *
                        visibility}
                    )`;

                ctx.lineWidth = 0.8;

                ctx.stroke();

                ctx.restore();
            }
        }

        /* =========================================================
           VORTEX RINGS
        ========================================================= */

        let vortexRotation = 0;
        let vortexPulse = 0;

        function drawVortex() {

            vortexRotation += 0.00045;
            vortexPulse += 0.022;

            const baseRadius =
                Math.min(
                    width,
                    height
                ) * 0.22;

            ctx.save();

            ctx.translate(
                cx,
                cy
            );

            ctx.rotate(
                vortexRotation
            );

            /*
                只保留幾個淡淡的環。
            */

            for (
                let i = 0;
                i < 5;
                i++
            ) {

                const pulse =
                    Math.sin(
                        vortexPulse +
                        i * 0.8
                    );

                const radius =
                    baseRadius +
                    i * 62 +
                    pulse * 5;

                ctx.beginPath();

                ctx.ellipse(
                    0,
                    0,
                    radius,
                    radius * (
                        0.58 +
                        i * 0.05
                    ),
                    0,
                    0,
                    Math.PI * 2
                );

                const alpha =
                    0.038 -
                    i * 0.004;

                ctx.strokeStyle =
                    `rgba(
                        133,
                        39,
                        174,
                        ${Math.max(
                            alpha,
                            0.012
                        )}
                    )`;

                ctx.lineWidth =
                    i === 0
                        ? 1.15
                        : 0.7;

                ctx.stroke();
            }

            ctx.restore();
        }

        /* =========================================================
           CENTRAL BLACK HOLE
        ========================================================= */

        function drawBlackHole() {

            const radius =
                Math.min(
                    width,
                    height
                ) * 0.065;

            /*
                Outer halo.
            */

            const halo =
                ctx.createRadialGradient(
                    cx,
                    cy,
                    radius * 0.4,
                    cx,
                    cy,
                    radius * 2.7
                );

            halo.addColorStop(
                0,
                "rgba(92, 20, 126, 0.02)"
            );

            halo.addColorStop(
                0.42,
                "rgba(120, 48, 163, 0.07)"
            );

            halo.addColorStop(
                0.68,
                "rgba(83, 23, 112, 0.055)"
            );

            halo.addColorStop(
                1,
                "rgba(0, 0, 0, 0)"
            );

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                radius * 2.7,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = halo;
            ctx.fill();

            /*
                Event horizon.
            */

            const black =
                ctx.createRadialGradient(
                    cx,
                    cy,
                    0,
                    cx,
                    cy,
                    radius * 1.38
                );

            black.addColorStop(
                0,
                "rgba(0, 0, 0, 1)"
            );

            black.addColorStop(
                0.72,
                "rgba(0, 0, 0, 0.99)"
            );

            black.addColorStop(
                1,
                "rgba(0, 0, 0, 0)"
            );

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                radius * 1.38,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = black;
            ctx.fill();

            /*
                一圈非常細的紫色邊緣。
            */

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                radius * 1.06,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle =
                "rgba(167, 74, 210, 0.20)";

            ctx.lineWidth = 1;

            ctx.stroke();
        }

        /* =========================================================
           CREATE OBJECTS
        ========================================================= */

        for (
            let i = 0;
            i < PARTICLE_COUNT;
            i++
        ) {
            particles.push(
                new VoidParticle()
            );
        }

        for (
            let i = 0;
            i < SHARD_COUNT;
            i++
        ) {
            shards.push(
                new VoidShard()
            );
        }

        /* =========================================================
           ANIMATION
        ========================================================= */

        let lastTime = performance.now();

        function animate(now) {

            /*
                使用實際 delta time，
                避免高刷新率螢幕跑太快。
            */

            const delta =
                Math.min(
                    now - lastTime,
                    34
                );

            lastTime = now;

            animationTime += delta;

            /*
                清除畫面。
            */

            ctx.fillStyle =
                "#010102";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );

            /*
                Vortex.
            */

            drawVortex();

            /*
                Particles.
            */

            for (const particle of particles) {

                particle.update();

                particle.draw();
            }

            /*
                Shards.
            */

            for (const shard of shards) {

                shard.update();

                shard.draw();
            }

            /*
                Central void.
            */

            drawBlackHole();

            requestAnimationFrame(
                animate
            );
        }

        requestAnimationFrame(
            animate
        );
    </script>
</body>
</html>
