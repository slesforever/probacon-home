<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>probaocon // NULLSCAPE VOID ARCHIVE</title>
    <!-- 導入哥德風格與暗黑 serif 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Pirata+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --void-bg: #030007;
            --null-purple: #9d00ff;
            --null-crimson: #ff0055;
            --null-cyan: #00f0ff;
            --glow-purple: rgba(157, 0, 255, 0.6);
            --card-glass: rgba(12, 4, 24, 0.82);
            --mouse-x: 50%;
            --mouse-y: 50%;
            --tilt-x: 0deg;
            --tilt-y: 0deg;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--void-bg);
            color: #ebd9ff;
            font-family: 'Cinzel', serif;
        }

        /* --- 視覺 Canvas 圖層 --- */
        #null-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- 開場觸發動畫 (Splash Layer) --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #020005;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s ease, filter 0.8s ease;
        }

        #splash-screen.dissolve {
            opacity: 0;
            filter: blur(20px) contrast(200%);
            transform: scale(1.15);
            pointer-events: none;
        }

        /* 開場多眼巨獸標誌 (Inspired by Nullscape Monster) */
        .splash-entity {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseEntity 3s infinite ease-in-out;
        }

        @keyframes pulseEntity {
            0%, 100% { transform: scale(0.96); filter: drop-shadow(0 0 15px var(--null-purple)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 35px var(--null-crimson)); }
        }

        .splash-title {
            margin-top: 30px;
            font-family: 'Pirata One', cursive, serif;
            font-size: 2rem;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 12px var(--null-purple), 0 0 25px var(--null-crimson);
        }

        .splash-sub {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--null-cyan);
            letter-spacing: 3px;
            margin-top: 10px;
            opacity: 0.8;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }

        /* --- 主 UI 佈局 --- */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            opacity: 0;
            transform: scale(0.92);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .main-container.active {
            opacity: 1;
            transform: scale(1);
        }

        /* --- 懸浮卡片容器 (3D Tilt) --- */
        .null-card {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 88%;
            max-width: 580px;
            padding: 50px 40px;
            position: relative;
            border: 1px solid rgba(157, 0, 255, 0.4);
            box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 30px rgba(157, 0, 255, 0.12);
            transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x));
            transition: transform 0.15s ease-out, opacity 0.4s ease, filter 0.4s ease;
            overflow: hidden;
        }

        /* 卡片光感掠影 */
        .null-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(189, 0, 255, 0.15), transparent 60%);
            pointer-events: none;
        }

        /* 標題與內文 */
        .header-tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.65rem;
            color: var(--null-cyan);
            letter-spacing: 5px;
            text-align: center;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        h1.user-name {
            font-family: 'Pirata One', cursive, serif;
            font-size: clamp(2.8rem, 8vw, 4rem);
            letter-spacing: 12px;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 15px var(--null-purple), 0 0 30px rgba(255, 0, 85, 0.6);
            margin-bottom: 5px;
        }

        .sub-tag {
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: rgba(235, 217, 255, 0.6);
            margin-bottom: 35px;
        }

        /* 資料列樣式 */
        .data-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
            min-height: 180px;
        }

        .data-row {
            border-left: 2px solid var(--null-purple);
            padding-left: 15px;
            position: relative;
            transition: all 0.3s ease;
        }

        .data-row:hover {
            border-left-color: var(--null-crimson);
            box-shadow: -5px 0 15px rgba(255, 0, 85, 0.3);
        }

        .data-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--null-cyan);
            letter-spacing: 2px;
            margin-bottom: 4px;
            display: block;
        }

        .data-value {
            font-size: 1.05rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(157, 0, 255, 0.5);
        }

        /* --- 兩側導航按鈕 --- */
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background: rgba(12, 4, 24, 0.85);
            border: 1px solid var(--null-purple);
            box-shadow: 0 0 15px var(--glow-purple);
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .nav-btn-left { left: clamp(15px, 4vw, 40px); }
        .nav-btn-right { right: clamp(15px, 4vw, 40px); }

        .nav-btn::after {
            content: "";
            width: 12px;
            height: 12px;
            border-top: 2px solid var(--null-cyan);
            border-right: 2px solid var(--null-cyan);
            transition: all 0.3s ease;
        }

        .nav-btn-left::after { transform: rotate(-135deg); }
        .nav-btn-right::after { transform: rotate(45deg); }

        .nav-btn:hover {
            background: var(--null-purple);
            box-shadow: 0 0 25px var(--null-purple), 0 0 40px var(--null-crimson);
            transform: translateY(-50%) scale(1.15);
        }

        .nav-btn:hover::after { border-color: #fff; }

        /* 角邊幾何印記 (Nullscape Cube Sign) */
        .corner-glyph {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 1px solid var(--null-cyan);
            transform: rotate(45deg);
        }
        .cg-tl { top: 8px; left: 8px; }
        .cg-tr { top: 8px; right: 8px; }
        .cg-bl { bottom: 8px; left: 8px; }
        .cg-br { bottom: 8px; right: 8px; }

        .page-indicator {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.65rem;
            color: var(--null-cyan);
            letter-spacing: 2px;
            opacity: 0.6;
        }

        /* 切頁動畫 */
        .null-card.page-next { animation: pageSlideNext 0.4s ease forwards; }
        .null-card.page-prev { animation: pageSlidePrev 0.4s ease forwards; }

        @keyframes pageSlideNext {
            0% { opacity: 1; transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) translateX(0); }
            50% { opacity: 0; transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) translateX(-40px) scale(0.95); filter: blur(10px); }
            100% { opacity: 1; transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) translateX(0); }
        }

        @keyframes pageSlidePrev {
            0% { opacity: 1; transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) translateX(0); }
            50% { opacity: 0; transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) translateX(40px) scale(0.95); filter: blur(10px); }
            100% { opacity: 1; transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) translateX(0); }
        }
    </style>
</head>
<body>

    <!-- 視覺渲染 Canvas -->
    <canvas id="null-canvas"></canvas>

    <!-- 開頭點擊動畫層 (Splash Screen) -->
    <div id="splash-screen">
        <div class="splash-entity">
            <!-- 擬真超現實多眼符號 SVG -->
            <svg viewBox="0 0 200 200" width="160" height="160">
                <path d="M100 20 C130 60 180 80 180 100 C180 120 130 140 100 180 C70 140 20 120 20 100 C20 80 70 60 100 20 Z" fill="none" stroke="#bd00ff" stroke-width="2"/>
                <circle cx="100" cy="100" r="35" fill="#030007" stroke="#ff0055" stroke-width="2"/>
                <rect x="88" y="88" width="24" height="24" fill="none" stroke="#00f0ff" stroke-width="2" transform="rotate(45 100 100)"/>
                <!-- 散落的小眼精靈 -->
                <circle cx="65" cy="75" r="6" fill="#00f0ff"/><circle cx="135" cy="75" r="6" fill="#00f0ff"/>
                <circle cx="65" cy="125" r="6" fill="#ff0055"/><circle cx="135" cy="125" r="6" fill="#ff0055"/>
            </svg>
        </div>
        <div class="splash-title">NULLSCAPE</div>
        <div class="splash-sub">[ CLICK TO ENTER THE VOID ]</div>
    </div>

    <!-- 導航按鈕 -->
    <button class="nav-btn nav-btn-left" id="btn-prev" aria-label="Previous"></button>
    <button class="nav-btn nav-btn-right" id="btn-next" aria-label="Next"></button>

    <!-- 主 UI 卡片 -->
    <div class="main-container" id="main-container">
        <div class="null-card" id="null-card">
            <div class="corner-glyph cg-tl"></div><div class="corner-glyph cg-tr"></div>
            <div class="corner-glyph cg-bl"></div><div class="corner-glyph cg-br"></div>

            <div class="header-tag" id="card-tag">// NULL_PROFILE_ARCHIVE</div>
            <h1 class="user-name">probaocon</h1>
            <div class="sub-tag" id="card-sub">VOID WALKER // UNKNOWN ENTITY</div>

            <div class="data-list" id="data-list">
                <!-- 資料項目預留區 (Data Field Templates) -->
            </div>

            <div class="page-indicator" id="page-indicator">SECTOR 01 / 03</div>
        </div>
    </div>

    <script>
        /* --- Web Audio API 音效與低音合成器 (Nullscape Ambient Drone) --- */
        class NullAudioEngine {
            constructor() {
                this.ctx = null;
                this.isStarted = false;
            }

            init() {
                if (this.isStarted) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.isStarted = true;
                this.startVoidDrone();
            }

            startVoidDrone() {
                if (!this.ctx) return;
                // 深層虛空低音振盪器
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(45, this.ctx.currentTime); // 低頻 Low F

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(140, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.18, this.ctx.currentTime + 3);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
            }

            playTriggerSfx() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
            }
        }

        const audioEngine = new NullAudioEngine();

        /* --- 頁面資料資料集 (Templates) --- */
        const profilePages = [
            {
                tag: "// NULL_PROFILE_ARCHIVE",
                sub: "VOID WALKER // UNKNOWN ENTITY",
                rows: [
                    { label: "ENTITY_ID", value: "[ EMPTY FIELD ]" },
                    { label: "STATUS / EGO", value: "[ EMPTY FIELD ]" },
                    { label: "ALIGNMENT", value: "[ UNKNOWN ]" }
                ]
            },
            {
                tag: "// RECORDS_DATABASE",
                sub: "ARCHIVED TRANSMISSIONS",
                rows: [
                    { label: "PROJECT_LOG_01", value: "[ UNASSIGNED DATA ]" },
                    { label: "PROJECT_LOG_02", value: "[ UNASSIGNED DATA ]" }
                ]
            },
            {
                tag: "// VOID_COMMUNICATIONS",
                sub: "CONNECTIVITY LINK",
                rows: [
                    { label: "SIGNAL_SOURCE", value: "[ DISCONNECTED ]" },
                    { label: "EXTERNAL_LINK", value: "[ NONE ]" }
                ]
            }
        ];

        let currentPage = 0;
        let isSwitching = false;

        /* --- 頁面渲染與切換邏輯 --- */
        const nullCard = document.getElementById('null-card');
        const dataList = document.getElementById('data-list');
        const cardTag = document.getElementById('card-tag');
        const cardSub = document.getElementById('card-sub');
        const pageIndicator = document.getElementById('page-indicator');

        function renderPage(index) {
            const data = profilePages[index];
            cardTag.textContent = data.tag;
            cardSub.textContent = data.sub;
            
            dataList.innerHTML = data.rows.map(row => `
                <div class="data-row">
                    <span class="data-label">${row.label}</span>
                    <span class="data-value">${row.value}</span>
                </div>
            `).join('');

            pageIndicator.textContent = `SECTOR 0${index + 1} / 0${profilePages.length}`;
        }

        function switchPage(dir) {
            if (isSwitching) return;
            isSwitching = true;
            audioEngine.playTriggerSfx();

            const animClass = dir === 'next' ? 'page-next' : 'page-prev';
            nullCard.classList.add(animClass);

            setTimeout(() => {
                if (dir === 'next') {
                    currentPage = (currentPage + 1) % profilePages.length;
                } else {
                    currentPage = (currentPage - 1 + profilePages.length) % profilePages.length;
                }
                renderPage(currentPage);
            }, 200);

            setTimeout(() => {
                nullCard.classList.remove(animClass);
                isSwitching = false;
            }, 450);
        }

        document.getElementById('btn-next').addEventListener('click', () => switchPage('next'));
        document.getElementById('btn-prev').addEventListener('click', () => switchPage('prev'));

        /* 鍵盤切頁控制 */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') switchPage('next');
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') switchPage('prev');
        });

        /* --- 3D 卡片傾斜與滑鼠跟蹤 --- */
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            const rect = nullCard.getBoundingClientRect();
            nullCard.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            nullCard.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);

            const tiltX = ((e.clientX - window.innerWidth / 2) / (window.innerWidth / 2)) * 6;
            const tiltY = ((e.clientY - window.innerHeight / 2) / (window.innerHeight / 2)) * -6;

            nullCard.style.setProperty('--tilt-x', `${tiltX}deg`);
            nullCard.style.setProperty('--tilt-y', `${tiltY}deg`);
        });

        /* --- 開場點擊解鎖 --- */
        const splash = document.getElementById('splash-screen');
        const mainContainer = document.getElementById('main-container');

        splash.addEventListener('click', () => {
            audioEngine.init();
            audioEngine.playTriggerSfx();
            splash.classList.add('dissolve');
            setTimeout(() => {
                splash.style.display = 'none';
                mainContainer.classList.add('active');
            }, 700);
        });

        /* --- Nullscape Canvas 特效 (扭曲棋盤道路、黑洞吸積、斷裂鎖鏈與追隨虛空之眼) --- */
        const canvas = document.getElementById('null-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 虛空眨眼與浮動鎖鏈結構
        const voidEyes = Array.from({ length: 9 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 14 + 10,
            blinkTimer: Math.random() * 200
        }));

        let angleOffset = 0;

        function drawNullscapeBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // 1. 中央漩渦黑洞與極光暈
            const bgGlow = ctx.createRadialGradient(cx, cy, 20, cx, cy, Math.max(cx, cy));
            bgGlow.addColorStop(0, '#000000');
            bgGlow.addColorStop(0.3, '#100122');
            bgGlow.addColorStop(0.7, '#04000a');
            bgGlow.addColorStop(1, '#020004');
            ctx.fillStyle = bgGlow;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 扭曲 3D 螺旋棋盤格道路 (Winding Checkered Ribbon Road)
            angleOffset += 0.008;
            ctx.save();
            ctx.translate(cx, cy);

            const numRings = 16;
            const segments = 24;

            for (let r = numRings; r > 0; r--) {
                const radius = Math.pow(r / numRings, 2.2) * (Math.max(cx, cy) * 1.1);
                const prevRadius = Math.pow((r - 1) / numRings, 2.2) * (Math.max(cx, cy) * 1.1);

                for (let s = 0; s < segments; s++) {
                    const a1 = (s / segments) * Math.PI * 2 + angleOffset + (r * 0.05);
                    const a2 = ((s + 1) / segments) * Math.PI * 2 + angleOffset + (r * 0.05);

                    ctx.beginPath();
                    ctx.arc(0, 0, radius, a1, a2);
                    ctx.arc(0, 0, prevRadius, a2, a1, true);
                    ctx.closePath();

                    const isEven = (r + s) % 2 === 0;
                    ctx.fillStyle = isEven ? 'rgba(157, 0, 255, 0.28)' : 'rgba(5, 1, 12, 0.85)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(157, 0, 255, 0.15)';
                    ctx.stroke();
                }
            }
            ctx.restore();

            // 3. 散落眨眼的超現實虛空之眼 (Eyes following mouse)
            voidEyes.forEach(eye => {
                eye.blinkTimer += 0.05;
                const isBlinking = Math.sin(eye.blinkTimer) > 0.94;

                ctx.save();
                ctx.translate(eye.x, eye.y);

                if (!isBlinking) {
                    // 眼白輪廓
                    ctx.beginPath();
                    ctx.ellipse(0, 0, eye.size, eye.size * 0.6, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#100020';
                    ctx.strokeStyle = '#bd00ff';
                    ctx.lineWidth = 1.5;
                    ctx.fill();
                    ctx.stroke();

                    // 瞳孔跟隨滑鼠
                    const dx = mouseX - eye.x;
                    const dy = mouseY - eye.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const pupilX = (dx / dist) * (eye.size * 0.3);
                    const pupilY = (dy / dist) * (eye.size * 0.2);

                    ctx.beginPath();
                    ctx.arc(pupilX, pupilY, eye.size * 0.28, 0, Math.PI * 2);
                    ctx.fillStyle = '#00f0ff';
                    ctx.fill();
                } else {
                    // 眨眼縫隙
                    ctx.beginPath();
                    ctx.moveTo(-eye.size, 0);
                    ctx.lineTo(eye.size, 0);
                    ctx.strokeStyle = '#ff0055';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                ctx.restore();
            });

            requestAnimationFrame(drawNullscapeBackground);
        }

        // 初始化
        renderPage(0);
        drawNullscapeBackground();
    </script>
</body>
</html>
