<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULLSPACE // TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #020408;
            color: #d1f4ff;
            font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 掃描線特效 */
        body::before {
            content: " ";
            position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 20; pointer-events: none; opacity: 0.6;
        }

        #starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        .terminal-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 460px;
            background: rgba(6, 12, 24, 0.85);
            border: 1px solid #00d2ff44;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.15), inset 0 0 15px rgba(0, 210, 255, 0.05);
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            padding-bottom: 12px;
            margin-bottom: 24px;
            font-size: 0.7rem;
            color: #00d2ff;
            letter-spacing: 2px;
        }

        .glitch-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
            position: relative;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #5d8aa8;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .info-block {
            background: rgba(0, 210, 255, 0.03);
            border-left: 2px solid #00d2ff;
            padding: 12px 16px;
            font-size: 0.82rem;
            line-height: 1.6;
            color: #b0d8e6;
            margin-bottom: 28px;
        }

        .action-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 210, 255, 0.15);
            color: #88c0d0;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .action-item:hover {
            background: rgba(0, 210, 255, 0.15);
            color: #ffffff;
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
            transform: translateX(4px);
        }

        .action-item::after {
            content: '→';
            font-weight: bold;
        }

        .footer-tag {
            margin-top: 24px;
            font-size: 0.65rem;
            color: rgba(0, 210, 255, 0.4);
            text-align: right;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>

    <div class="terminal-card">
        <div class="terminal-header">
            <span>[ NULLSPACE_OS ]</span>
            <span>ID: 0x9F4A</span>
        </div>

        <div class="glitch-title">SLES_ARCHIVE</div>
        <div class="subtitle">LUAU SCRIPTING / VOID GAME DESIGN</div>

        <div class="info-block">
            > Creating immersive game mechanics.<br>
            > Specialized in Roblox Luau & Spatial Environments.
        </div>

        <div class="action-list">
            <a href="#" class="action-item"><span>ROBLOX CREATOR HUB</span></a>
            <a href="#" class="action-item"><span>GITHUB REPOSITORY</span></a>
            <a href="#" class="action-item"><span>DISCORD CONTACT</span></a>
        </div>

        <div class="footer-tag">
            STATUS: ACTIVE // MEMORY: NOMINAL
        </div>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    z: Math.random() * canvas.width,
                    o: Math.random()
                });
            }
        }

        function draw() {
            ctx.fillStyle = '#020408';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];
                star.z -= 0.8;
                if (star.z <= 0) star.z = canvas.width;

                let k = 128 / star.z;
                let px = (star.x - canvas.width / 2) * k + canvas.width / 2;
                let py = (star.y - canvas.height / 2) * k + canvas.height / 2;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    let size = (1 - star.z / canvas.width) * 2.2;
                    ctx.fillStyle = `rgba(0, 210, 255, ${1 - star.z / canvas.width})`;
                    ctx.fillRect(px, py, size, size);
                }
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        draw();
    </script>
</body>
</html>
