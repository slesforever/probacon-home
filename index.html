<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>probaon // Personal Profile & Archive</title>
    
    <!-- 導入影片同款頂級字體：Cinzel (典雅襯線) & Space Mono (極簡數據字體) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,400;0,700;0,900;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- 引入 3D 渲染引擎 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --blue-royal: #0012ff;
            --blue-bright: #0055ff;
            --blue-glow: rgba(0, 18, 255, 0.7);
            --bg-void: #02040a;
            --white: #ffffff;
            --font-serif: 'Cinzel', serif;
            --font-mono: 'Space Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-void);
            color: #fff;
            font-family: var(--font-serif);
            overflow: hidden;
        }

        /* --- 3D WebGL Canvas --- */
        #webgl-container {
            position: fixed; inset: 0;
            z-index: 1;
        }

        /* --- 特效層：暗角與震屏 --- */
        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
            background: radial-gradient(circle at center, transparent 20%, rgba(2, 4, 10, 0.95) 90%);
        }

        .screen-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 2px, 0); }
            20%, 80% { transform: translate3d(6px, -4px, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 8px, 0); }
            40%, 60% { transform: translate3d(8px, -6px, 0); }
        }

        /* --- 1. Sol's RNG 抽卡入場動畫 (Roll Cutscene Overlay) --- */
        #roll-overlay {
            position: fixed; inset: 0; z-index: 100;
            background-color: var(--bg-void);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center;
            padding: 20px;
        }

        .roll-start-btn {
            padding: 18px 45px;
            background: transparent;
            border: 2px solid var(--blue-bright);
            color: #fff;
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 6px;
            cursor: pointer;
            box-shadow: 0 0 30px var(--blue-glow);
            transition: all 0.3s ease;
        }

        .roll-start-btn:hover {
            background: var(--blue-royal);
            box-shadow: 0 0 60px var(--blue-royal);
            transform: scale(1.05);
        }

        /* 抽卡前奏數據流 */
        .roll-status-group {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .roll-text-sub {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--blue-bright);
            letter-spacing: 6px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px var(--blue-glow);
        }

        .roll-text-main {
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 12px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 30px var(--blue-royal), 0 0 60px #fff;
            opacity: 0;
            transform: scale(3);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
        }

        .roll-text-main.slam {
            opacity: 1;
            transform: scale(1);
        }

        .flash-bang {
            position: fixed; inset: 0; z-index: 200;
            background: #ffffff;
            opacity: 0; pointer-events: none;
            transition: opacity 0.12s ease-out;
        }

        /* --- 2. Sol's RNG 風格個人資料卡 (Profile UI) --- */
        #profile-ui {
            position: fixed; inset: 0; z-index: 10;
            pointer-events: none;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: translateY(30px) scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        #profile-ui.active {
            opacity: 1; transform: translateY(0) scale(1);
        }

        .profile-card {
            pointer-events: auto;
            width: 92%; max-width: 580px;
            background: rgba(3, 7, 18, 0.88);
            border: 1px solid rgba(0, 85, 255, 0.45);
            box-shadow: 0 0 60px rgba(0, 18, 255, 0.35), inset 0 0 30px rgba(0, 85, 255, 0.15);
            backdrop-filter: blur(18px);
            padding: 35px 40px;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 25px 100%, 0 calc(100% - 25px));
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 12px; margin-bottom: 20px;
            font-family: var(--font-mono); font-size: 0.75rem;
        }

        .rarity-badge {
            color: #fff; font-weight: bold; letter-spacing: 2px;
            background: var(--blue-royal); padding: 4px 12px;
            box-shadow: 0 0 15px var(--blue-royal);
        }

        .biome-badge {
            color: var(--blue-bright); letter-spacing: 1px;
            border: 1px solid rgba(0, 85, 255, 0.5); padding: 3px 10px;
            background: rgba(0, 85, 255, 0.1);
        }

        .user-title {
            font-size: clamp(2.4rem, 5vw, 3.5rem);
            font-style: italic; font-weight: 900;
            letter-spacing: 4px; color: #fff;
            text-shadow: 0 0 20px var(--blue-royal), 0 0 40px #fff;
            line-height: 1.1;
        }

        .user-sub {
            font-family: var(--font-mono); font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.75); letter-spacing: 4px;
            margin-bottom: 22px; margin-top: 4px;
        }

        /* 頁籤選單 */
        .tab-menu {
            display: flex; gap: 8px; margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: transparent; border: none; color: rgba(255, 255, 255, 0.5);
            font-family: var(--font-mono); font-size: 0.75rem; font-weight: bold;
            letter-spacing: 2px; cursor: pointer; padding: 4px 10px;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            color: #fff; background: rgba(0, 85, 255, 0.2);
            border-bottom: 2px solid var(--blue-bright);
        }

        /* 內容數據區 */
        .tab-content { display: none; flex-direction: column; gap: 12px; font-family: var(--font-mono); font-size: 0.8rem; }
        .tab-content.active { display: flex; }

        .data-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.03); padding: 10px 14px;
            border-left: 3px solid var(--blue-bright);
        }

        .data-key { color: rgba(255, 255, 255, 0.5); letter-spacing: 1px; }
        .data-val { color: #fff; font-weight: bold; letter-spacing: 1px; }

        /* 底部操作鈕 */
        .card-actions {
            margin-top: 25px; display: flex; gap: 12px;
        }

        .btn-ui {
            flex: 1; padding: 12px;
            background: transparent; border: 1px solid var(--blue-bright);
            color: #fff; font-family: var(--font-serif); font-weight: bold;
            letter-spacing: 2px; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 0 12px rgba(0, 85, 255, 0.2);
        }

        .btn-ui:hover {
            background: var(--blue-royal); border-color: #fff;
            box-shadow: 0 0 25px var(--blue-royal);
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <div class="vignette"></div>
    <div class="flash-bang" id="flash"></div>

    <!-- 1. Sol's RNG 抽卡入場動畫 Cutscene Overlay -->
    <div id="roll-overlay">
        <button class="roll-start-btn" id="start-btn" onclick="triggerAuraRoll()">ROLL AURA</button>

        <div class="roll-status-group" id="roll-status">
            <div class="roll-text-sub" id="roll-sub">BIOME: CYBERSPACE DETECTED...</div>
            <div class="roll-text-main" id="roll-title">𝚒𝚕𝚕𝚞𝚜𝚒𝚘𝚗𝚊𝚛𝚢</div>
        </div>
    </div>

    <!-- 2. Sol's RNG 風格個人資料歸檔卡 (probaon Profile UI) -->
    <div id="profile-ui">
        <div class="profile-card">
            <div class="card-header">
                <span class="rarity-badge">1 IN 100,000,000</span>
                <span class="biome-badge">CYBERSPACE // PERFECT PUPPET</span>
            </div>

            <!-- 個人名字與稱號 -->
            <div class="user-title">probaon</div>
            <div class="user-sub">-</div>

            <!-- 頁籤切換 -->
            <div class="tab-menu">
                <button class="tab-btn active" onclick="switchTab('profile')">PROFILE</button>
                <button class="tab-btn" onclick="switchTab('skills')">SKILLS</button>
                <button class="tab-btn" onclick="switchTab('projects')">PROJECTS</button>
            </div>

            <!-- 頁籤 1: 個人檔案 -->
            <div class="tab-content active" id="tab-profile">
                <div class="data-row">
                    <span class="data-key">ALIAS</span>
                    <span class="data-val">-</span>
                </div>
                <div class="data-row">
                    <span class="data-key">ROLE</span>
                    <span class="data-val">-</span>
                </div>
                <div class="data-row">
                    <span class="data-key">SPECIALTY</span>
                    <span class="data-val">-</span>
                </div>
                <div class="data-row">
                    <span class="data-key">STATUS</span>
                    <span class="data-val">-</span>
                </div>
            </div>

            <!-- 頁籤 2: 核心能力 -->
            <div class="tab-content" id="tab-skills">
                <div class="data-row">
                    <span class="data-key">SKILL I</span>
                    <span class="data-val">-</span>
                </div>
                <div class="data-row">
                    <span class="data-key">SKILL II</span>
                    <span class="data-val">-</span>
                </div>
                <div class="data-row">
                    <span class="data-key">SKILL III</span>
                    <span class="data-val">-</span>
                </div>
            </div>

            <!-- 頁籤 3: 專案作品 -->
            <div class="tab-content" id="tab-projects">
                <div class="data-row">
                    <span class="data-key">PROJECT I</span>
                    <span class="data-val">-</span>
                </div>
                <div class="data-row">
                    <span class="data-key">PROJECT II</span>
                    <span class="data-val">-</span>
                </div>
                <div class="data-row">
                    <span class="data-key">PROJECT III</span>
                    <span class="data-val">-</span>
                </div>
            </div>

            <div class="card-actions">
                <button class="btn-ui" onclick="replayRollCutscene()">ROLL AGAIN</button>
                <button class="btn-ui" onclick="triggerCorePulse()">PULSE CORE</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================================
           1. Web Audio API 音效合成器 (重現 Sol's RNG 抽卡蓄力與爆炸衝擊波)
           ========================================================================= */
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSoundSequence(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'charge') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 2.2);
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.25, now + 2.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 2.2);

            } else if (type === 'slam') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.8);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.8);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.8);
            }
        }

        /* =========================================================================
           2. Sol's RNG 抽卡入場 Cutscene 流程控制
           ========================================================================= */
        const startBtn = document.getElementById('start-btn');
        const rollStatus = document.getElementById('roll-status');
        const rollSub = document.getElementById('roll-sub');
        const rollTitle = document.getElementById('roll-title');
        const rollOverlay = document.getElementById('roll-overlay');
        const flash = document.getElementById('flash');
        const profileUI = document.getElementById('profile-ui');

        function triggerAuraRoll() {
            initAudio();
            startBtn.style.display = "none";
            rollStatus.style.display = "flex";
            rollTitle.classList.remove('slam');

            playSoundSequence('charge');

            const subTexts = [
                "BIOME: CYBERSPACE DETECTED...",
                "ROLLING CHANCE: 1 IN 100,000,000...",
                "EQUIPMENT ARCHIVE LOADING...",
                "AURA FOUND: 𝚒𝚕𝚕𝚞𝚜𝚒𝚘𝚗𝚊𝚛𝚢"
            ];
            let subIdx = 0;
            const subTimer = setInterval(() => {
                rollSub.textContent = subTexts[subIdx % subTexts.length];
                subIdx++;
            }, 500);

            setTimeout(() => {
                clearInterval(subTimer);
                playSoundSequence('slam');

                document.body.classList.add('screen-shake');
                flash.style.opacity = "1";
                rollTitle.classList.add('slam');

                setTimeout(() => {
                    document.body.classList.remove('screen-shake');
                    flash.style.opacity = "0";
                }, 150);

                setTimeout(() => {
                    rollOverlay.style.opacity = "0";
                    setTimeout(() => {
                        rollOverlay.style.display = "none";
                        profileUI.classList.add('active');
                    }, 500);
                }, 1800);

            }, 2200);
        }

        function replayRollCutscene() {
            profileUI.classList.remove('active');
            rollOverlay.style.display = "flex";
            rollOverlay.style.opacity = "1";
            startBtn.style.display = "block";
            rollStatus.style.display = "none";
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        /* =========================================================================
           3. Three.js 3D 互動背景 (棋盤格 + 懸浮核心 + 多眼光環)
           ========================================================================= */
        let scene, camera, renderer, coreBox, ringGroup;
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

        function init3D() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x02040a, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 32);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const canvasTile = document.createElement('canvas');
            canvasTile.width = 256; canvasTile.height = 256;
            const ctx = canvasTile.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#0012ff'; ctx.fillRect(0, 0, 128, 128); ctx.fillRect(128, 128, 128, 128);

            const floorTexture = new THREE.CanvasTexture(canvasTile);
            floorTexture.wrapS = THREE.RepeatWrapping; floorTexture.wrapT = THREE.RepeatWrapping;
            floorTexture.repeat.set(25, 25);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(300, 300),
                new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.2 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -8;
            scene.add(floor);

            coreBox = new THREE.Mesh(
                new THREE.BoxGeometry(6, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0x0012ff, wireframe: true, emissive: 0x0033ff, emissiveIntensity: 0.8 })
            );
            coreBox.position.set(0, 4, 0);
            scene.add(coreBox);

            const innerCube = new THREE.Mesh(
                new THREE.BoxGeometry(2.8, 2.8, 2.8),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            coreBox.add(innerCube);

            ringGroup = new THREE.Group();
            ringGroup.position.set(0, 4, 0);
            scene.add(ringGroup);

            for (let i = 0; i < 3; i++) {
                const radius = 8 + i * 3.2;
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(radius, 0.08, 16, 100),
                    new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0x0055ff : 0xffffff })
                );
                ring.rotation.x = Math.PI / 2 + (i * 0.4);
                ringGroup.add(ring);
            }

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const pLight = new THREE.PointLight(0x0055ff, 2, 80);
            pLight.position.set(0, 15, 0);
            scene.add(pLight);

            document.addEventListener('mousemove', (e) => {
                targetX = (e.clientX - window.innerWidth / 2) * 0.008;
                targetY = (e.clientY - window.innerHeight / 2) * 0.008;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            mouseX += (targetX - mouseX) * 0.05;
            mouseY += (targetY - mouseY) * 0.05;

            camera.position.x = mouseX * 8;
            camera.position.y = 10 - mouseY * 6;
            camera.lookAt(0, 3, 0);

            if (coreBox) {
                coreBox.rotation.y += 0.01;
                coreBox.rotation.x += 0.005;
                coreBox.position.y = 4 + Math.sin(Date.now() * 0.002) * 0.6;
            }

            if (ringGroup) {
                ringGroup.rotation.z += 0.004;
                ringGroup.rotation.y -= 0.006;
            }

            renderer.render(scene, camera);
        }

        function triggerCorePulse() {
            initAudio(); playSoundSequence('slam');
            flash.style.opacity = "0.7";
            setTimeout(() => { flash.style.opacity = "0"; }, 100);

            if (coreBox) {
                coreBox.scale.set(1.6, 1.6, 1.6);
                setTimeout(() => { coreBox.scale.set(1, 1, 1); }, 200);
            }
        }

        window.onload = init3D;
    </script>
</body>
</html>
