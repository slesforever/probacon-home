<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULLSCAPE // VORTEX</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            font-family: 'Playfair Display', 'Noto Serif TC', serif;
            overflow: hidden;
            user-select: none;
        }

        #void-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* 黑洞遮罩：中心死黑，外側帶有強烈的紫色高光暈染 */
        .event-horizon {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #000 15%, rgba(20, 0, 40, 0.3) 50%, rgba(80, 0, 140, 0.4) 90%, #05000a 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* 左右青藍色菱形切頁按鈕 */
        .page-nav {
            position: fixed;
            top: 50%;
            width: 48px;
            height: 48px;
            background: rgba(0, 240, 255, 0.08);
            border: 1.5px solid #00f0ff;
            transform: translateY(-50%) rotate(45deg);
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
            outline: none;
        }

        .nav-left { left: 40px; }
        .nav-right { right: 40px; }

        .page-nav::after {
            content: "";
            width: 10px;
            height: 10px;
            border-right: 2px solid #00f0ff;
            border-bottom: 2px solid #00f0ff;
            transform: rotate(-45deg);
        }
        .nav-left::after { transform: rotate(135deg); }
        .nav-right::after { transform: rotate(-45deg); }

        .page-nav:hover {
            background: rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 25px #00f0ff, 0 0 40px #7a00cc;
            transform: translateY(-50%) rotate(45deg) scale(1.15);
        }

        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            pointer-events: none;
        }

        /* 720px 寬、半透明卡片本體 */
        .profile-box {
            width: 720px;
            max-width: 90vw;
            background: rgba(8, 0, 15, 0.85);
            border: 2px solid #550080;
            padding: 50px;
            text-align: center;
            box-shadow: 0 0 50px rgba(136, 0, 255, 0.3), inset 0 0 25px rgba(136, 0, 255, 0.15);
            backdrop-filter: blur(6px);
            pointer-events: auto;
            clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px), 0 20px);
            
            transition: transform 0.6s cubic-bezier(0.5, 0, 1, 1), opacity 0.6s ease, filter 0.6s ease;
            transform: scale(1) rotate(0deg);
            opacity: 1;
            filter: blur(0px);
        }

        .profile-box.sucking {
            transform: scale(0) rotate(720deg);
            opacity: 0;
            filter: blur(15px);
        }

        .profile-box.flying-in {
            transform: scale(1.5) translateX(-100vw) rotate(-45deg);
            opacity: 0;
            filter: blur(10px);
        }

        .title {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff 0%, #00e1ff 35%, #7a00cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-transform: uppercase;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.9));
        }

        .subtitle {
            font-size: 0.95rem;
            color: #b066ff;
            letter-spacing: 10px;
            margin-bottom: 35px;
            text-shadow: 0 0 8px rgba(176, 102, 255, 0.5);
        }

        .desc {
            color: #d4aaff;
            font-size: 0.95rem;
            line-height: 2;
            max-width: 500px;
            margin: 0 auto 30px auto;
            border-top: 1px solid rgba(170, 0, 255, 0.25);
            border-bottom: 1px solid rgba(170, 0, 255, 0.25);
            padding: 20px 0;
        }

        .page-indicator {
            font-size: 0.75rem;
            color: #00f0ff;
            letter-spacing: 3px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <canvas id="void-canvas"></canvas>
    <div class="event-horizon"></div>

    <!-- 左右青藍色菱形切頁按鈕 -->
    <button class="page-nav nav-left" onclick="switchPage(-1)"></button>
    <button class="page-nav nav-right" onclick="switchPage(1)"></button>

    <div class="content-layer">
        <div class="profile-box" id="profile-card"></div>
    </div>

    <script>
        const pages = [
            {
                title: "NULLSCAPE",
                subtitle: "ENTITY_VOID",
                desc: "[ 第一頁內容。 ]<br>[ 鎖定 720px 寬度、半透明毛玻璃、左右青藍色菱形按鈕與黑洞吸入動態。 ]"
            },
            {
                title: "LORE // 01",
                subtitle: "THE ABYSSAL WHISPER",
                desc: "[ 第二頁內容。 ]<br>[ 點擊左右菱形切頁時會觸發黑洞漩渦過場。 ]"
            },
            {
                title: "ARCHIVE",
                subtitle: "FINAL REALM",
                desc: "[ 第三頁內容。 ]<br>[ 終點紀錄。 ]"
            }
        ];

        let currentPage = 0;
        const card = document.getElementById('profile-card');

        function renderPage(pageIdx) {
            const p = pages[pageIdx];
            card.innerHTML = `
                <div class="title">${p.title}</div>
                <div class="subtitle">${p.subtitle}</div>
                <div class="desc">${p.desc}</div>
                <div class="page-indicator">0${pageIdx + 1} / 0${pages.length}</div>
            `;
        }

        function switchPage(direction) {
            card.classList.add('sucking');
            setTimeout(() => {
                currentPage = (currentPage + direction + pages.length) % pages.length;
                renderPage(currentPage);
                card.classList.remove('sucking');
                card.classList.add('flying-in');
                setTimeout(() => card.classList.remove('flying-in'), 50);
            }, 600);
        }

        renderPage(0);

        // --- Canvas 渲染核心 ---
        const canvas = document.getElementById('void-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, cx, cy;
        let particles = [];
        const PARTICLE_COUNT = 160;
        const MAX_RADIUS = 1300;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        class VoidEntity {
            constructor() {
                this.reset(true);
            }

            reset(randomizeRadius = false) {
                this.radius = randomizeRadius ? Math.random() * MAX_RADIUS : MAX_RADIUS;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 2 + 1.2;
                this.angleSpeed = (Math.random() * 0.02 + 0.005) * (Math.random() > 0.5 ? 1 : -1);
                
                const rand = Math.random();
                if (rand < 0.6) this.type = 'cube';
                else if (rand < 0.8) this.type = 'meteor';
                else this.type = 'eye';

                this.size = Math.random() * 22 + 12;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.12;
                
                const colors = ['#1a0033', '#4a0080', '#9900cc', '#0a0014'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                let gravityPull = Math.max(1, (MAX_RADIUS / Math.max(this.radius, 10)) * 0.45);
                this.radius -= this.speed * gravityPull;
                this.angle += this.angleSpeed * gravityPull;
                this.rotation += this.rotSpeed * gravityPull;

                if (this.radius < 5) {
                    this.reset();
                }
            }

            draw() {
                const x = cx + Math.cos(this.angle) * this.radius;
                const y = cy + Math.sin(this.angle) * this.radius;

                const scale = Math.min(1, this.radius / 300);
                const stretch = Math.max(1, 300 / Math.max(this.radius, 10));

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(this.angle + Math.PI/2); 
                ctx.scale(scale, scale * stretch); 
                ctx.rotate(this.rotation);

                ctx.globalAlpha = Math.min(1, this.radius / 150);

                if (this.type === 'cube') {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
                } 
                else if (this.type === 'meteor') {
                    ctx.beginPath();
                    ctx.moveTo(-this.size/2, -this.size/2);
                    ctx.lineTo(this.size/2, -this.size/3);
                    ctx.lineTo(this.size/3, this.size/2);
                    ctx.lineTo(-this.size/2, this.size/3);
                    ctx.closePath();
                    ctx.fillStyle = '#100020';
                    ctx.fill();
                    ctx.strokeStyle = '#7a00cc';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                else if (this.type === 'eye') {
                    ctx.beginPath();
                    ctx.moveTo(-this.size, -this.size * 0.2);
                    ctx.lineTo(0, -this.size * 0.7);
                    ctx.lineTo(this.size, -this.size * 0.2);
                    ctx.lineTo(0, this.size * 0.7);
                    ctx.closePath();
                    ctx.fillStyle = '#e6ccff';
                    ctx.fill();
                    ctx.strokeStyle = '#cc0088';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(-this.size * 0.5, 0); ctx.lineTo(-this.size * 0.2, 0);
                    ctx.moveTo(this.size * 0.2, 0); ctx.lineTo(this.size * 0.5, 0);
                    ctx.strokeStyle = '#330011';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.35, 0, Math.PI * 2);
                    ctx.fillStyle = '#030005';
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(this.size * 0.05, -this.size * 0.05, this.size * 0.12, 0, Math.PI * 2);
                    ctx.fillStyle = '#00e1ff';
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new VoidEntity());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
