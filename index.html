<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULLSCAPE</title>
    <style>
        /* 捨棄所有平滑與現代字體，回歸最原始的點陣/等寬字體 */
        body {
            background-color: #000000;
            /* 靜態、死硬的紫黑棋盤格 (對應第一張圖的背景感) */
            background-image: 
                repeating-linear-gradient(45deg, #1a0033 25%, transparent 25%, transparent 75%, #1a0033 75%, #1a0033),
                repeating-linear-gradient(45deg, #1a0033 25%, #000000 25%, #000000 75%, #1a0033 75%, #1a0033);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
            font-family: "MS Gothic", "MingLiU", "Courier New", monospace;
            color: #cc00ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 對應第三張圖的紫黑幾何結界框：沒有圓角、沒有平滑陰影 */
        .classic-container {
            background-color: #000000;
            border: 4px solid #8000ff;
            padding: 40px 30px;
            width: 400px;
            text-align: center;
        }

        /* 靜態的錯位標題：左青色、右洋紅，不加任何閃爍特效 */
        .title {
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: -4px 0px 0px #00ffff, 4px 0px 0px #ff00ff;
            margin: 0 0 10px 0;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: #ff00ff;
            letter-spacing: 2px;
            margin-bottom: 30px;
            border-bottom: 2px solid #330066;
            padding-bottom: 10px;
        }

        /* 生硬的純文字排版 */
        .lore-text {
            color: #9933ff;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 40px;
            text-align: left;
        }

        /* 經典舊網頁風格的按鈕/連結 */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-item {
            display: block;
            background-color: #000000;
            color: #ff00ff;
            text-decoration: none;
            border: 2px solid #5500aa;
            padding: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 只有最基礎的反轉色懸停，沒有過渡動畫 */
        .link-item:hover {
            background-color: #8000ff;
            color: #000000;
            border-color: #8000ff;
        }
    </style>
</head>
<body>

    <div class="classic-container">
        <div class="title">[ NAME ]</div>
        <div class="subtitle">ID: NULL // ENTITY</div>
        
        <div class="lore-text">
            [ 這裡輸入文字。 ]<br><br>
            [ 沒有特效，沒有動態。只有最純粹的舊網頁深淵感。 ]
        </div>

        <div class="link-list">
            <a href="#" class="link-item">> [ LINK_01 ]</a>
            <a href="#" class="link-item">> [ LINK_02 ]</a>
        </div>
    </div>

</body>
</html>
