<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sles // ILLUSIONARY TERMINAL</title>
    
    <!-- 引入賽博/高科技字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --cyber-cyan: #00f7ff;
            --cyber-magenta: #ff0055;
            --cyber-dark: #030710;
            --cyber-panel: rgba(8, 16, 28, 0.85);
            --cyber-glow: rgba(0, 247, 255, 0.4);
            --mouse-x: 50%;
            --mouse-y: 50%;
            --tilt-x: 0deg;
            --tilt-y: 0deg;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            height: 100%;
            background-color: var(--cyber-dark);
            color: #ffffff;
            font-family: 'Fira Code', monospace;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- 開場系統崩潰/載入遮罩 --- */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #intro-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .terminal-box {
            width: 85%;
            max-width: 500px;
            border: 1px solid var(--cyber-magenta);
            padding: 24px;
            background: rgba(255, 0, 85, 0.05);
            box-shadow: 0 0 30px rgba(ff, 0, 85, 0.2);
            position: relative;
        }

        .terminal-header {
            color: var(--cyber-magenta);
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: space-between;
        }

        .terminal-logs {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #00f7ff;
            min-height: 110px;
        }

        .blink-btn {
            margin-top: 25px;
            color: #fff;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-align: center;
            animation: pulse-glow 1.2s infinite alternate;
            font-family: 'Orbitron', sans-serif;
        }

        @keyframes pulse-glow {
            from { opacity: 0.3; text-shadow: 0 0 5px #fff; }
            to { opacity: 1; text-shadow: 0 0 15px var(--cyber-cyan); }
        }

        /* --- 背景 Canvas & CRT 掃描線 --- */
        #cyber-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .scanline-layer {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.6;
        }

        /* --- 頂部與底部 HUD 狀態欄 --- */
        .hud-bar {
            position: fixed;
            left: 30px; right: 30px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(0, 247, 255, 0.5);
            pointer-events: none;
        }
        .hud-bar.top { top: 20px; border-bottom: 1px dashed rgba(0, 247, 255, 0.2); padding-bottom: 6px; }
        .hud-bar.bottom { bottom: 20px; border-top: 1px dashed rgba(0, 247, 255, 0.2); padding-top: 6px; }

        /* --- 賽博切角 navigation 按鈕 --- */
        .cyber-nav {
            position: fixed;
            top: 50%;
            width: 48px; height: 48px;
            background: rgba(0, 247, 255, 0.08);
            border: 1px solid var(--cyber-cyan);
            color: var(--cyber-cyan);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            outline: none;
        }
        .nav-left { left: clamp(15px, 3vw, 40px); transform: translateY(-50%); }
        .nav-right { right: clamp(15px, 3vw, 40px); transform: translateY(-50%); }

        .cyber-nav:hover {
            background: var(--cyber-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--cyber-cyan);
            transform: translateY(-50%) scale(1.1);
        }

        /* --- 主 UI 卡片（賽博切角 + 玻璃擬態） --- */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 5;
            perspective: 1000px;
        }

        .cyber-card {
            background: var(--cyber-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 88%;
            max-width: 580px;
            padding: clamp(40px, 6vh, 60px) clamp(25px, 4vw, 50px);
            position: relative;
            border: 1px solid rgba(0, 247, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 247, 255, 0.05);
            clip-path: polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 25px 100%, 0 calc(100% - 25px));
            transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x));
            transition: transform 0.15s ease-out, opacity 0.3s ease, filter 0.3s ease;
        }

        .cyber-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--cyber-cyan), var(--cyber-magenta), var(--cyber-cyan));
        }

        /* Glitch 特效標題 */
        .card-tag {
            font-size: 0.65rem;
            color: var(--cyber-magenta);
            letter-spacing: 4px;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 6px;
        }

        h1.cyber-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 900;
            margin: 0;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 2px 0 var(--cyber-magenta), -2px 0 var(--cyber-cyan);
            position: relative;
        }

        .sub-tag {
            font-size: 0.7rem;
            color: var(--cyber-cyan);
            letter-spacing: 3px;
            margin: 8px 0 32px 0;
            opacity: 0.8;
        }

        /* 數據行樣式 */
        .data-row {
            margin-bottom: 22px;
            position: relative;
            padding-left: 16px;
            border-left: 2px solid var(--cyber-cyan);
            transition: all 0.3s ease;
        }

        .data-row:hover {
            border-left-color: var(--cyber-magenta);
            background: rgba(0, 247, 255, 0.03);
        }

        .label {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            display: block;
            margin-bottom: 3px;
        }

        .value {
            font-size: 1rem;
            color: #fff;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .page-indicator {
            position: absolute;
            bottom: 16px;
            right: 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--cyber-cyan);
            opacity: 0.6;
        }

        /* 頁面切換 Glitch 閃爍 */
        .cyber-card.switching {
            opacity: 0.2;
            filter: blur(6px) hue-rotate(90deg);
            transform: scale(0.98) rotateX(var(--tilt-y)) rotateY(var(--tilt-x));
        }

        @media (max-width: 480px) {
            .hud-bar { font-size: 0.5rem; left: 15px; right: 15px; }
            .cyber-card { width: 85%; padding: 35px 20px; }
            h1.cyber-title { letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <!-- 開場黑屏與錯誤終端機 -->
    <div id="intro-overlay">
        <div class="terminal-box">
            <div class="terminal-header">
                <span>SYSTEM BREACH</span>
                <span>ERR_501</span>
            </div>
            <div class="terminal-logs" id="type-text"></div>
            <div class="blink-btn">[ CLICK / PRESS ANYKEY TO INITIALIZE ]</div>
        </div>
    </div>

    <!-- 背景視覺層 -->
    <canvas id="cyber-canvas"></canvas>
    <div class="scanline-layer"></div>

    <!-- 頂部與底部 HUD -->
    <div class="hud-bar top">
        <span>PROTOCOL // PERFECT PUPPET</span>
        <span>SECTOR: OBSESSION</span>
    </div>

    <div class="hud-bar bottom">
        <span>SYSTEM: ILLUSIONARY v2.0</span>
        <span>STATUS: ACTIVE</span>
    </div>

    <!-- 兩側切頁按鈕 -->
    <button class="cyber-nav nav-left" id="btn-prev" aria-label="Prev">❮</button>
    <button class="cyber-nav nav-right" id="btn-next" aria-label="Next">❯</button>

    <!-- 主介面卡片 -->
    <main class="main-container">
        <div class="cyber-card" id="cyber-card">
            <div class="card-tag" id="card-tag">// USER PROFILE</div>
            <h1 class="cyber-title" id="card-title">Sles</h1>
            <div class="sub-tag" id="card-sub">PERFECT PUPPET // ILLUSIONARY ARCHIVE</div>

            <div id="data-container">
                <!-- 動態注入數據 -->
            </div>

            <div class="page-indicator" id="page-indicator">[ SEC_01 / 03 ]</div>
        </div>
    </main>

    <script>
        /* --- 1. 終端機開場打字效果 --- */
        const logs = [
            "> LOCATING MEMORY CORE...",
            "> WARNING: CRITICAL CORRUPTION DETECTED.",
            "> ERROR #501: REALITY DISTORTION IN PROGRESS.",
            "> OVERRIDING SECURITY PROTOCOL..."
        ];
        
        let logIdx = 0, charIdx = 0;
        const typeElem = document.getElementById('type-text');

        function typeWriter() {
            if (logIdx < logs.length) {
                if (charIdx < logs[logIdx].length) {
                    typeElem.innerHTML += logs[logIdx].charAt(charIdx);
                    charIdx++;
                    setTimeout(typeWriter, 18);
                } else {
                    typeElem.innerHTML += "<br/>";
                    logIdx++;
                    charIdx = 0;
                    setTimeout(typeWriter, 180);
                }
            }
        }
        typeWriter();

        /* --- 2. 賽博 Web Audio 原生音效引擎 --- */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startCyberAmbient();
            }
        }

        // 啟動深邃背景賽博低頻 Ambient Sound
        function startCyberAmbient() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(55, audioCtx.currentTime); // A1 低音

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(150, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
            } catch(e) {}
        }

        // 高科技點擊與 Glitch 翻頁音效
        function playCyberSFX(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (type === 'click') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                } else if (type === 'glitch') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                }

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e) {}
        }

        // 關閉開場動畫
        const introOverlay = document.getElementById('intro-overlay');
        function unlockSystem() {
            initAudio();
            playCyberSFX('glitch');
            introOverlay.classList.add('fade-out');
        }

        introOverlay.addEventListener('click', unlockSystem);
        document.addEventListener('keydown', (e) => {
            if (!introOverlay.classList.contains('fade-out')) {
                unlockSystem();
            }
        });

        /* --- 3. 頁面資料結構 --- */
        const pages = [
            {
                tag: "// IDENTITY MATRIX",
                title: "Sles",
                sub: "GAME DEVELOPER // CREATIVE DESIGNER",
                rows: [
                    { label: "PRIMARY_ROLE", value: "Roblox Scripting & Web Front-End" },
                    { label: "CREATIVE_CORE", value: "Dark & Tragic Worldbuilding" },
                    { label: "STATUS", value: "System Online // Active" }
                ]
            },
            {
                tag: "// ARCHIVE PREFERENCES",
                title: "Favorites",
                sub: "NEURAL NETWORK // INTERESTS",
                rows: [
                    { label: "ENGINES", value: "Roblox Luau / HTML5 Canvas" },
                    { label: "AESTHETICS", value: "Cyberpunk, Glitch Art, Chess Mechanics" },
                    { label: "CREATIVE_STYLE", value: "Narrative-driven Interactive Media" }
                ]
            },
            {
                tag: "// PROJECT DATABASE",
                title: "Works",
                sub: "ACTIVE EXPERIMENTS & SCRIPTING",
                rows: [
                    { label: "PROJECT_01", value: "Client/Server Replication Systems" },
                    { label: "PROJECT_02", value: "Cyber & Archive Web Interfaces" },
                    { label: "CURRENT_TARGET", value: "Unannounced Game Prototypes" }
                ]
            }
        ];

        let currentPage = 0;
        let isTransitioning = false;
        const cardElem = document.getElementById('cyber-card');

        function renderPage(index) {
            const data = pages[index];
            document.getElementById('card-tag').textContent = data.tag;
            document.getElementById('card-title').textContent = data.title;
            document.getElementById('card-sub').textContent = data.sub;

            const container = document.getElementById('data-container');
            container.innerHTML = data.rows.map(r => `
                <div class="data-row">
                    <span class="label">${r.label}</span>
                    <span class="value">${r.value}</span>
                </div>
            `).join('');

            document.getElementById('page-indicator').textContent = `[ SEC_0${index + 1} / 0${pages.length} ]`;
        }

        function switchPage(dir) {
            if (isTransitioning) return;
            isTransitioning = true;
            playCyberSFX('glitch');

            cardElem.classList.add('switching');

            setTimeout(() => {
                if (dir === 'next') currentPage = (currentPage + 1) % pages.length;
                else currentPage = (currentPage - 1 + pages.length) % pages.length;

                renderPage(currentPage);
                cardElem.classList.remove('switching');

                setTimeout(() => { isTransitioning = false; }, 200);
            }, 200);
        }

        document.getElementById('btn-next').addEventListener('click', () => switchPage('next'));
        document.getElementById('btn-prev').addEventListener('click', () => switchPage('prev'));

        document.addEventListener('keydown', (e) => {
            if (introOverlay.classList.contains('fade-out')) {
                if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') switchPage('next');
                if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') switchPage('prev');
            }
        });

        /* --- 4. 視差 3D 卡片傾斜與滑鼠位置 --- */
        document.addEventListener('mousemove', (e) => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const tiltX = ((e.clientX - centerX) / centerX) * 6;
            const tiltY = ((e.clientY - centerY) / centerY) * -6;

            cardElem.style.setProperty('--tilt-x', `${tiltX}deg`);
            cardElem.style.setProperty('--tilt-y', `${tiltY}deg`);
        });

        /* --- 5. Background Canvas: 賽博西洋棋格子與浮動 Glitch 粒子 --- */
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');
        let gridOffset = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawCyberGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const horizon = canvas.height * 0.55;
            const step = 40;

            // 繪製透視西洋棋地面線條
            ctx.strokeStyle = 'rgba(0, 247, 255, 0.12)';
            ctx.lineWidth = 1;

            gridOffset = (gridOffset + 0.5) % step;

            // 橫向前進線
            for (let y = horizon; y < canvas.height; y += (y - horizon) * 0.15 + 2) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // 縱向放射線（營造 3D 棋盤感）
            const numLines = 24;
            for (let i = -numLines; i <= numLines; i++) {
                const xEnd = (canvas.width / 2) + i * (canvas.width / numLines) * 2;
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, horizon);
                ctx.lineTo(xEnd, canvas.height);
                ctx.stroke();
            }

            // 隨機數碼方塊粒子 (Glitch Code Blocks)
            ctx.fillStyle = 'rgba(255, 0, 85, 0.25)';
            for (let i = 0; i < 6; i++) {
                const rx = (Math.sin(Date.now() * 0.001 + i) * 0.5 + 0.5) * canvas.width;
                const ry = (Math.cos(Date.now() * 0.0015 + i) * 0.5 + 0.5) * canvas.height;
                ctx.fillRect(rx, ry, 12, 12);
            }

            requestAnimationFrame(drawCyberGrid);
        }

        window.onload = () => {
            renderPage(0);
            drawCyberGrid();
        };
    </script>
</body>
</html>
