<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sles | Nullscape Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-cyan: #00f0ff;
            --void-purple: #8b00ff;
            --magenta-glow: #b00088;
            --bg-dark: #05010a;
            --mouse-x: 50%;
            --mouse-y: 50%;
            --tilt-x: 0deg;
            --tilt-y: 0deg;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--primary-cyan);
            font-family: "Cinzel", "Noto Serif TC", "serif";
            overflow: hidden;
            user-select: none;
        }

        /* --- Nullscape 虛空背景與粒子 --- */
        .bg-void {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, rgba(30, 5, 50, 0.6) 0%, rgba(5, 1, 10, 0.95) 100%);
        }

        #canvas-particles {
            position: fixed;
            top: 0; left: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* --- 頂部與底部裝飾 --- */
        .archive-header {
            position: fixed;
            top: 25px; left: 40px; right: 40px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: rgba(0, 240, 255, 0.4);
            border-bottom: 1px solid rgba(139, 0, 255, 0.3);
            padding-bottom: 8px;
            pointer-events: none;
        }

        .archive-footer {
            position: fixed;
            bottom: 25px; left: 40px; right: 40px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(176, 0, 136, 0.5);
            pointer-events: none;
        }

        /* --- 左右青藍色菱形切頁按鈕 --- */
        .page-nav {
            position: fixed;
            top: 50%;
            width: 48px;
            height: 48px;
            background: rgba(0, 240, 255, 0.08);
            border: 1.5px solid var(--primary-cyan);
            border-radius: 4px;
            transform: translateY(-50%) rotate(45deg);
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 240, 255, 0.15);
            outline: none;
        }

        .nav-left { left: 40px; }
        .nav-right { right: 40px; }

        .page-nav::after {
            content: "";
            width: 10px;
            height: 10px;
            border-right: 2px solid var(--primary-cyan);
            border-bottom: 2px solid var(--primary-cyan);
            transform: rotate(-45deg);
            transition: transform 0.3s ease;
        }

        .nav-left::after { transform: rotate(135deg); }
        .nav-right::after { transform: rotate(-45deg); }

        .page-nav:hover {
            background: rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 25px var(--primary-cyan), 0 0 40px var(--void-purple);
            transform: translateY(-50%) rotate(45deg) scale(1.15);
        }

        /* --- 720px 寬、半透明 Nullscape 主卡片 --- */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 5;
            perspective: 1200px;
            pointer-events: none;
        }

        .nullscape-card {
            pointer-events: auto;
            width: 720px;
            max-width: 88vw;
            background: rgba(10, 4, 18, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 55px 65px;
            position: relative;
            border: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 30px 90px rgba(0,0,0,0.9),
                        0 0 30px rgba(139, 0, 255, 0.2),
                        inset 0 0 25px rgba(0, 240, 255, 0.08);
            transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x));
            transition: transform 0.1s ease-out, opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), filter 0.35s ease;
            transform-style: preserve-3d;
            box-sizing: border-box;
        }

        /* 動態滑鼠光影聚焦 */
        .nullscape-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(500px circle at var(--mouse-x) var(--mouse-y), rgba(0, 240, 255, 0.12), transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* 換頁動態過場 */
        .nullscape-card.switching-next {
            opacity: 0;
            filter: blur(10px);
            transform: rotateX(var(--tilt-y)) rotateY(calc(var(--tilt-x) - 20deg)) translateX(-30px) scale(0.96);
        }
        .nullscape-card.switching-prev {
            opacity: 0;
            filter: blur(10px);
            transform: rotateX(var(--tilt-y)) rotateY(calc(var(--tilt-x) + 20deg)) translateX(30px) scale(0.96);
        }

        /* --- 內部排版 --- */
        .card-tag {
            font-size: 0.65rem;
            color: var(--magenta-glow);
            letter-spacing: 5px;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 2.8rem;
            letter-spacing: 12px;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            position: relative;
            z-index: 2;
        }

        .sub-title {
            font-size: 0.68rem;
            letter-spacing: 5px;
            color: var(--primary-cyan);
            opacity: 0.7;
            margin-bottom: 35px;
            position: relative;
            z-index: 2;
        }

        .data-row {
            margin-bottom: 24px;
            position: relative;
            padding-left: 18px;
            z-index: 2;
        }

        .data-row::before {
            content: "";
            position: absolute; left: 0; top: 0; width: 2px; height: 100%;
            background: linear-gradient(to bottom, var(--primary-cyan), var(--void-purple));
            box-shadow: 0 0 8px var(--primary-cyan);
        }

        .label {
            font-size: 0.65rem;
            color: var(--primary-cyan);
            opacity: 0.6;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 4px;
        }

        .value {
            font-size: 1.05rem;
            color: #fff;
            letter-spacing: 1px;
            display: block;
            text-shadow: 0 0 8px rgba(139, 0, 255, 0.5);
        }

        .page-indicator {
            position: absolute;
            bottom: 20px; right: 25px;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--primary-cyan);
            opacity: 0.5;
            z-index: 2;
        }

        @media (max-width: 768px) {
            .nullscape-card { width: 90vw; padding: 35px 25px; }
            .page-nav { width: 38px; height: 38px; }
            .nav-left { left: 15px; }
            .nav-right { right: 15px; }
            h1 { font-size: 2rem; letter-spacing: 6px; }
        }
    </style>
</head>
<body>

    <div class="archive-header">
        <span>NULLSPACE // VOID ARCHIVE</span>
        <span>SECTOR // SLES</span>
    </div>

    <div class="archive-footer">
        <span>ENDLESS PATTERN</span>
        <span>SYSTEM ONLINE</span>
    </div>

    <div class="bg-void"></div>
    <canvas id="canvas-particles"></canvas>

    <!-- 左右青藍色菱形切頁按鈕 -->
    <button class="page-nav nav-left" id="btn-prev" aria-label="Previous"></button>
    <button class="page-nav nav-right" id="btn-next" aria-label="Next"></button>

    <div class="main-container">
        <div class="nullscape-card" id="ui-card">
            <div class="card-tag">SYSTEM RECORD</div>
            <h1 id="card-title">Sles</h1>
            <div class="sub-title" id="card-subtitle">VOID // DEVELOPMENT // CREATION</div>
            
            <div id="data-container">
                <div class="data-row">
                    <span class="label">Identity // Designation</span>
                    <span class="value">Developer // Creator</span>
                </div>
                <div class="data-row">
                    <span class="label">Primary Focus</span>
                    <span class="value">Roblox Luau & Web Systems</span>
                </div>
                <div class="data-row">
                    <span class="label">Status</span>
                    <span class="value">Active in the Nullspace</span>
                </div>
            </div>

            <div class="page-indicator" id="page-indicator">01 / 03</div>
        </div>
    </div>

    <script>
        const card = document.getElementById('ui-card');
        const titleElem = document.getElementById('card-title');
        const subTitleElem = document.getElementById('card-subtitle');
        const dataContainer = document.getElementById('data-container');
        const pageIndicator = document.getElementById('page-indicator');

        const pages = [
            {
                tag: "SYSTEM RECORD",
                title: "Sles",
                subtitle: "VOID // DEVELOPMENT // CREATION",
                rows: [
                    { label: "Identity // Designation", value: "Developer // Creator" },
                    { label: "Primary Focus", value: "Roblox Luau & Web Systems" },
                    { label: "Status", value: "Active in the Nullspace" }
                ]
            },
            {
                tag: "ARCHIVE DATABASE",
                title: "Projects",
                subtitle: "SCRIPTING // NARRATIVE",
                rows: [
                    { label: "Environment", value: "Roblox Engine & Vercel Web" },
                    { label: "Architecture", value: "Client-Server Replication & UI Design" }
                ]
            },
            {
                tag: "CORE PARAMETERS",
                title: "Aesthetic",
                subtitle: "DARK // SURREAL // NEON",
                rows: [
                    { label: "Palette", value: "Cyan, Magenta, Void Purple" },
                    { label: "Interface", value: "Geometric Glassmorphism" }
                ]
            }
        ];

        let currentPage = 0;
        let isTransitioning = false;

        // 滑鼠傾斜與光暈追蹤
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const tiltX = ((e.clientX - centerX) / centerX) * 5;
            const tiltY = ((e.clientY - centerY) / centerY) * -5;

            card.style.setProperty('--tilt-x', `${tiltX}deg`);
            card.style.setProperty('--tilt-y', `${tiltY}deg`);
        });

        function renderPage(index) {
            const data = pages[index];
            document.querySelector('.card-tag').textContent = data.tag;
            titleElem.textContent = data.title;
            subTitleElem.textContent = data.subtitle;

            dataContainer.innerHTML = data.rows.map(row => `
                <div class="data-row">
                    <span class="label">${row.label}</span>
                    <span class="value">${row.value}</span>
                </div>
            `).join('');

            pageIndicator.textContent = `0${index + 1} / 0${pages.length}`;
        }

        function switchPage(direction) {
            if (isTransitioning) return;
            isTransitioning = true;

            const targetClass = direction === 'next' ? 'switching-next' : 'switching-prev';
            card.classList.add(targetClass);

            setTimeout(() => {
                if (direction === 'next') {
                    currentPage = (currentPage + 1) % pages.length;
                } else {
                    currentPage = (currentPage - 1 + pages.length) % pages.length;
                }

                renderPage(currentPage);
                card.classList.remove(targetClass);

                setTimeout(() => { isTransitioning = false; }, 350);
            }, 250);
        }

        document.getElementById('btn-next').addEventListener('click', () => switchPage('next'));
        document.getElementById('btn-prev').addEventListener('click', () => switchPage('prev'));

        // 背景微粒效果
        const canvas = document.getElementById('canvas-particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class VoidParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(0, 240, 255, ${this.opacity})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new VoidParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
