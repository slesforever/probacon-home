<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULLSCAPE // VORTEX</title>
    <!-- 改用優雅但帶有壓抑感的古典字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            font-family: 'Playfair Display', 'Noto Serif TC', serif;
            overflow: hidden;
        }

        /* 背景畫布 */
        #void-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* 中心的黑洞漸層遮罩，強化深淵感 */
        .event-horizon {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #000 5%, rgba(10, 0, 20, 0.4) 40%, rgba(30, 0, 60, 0.2) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* 內容區塊 */
        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            pointer-events: none; /* 讓滑鼠可以穿透點擊背後(如果需要) */
        }

        .profile-box {
            background: rgba(5, 0, 10, 0.6);
            border: 2px solid #550088;
            padding: 50px;
            text-align: center;
            box-shadow: 0 0 40px rgba(136, 0, 255, 0.3), inset 0 0 20px rgba(136, 0, 255, 0.2);
            backdrop-filter: blur(4px);
            pointer-events: auto;
            /* 讓外框帶點幾何邊角感 */
            clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px), 0 20px);
        }

        /* 色散錯位標題，這次字體好看多了 */
        .title {
            font-size: 3.5rem;
            font-weight: 900;
            color: #111;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-transform: uppercase;
            /* 左青、右紫紅的強烈對比 */
            text-shadow: 3px 2px 0px #00ffff, -3px -2px 0px #ff00ff, 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .subtitle {
            font-size: 1rem;
            color: #aa00ff;
            letter-spacing: 12px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #aa00ff;
        }

        .desc {
            color: #d4aaff;
            font-size: 1rem;
            line-height: 2;
            max-width: 400px;
            margin: 0 auto 30px auto;
            border-top: 1px solid rgba(170, 0, 255, 0.3);
            border-bottom: 1px solid rgba(170, 0, 255, 0.3);
            padding: 20px 0;
            text-shadow: 0 2px 4px #000;
        }

        /* 簡單暴力的按鈕 */
        .btn {
            display: inline-block;
            background: #000;
            color: #d4aaff;
            border: 1px solid #aa00ff;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-decoration: none;
            text-transform: uppercase;
            transition: 0.3s;
            margin: 5px;
        }

        .btn:hover {
            background: #aa00ff;
            color: #000;
            box-shadow: 0 0 15px #aa00ff;
        }
    </style>
</head>
<body>

    <canvas id="void-canvas"></canvas>
    <div class="event-horizon"></div>

    <div class="content-layer">
        <div class="profile-box">
            <div class="title">NULLSCAPE</div>
            <div class="subtitle">ENTITY_VOID</div>
            
            <div class="desc">
                [ 這裡放入你的文字。 ]<br>
                [ 全部資料皆為預設，請自行修改。 ]
            </div>

            <div>
                <a href="#" class="btn">ARCHIVE</a>
                <a href="#" class="btn">PORTAL</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('void-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, cx, cy;
        let particles = [];

        // 參數設定
        const PARTICLE_COUNT = 150;
        const MAX_RADIUS = 1200; // 生成的初始最遠距離

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        class VoidEntity {
            constructor() {
                this.reset(true);
            }

            reset(randomizeRadius = false) {
                // 距離中心的半徑
                this.radius = randomizeRadius ? Math.random() * MAX_RADIUS : MAX_RADIUS;
                this.angle = Math.random() * Math.PI * 2;
                // 吸入速度與旋轉速度
                this.speed = Math.random() * 2 + 1;
                this.angleSpeed = (Math.random() * 0.02 + 0.005) * (Math.random() > 0.5 ? 1 : -1);
                
                // 決定物件種類 (70% 紫黑方塊, 20% 隕石碎塊, 10% 眼睛)
                const rand = Math.random();
                if (rand < 0.7) this.type = 'cube';
                else if (rand < 0.9) this.type = 'meteor';
                else this.type = 'eye';

                this.size = Math.random() * 20 + 10;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.1;
                
                // 顏色 (紫/黑/洋紅)
                const colors = ['#330066', '#8800ff', '#ff00ff', '#111111'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                // 越靠近中心，吸力越強，轉得越快 (引力模擬)
                let gravityPull = Math.max(1, (MAX_RADIUS / Math.max(this.radius, 10)) * 0.5);
                
                this.radius -= this.speed * gravityPull;
                this.angle += this.angleSpeed * gravityPull;
                this.rotation += this.rotSpeed * gravityPull;

                // 如果被吸進中心 (半徑極小)，就從外圍重生
                if (this.radius < 5) {
                    this.reset();
                }
            }

            draw() {
                // 計算當前 X, Y 座標
                const x = cx + Math.cos(this.angle) * this.radius;
                const y = cy + Math.sin(this.angle) * this.radius;

                // 越靠近中心，拉長(麵條化)並縮小
                const scale = Math.min(1, this.radius / 300);
                // 伸長比例：靠近中心時沿著旋轉方向被拉扯
                const stretch = Math.max(1, 300 / Math.max(this.radius, 10));

                ctx.save();
                ctx.translate(x, y);
                // 朝向中心的角度，用來做拉扯方向
                ctx.rotate(this.angle + Math.PI/2); 
                ctx.scale(scale, scale * stretch); 
                
                ctx.rotate(this.rotation); // 物件自轉

                ctx.globalAlpha = Math.min(1, this.radius / 150); // 靠近中心時漸隱

                if (this.type === 'cube') {
                    // 畫紫黑西洋棋盤風格的碎塊
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                    ctx.strokeStyle = '#000';
                    ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
                } 
                else if (this.type === 'meteor') {
                    // 畫不規則多邊形(隕石)
                    ctx.beginPath();
                    ctx.moveTo(-this.size/2, -this.size/2);
                    ctx.lineTo(this.size/2, -this.size/3);
                    ctx.lineTo(this.size/3, this.size/2);
                    ctx.lineTo(-this.size/2, this.size/3);
                    ctx.closePath();
                    ctx.fillStyle = '#1a0033';
                    ctx.fill();
                    ctx.strokeStyle = '#aa00ff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                else if (this.type === 'eye') {
                    // 畫混沌的眼睛
                    ctx.beginPath();
                    // 上眼瞼
                    ctx.moveTo(-this.size, 0);
                    ctx.quadraticCurveTo(0, -this.size, this.size, 0);
                    // 下眼瞼
                    ctx.quadraticCurveTo(0, this.size, -this.size, 0);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                    ctx.strokeStyle = '#ff00ff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // 瞳孔
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = '#000';
                    ctx.fill();
                    // 發光紅眼珠
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.15, 0, Math.PI * 2);
                    ctx.fillStyle = '#00ffff'; // 用青色點綴
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // 初始化粒子
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new VoidEntity());
        }

        // 動畫循環
        function animate() {
            // 創造殘影效果，不完全清除畫布，而是覆蓋一層帶透明度的黑色
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
