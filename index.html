<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>probaon // Illusionary Profile</title>
    
    <!-- 導入頂級襯線與數據字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Three.js 3D 渲染庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --blue-pure: #0012ff;
            --blue-bright: #0066ff;
            --blue-glow: rgba(0, 18, 255, 0.85);
            --bg-void: #000000;
            --white: #ffffff;
            --font-serif: 'Cinzel', serif;
            --font-mono: 'Space Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
        }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-void);
            color: #fff;
            font-family: var(--font-mono);
            overflow: hidden;
        }

        /* 3D 背景容器 */
        #webgl-container { position: fixed; inset: 0; z-index: 1; }

        /* CRT 復古掃描線濾鏡 */
        .scanlines {
            position: fixed; inset: 0; pointer-events: none; z-index: 90;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
            background-size: 100% 4px;
            opacity: 0.7;
        }

        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
            background: radial-gradient(circle at center, transparent 15%, rgba(0, 0, 0, 0.96) 90%);
        }

        .screen-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-10px, 5px, 0); }
            20%, 80% { transform: translate3d(12px, -10px, 0); }
            30%, 50%, 70% { transform: translate3d(-15px, 15px, 0); }
            40%, 60% { transform: translate3d(15px, -12px, 0); }
        }

        /* =========================================================================
           1. Illusionary Cutscene 滿版動畫層
           ========================================================================= */
        #cutscene-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; text-align: center;
        }

        .start-btn {
            padding: 18px 50px;
            background: transparent;
            border: 2px solid var(--blue-pure);
            color: #fff;
            font-family: var(--font-serif);
            font-size: 1.3rem; font-weight: 900;
            letter-spacing: 6px; cursor: pointer;
            box-shadow: 0 0 35px var(--blue-glow);
            transition: all 0.25s ease;
        }

        .start-btn:hover {
            background: var(--blue-pure);
            box-shadow: 0 0 70px var(--blue-pure);
            transform: scale(1.05);
        }

        /* 閃屏幀容器 */
        .cutscene-frame {
            position: absolute; inset: 0;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 30px;
        }

        .frame-blue { background-color: var(--blue-pure); color: #fff; }
        .frame-white { background-color: #ffffff; color: var(--blue-pure); }
        .frame-black { background-color: #000000; color: var(--blue-pure); }

        /* SVG 圖案容器 */
        .svg-icon-box {
            width: 140px; height: 140px;
            margin-bottom: 28px;
            display: flex; justify-content: center; align-items: center;
        }

        .svg-icon-box svg {
            width: 100%; height: 100%;
        }

        .spin-anim { animation: spin 8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .jp-text { font-size: 2.3rem; font-weight: bold; letter-spacing: 8px; }
        .en-text { font-size: 1.7rem; letter-spacing: 4px; font-weight: bold; }

        /* 逐行堆疊文字容器 */
        .stack-container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 1.3rem; line-height: 1.5;
            letter-spacing: 3px; text-transform: lowercase;
            font-weight: bold;
        }

        /* 互動選項區: will you be my puppet? */
        .puppet-box {
            display: flex; flex-direction: column; gap: 20px;
            align-items: center;
        }

        .puppet-title {
            font-size: 2rem; letter-spacing: 5px; color: #fff;
            margin-bottom: 30px; font-weight: bold;
        }

        .puppet-opt {
            background: transparent; border: none;
            color: #fff; font-family: var(--font-mono);
            font-size: 1.35rem; letter-spacing: 3px;
            cursor: pointer; padding: 10px 28px;
            transition: color 0.1s;
        }

        .puppet-opt:hover {
            color: var(--blue-bright);
            text-shadow: 0 0 18px var(--blue-bright);
        }

        .flash-bang {
            position: fixed; inset: 0; z-index: 200;
            background: #ffffff; opacity: 0; pointer-events: none;
            transition: opacity 0.15s ease-out;
        }

        /* =========================================================================
           2. probaon 個人資料歸檔 UI
           ========================================================================= */
        #profile-ui {
            position: fixed; inset: 0; z-index: 10;
            pointer-events: none;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: scale(0.9);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #profile-ui.active {
            opacity: 1; transform: scale(1);
        }

        .profile-card {
            pointer-events: auto;
            width: 90%; max-width: 520px;
            background: rgba(2, 4, 12, 0.92);
            border: 1px solid var(--blue-pure);
            box-shadow: 0 0 60px rgba(0, 18, 255, 0.45), inset 0 0 25px rgba(0, 18, 255, 0.2);
            backdrop-filter: blur(16px);
            padding: 35px 40px;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px; margin-bottom: 20px; font-size: 0.75rem;
        }

        .rarity-badge {
            color: #fff; font-weight: bold; letter-spacing: 2px;
            background: var(--blue-pure); padding: 3px 10px;
            box-shadow: 0 0 12px var(--blue-pure);
        }

        .biome-badge {
            color: var(--blue-bright); letter-spacing: 1px;
            border: 1px solid rgba(0, 85, 255, 0.6); padding: 3px 8px;
        }

        .user-title {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 6vw, 3.8rem);
            font-style: italic; font-weight: 900;
            letter-spacing: 4px; color: #fff;
            text-shadow: 0 0 20px var(--blue-pure), 0 0 40px #fff;
            line-height: 1;
        }

        .user-sub {
            font-size: 0.9rem; color: rgba(255, 255, 255, 0.7);
            letter-spacing: 4px; margin-top: 6px; margin-bottom: 22px;
        }

        .tab-menu {
            display: flex; gap: 8px; margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px;
        }

        .tab-btn {
            background: transparent; border: none; color: rgba(255, 255, 255, 0.5);
            font-family: var(--font-mono); font-size: 0.75rem; font-weight: bold;
            letter-spacing: 2px; cursor: pointer; padding: 4px 10px;
        }

        .tab-btn.active, .tab-btn:hover {
            color: #fff; background: rgba(0, 85, 255, 0.25);
            border-bottom: 2px solid var(--blue-bright);
        }

        .tab-content { display: none; flex-direction: column; gap: 10px; font-size: 0.8rem; }
        .tab-content.active { display: flex; }

        .data-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.03); padding: 9px 14px;
            border-left: 3px solid var(--blue-pure);
        }

        .data-key { color: rgba(255, 255, 255, 0.5); }
        .data-val { color: #fff; font-weight: bold; }

        .card-actions { margin-top: 25px; display: flex; gap: 12px; }

        .btn-ui {
            flex: 1; padding: 12px;
            background: transparent; border: 1px solid var(--blue-pure);
            color: #fff; font-family: var(--font-serif); font-weight: bold;
            letter-spacing: 2px; cursor: pointer; transition: all 0.2s ease;
        }

        .btn-ui:hover {
            background: var(--blue-pure); box-shadow: 0 0 25px var(--blue-pure);
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="flash-bang" id="flash"></div>

    <!-- 1. Sol's RNG Illusionary 滿版劇情報告 Cutscene -->
    <div id="cutscene-overlay">
        <button class="start-btn" id="start-btn" onclick="startIllusionaryCutscene()">ROLL ILLUSIONARY</button>

        <!-- Frame 1: 幾何十字星芒標誌 + どこにいますか？ -->
        <div class="cutscene-frame frame-white" id="f1">
            <div class="svg-icon-box">
                <svg viewBox="0 0 100 100" fill="var(--blue-pure)">
                    <path d="M50 0 L59 41 L100 50 L59 59 L50 100 L41 59 L0 50 L41 41 Z" />
                </svg>
            </div>
            <div class="jp-text">どこにいますか？</div>
        </div>

        <!-- Frame 2: 聲波圖騰 + Is it time to wake up? -->
        <div class="cutscene-frame frame-blue" id="f2">
            <div class="svg-icon-box">
                <svg viewBox="0 0 100 100" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
                    <path d="M15 50 L28 50 L38 20 L50 80 L62 30 L72 60 L85 50" />
                    <circle cx="50" cy="50" r="44" stroke-width="3" stroke-dasharray="6 6" />
                </svg>
            </div>
            <div class="en-text">Is it time to wake up?</div>
        </div>

        <!-- Frame 3: 動態旋轉幾何漩渦 + 今何時ですか？ -->
        <div class="cutscene-frame frame-blue" id="f3">
            <div class="svg-icon-box spin-anim">
                <svg viewBox="0 0 100 100" fill="none" stroke="#ffffff" stroke-width="5">
                    <circle cx="50" cy="50" r="42" stroke-dasharray="18 10" />
                    <circle cx="50" cy="50" r="28" stroke-dasharray="14 8" />
                    <circle cx="50" cy="50" r="14" stroke-dasharray="10 6" />
                </svg>
            </div>
            <div class="jp-text">今何時ですか？</div>
        </div>

        <!-- Frame 4: 逐行跳出堆疊 wake up. -> no, not yet. -->
        <div class="cutscene-frame frame-black" id="f4">
            <div class="stack-container" id="stack-f4"></div>
        </div>

        <!-- Frame 5: 經典六翼熾天使 (Seraphim Angel) + you belong to here. -->
        <div class="cutscene-frame frame-white" id="f5">
            <div class="svg-icon-box" style="width: 240px; height: 140px;">
                <svg viewBox="0 0 200 120" fill="none" stroke="var(--blue-pure)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <ellipse cx="100" cy="18" rx="36" ry="8" stroke-width="2.5" stroke-dasharray="4 2" />
                    <path d="M 72 50 Q 100 28 128 50 Q 100 72 72 50 Z" stroke-width="4" />
                    <circle cx="100" cy="50" r="9" fill="var(--blue-pure)" />
                    <path d="M 75 42 Q 35 12 5 2 Q 30 32 60 50" />
                    <path d="M 125 42 Q 165 12 195 2 Q 170 32 140 50" />
                    <path d="M 72 50 Q 25 42 0 52 Q 30 68 65 58" />
                    <path d="M 128 50 Q 175 42 200 52 Q 170 68 135 58" />
                    <path d="M 78 58 Q 38 85 18 115 Q 50 92 80 66" />
                    <path d="M 122 58 Q 162 85 182 115 Q 150 92 120 66" />
                </svg>
            </div>
            <div class="en-text" style="color: var(--blue-pure);">you belong to here.</div>
        </div>

        <!-- Frame 6: 逐行跳出堆疊 you are a puppet -->
        <div class="cutscene-frame frame-blue" id="f6">
            <div class="stack-container" id="stack-f6" style="color: #fff;"></div>
        </div>

        <!-- Frame 7: 互動選項 will you be my puppet? -->
        <div class="cutscene-frame frame-black" id="f7">
            <div class="puppet-box">
                <div class="puppet-title">will you be my puppet?</div>
                <button class="puppet-opt" onclick="choosePuppet()">1. Yes</button>
                <button class="puppet-opt" id="opt-no" onmouseover="forceYes()" onclick="choosePuppet()">2. No</button>
            </div>
        </div>

        <!-- Frame 8: 經典圖片笑臉（電藍色線條 + 無白底） -->
        <div class="cutscene-frame frame-black" id="f8">
            <div class="svg-icon-box" style="width: 160px; height: 160px; filter: drop-shadow(0 0 25px var(--blue-pure));">
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="43" fill="none" stroke="var(--blue-pure)" stroke-width="7" />
                    <circle cx="34" cy="38" r="7.5" fill="var(--blue-pure)" />
                    <circle cx="66" cy="38" r="7.5" fill="var(--blue-pure)" />
                    <path d="M 26 58 Q 50 84 74 58" fill="none" stroke="var(--blue-pure)" stroke-width="7" stroke-linecap="round" />
                </svg>
            </div>
        </div>
    </div>

    <!-- 2. probaon 個人檔案卡 -->
    <div id="profile-ui">
        <div class="profile-card">
            <div class="card-header">
                <span class="rarity-badge">1 IN 100,000,000</span>
                <span class="biome-badge">CYBERSPACE // ILLUSIONARY</span>
            </div>

            <div class="user-title">probaon</div>
            <div class="user-sub">-</div>

            <div class="tab-menu">
                <button class="tab-btn active" onclick="switchTab('profile')">PROFILE</button>
                <button class="tab-btn" onclick="switchTab('skills')">SKILLS</button>
                <button class="tab-btn" onclick="switchTab('projects')">PROJECTS</button>
            </div>

            <!-- 頁籤 1: PROFILE -->
            <div class="tab-content active" id="tab-profile">
                <div class="data-row"><span class="data-key">ALIAS</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">ROLE</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">SPECIALTY</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">STATUS</span><span class="data-val">-</span></div>
            </div>

            <!-- 頁籤 2: SKILLS -->
            <div class="tab-content" id="tab-skills">
                <div class="data-row"><span class="data-key">SKILL I</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">SKILL II</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">SKILL III</span><span class="data-val">-</span></div>
            </div>

            <!-- 頁籤 3: PROJECTS -->
            <div class="tab-content" id="tab-projects">
                <div class="data-row"><span class="data-key">PROJECT I</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">PROJECT II</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">PROJECT III</span><span class="data-val">-</span></div>
            </div>

            <div class="card-actions">
                <button class="btn-ui" onclick="replayCutscene()">ROLL AGAIN</button>
                <button class="btn-ui" onclick="pulseCore()">PULSE CORE</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================================
           高級 Web Audio API 音效合成引擎 (電影級衝擊音效 & CRT 靜電白雜訊)
           ========================================================================= */
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // 1. 電子電視靜電白雜訊爆音 (Glitch Noise Burst)
        function playGlitchNoise(duration = 0.08, volume = 0.3) {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1800;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
        }

        // 2. 深邃低頻嗡鳴與頻率下沉 (Dark Atmospheric Drone)
        function playDeepDrone(freq = 80, duration = 0.6) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.type = 'sawtooth';
            osc2.type = 'sine';

            osc1.frequency.setValueAtTime(freq, now);
            osc2.frequency.setValueAtTime(freq * 0.5, now);

            // 雙聲道極微解調，創造立態空間恐怖感
            osc1.detune.setValueAtTime(-12, now);
            osc2.detune.setValueAtTime(12, now);

            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);

            osc1.start(now); osc2.start(now);
            osc1.stop(now + duration); osc2.stop(now + duration);
        }

        // 3. 逐行堆疊文字時的機械低音重擊 (Stack Line Thump)
        function playStackThump(pitch = 110) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(pitch, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);

            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.12);

            // 輕微伴隨高頻靜電喀噠聲
            playGlitchNoise(0.03, 0.15);
        }

        // 4. 電影級震撼重低音巨響 SLAM (Cinematic Sub-Bass Impact)
        function playCinematicSlam() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            // 亞低音下沉 (Sub-Bass Sweep 60Hz -> 10Hz)
            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(65, now);
            subOsc.frequency.exponentialRampToValueAtTime(12, now + 1.2);

            subGain.gain.setValueAtTime(0.9, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);

            subOsc.start(now); subOsc.stop(now + 1.2);

            // 鋸齒波中頻衝擊波
            const bodyOsc = audioCtx.createOscillator();
            const bodyGain = audioCtx.createGain();
            bodyOsc.type = 'sawtooth';
            bodyOsc.frequency.setValueAtTime(180, now);
            bodyOsc.frequency.exponentialRampToValueAtTime(25, now + 0.6);

            bodyGain.gain.setValueAtTime(0.6, now);
            bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

            bodyOsc.connect(bodyGain);
            bodyGain.connect(audioCtx.destination);

            bodyOsc.start(now); bodyOsc.stop(now + 0.6);

            // 衝擊白雜音爆破
            playGlitchNoise(0.25, 0.5);
        }

        /* 隱藏所有 Frame */
        function hideAllFrames() {
            document.querySelectorAll('.cutscene-frame').forEach(el => el.style.display = 'none');
        }

        /* Sol's RNG Illusionary 完美節奏與氛圍 Sequence */
        function startIllusionaryCutscene() {
            initAudio();
            document.getElementById('start-btn').style.display = "none";

            // Frame 1: どこにいますか？ (停留 950ms)
            hideAllFrames();
            document.getElementById('f1').style.display = 'flex';
            playGlitchNoise(0.12, 0.4);
            playDeepDrone(90, 0.7);

            // Frame 2: Is it time to wake up? (停留 1050ms)
            setTimeout(() => {
                hideAllFrames();
                document.getElementById('f2').style.display = 'flex';
                playGlitchNoise(0.12, 0.4);
                playDeepDrone(110, 0.7);
            }, 950);

            // Frame 3: 今何時ですか？ (停留 1100ms)
            setTimeout(() => {
                hideAllFrames();
                document.getElementById('f3').style.display = 'flex';
                playGlitchNoise(0.12, 0.4);
                playDeepDrone(130, 0.8);
            }, 2000);

            // Frame 4: 逐行跳出 wake up. -> pause -> 啪啪啪跳出 "no, not yet."
            setTimeout(() => {
                hideAllFrames();
                const container = document.getElementById('stack-f4');
                container.innerHTML = '';
                document.getElementById('f4').style.display = 'flex';

                // 先跳出 wake up. 並懸停 400ms
                const wakeLine = document.createElement('div');
                wakeLine.textContent = 'wake up.';
                wakeLine.style.marginBottom = '8px';
                wakeLine.style.color = 'var(--blue-pure)';
                container.appendChild(wakeLine);
                playStackThump(160);

                setTimeout(() => {
                    let count = 0;
                    const interval = setInterval(() => {
                        const line = document.createElement('div');
                        line.textContent = 'no, not yet.';
                        container.appendChild(line);
                        playStackThump(120 - count * 5);
                        count++;
                        if (count >= 7) clearInterval(interval);
                    }, 110); // 調整至有節奏感且沉重的速度
                }, 400);

            }, 3100);

            // Frame 5: 神聖熾天使 + you belong to here. (停留 1400ms)
            setTimeout(() => {
                hideAllFrames();
                document.getElementById('f5').style.display = 'flex';
                playGlitchNoise(0.15, 0.4);
                playDeepDrone(150, 1.2);
            }, 4800);

            // Frame 6: 逐行跳出 you are a puppet
            setTimeout(() => {
                hideAllFrames();
                const container = document.getElementById('stack-f6');
                container.innerHTML = '';
                document.getElementById('f6').style.display = 'flex';

                let count = 0;
                const interval = setInterval(() => {
                    const line = document.createElement('div');
                    line.textContent = 'you are a puppet';
                    container.appendChild(line);
                    playStackThump(100 + count * 8);
                    count++;
                    if (count >= 9) clearInterval(interval);
                }, 90);

            }, 6200);

            // Frame 7: will you be my puppet? 選項區 (停下來讓玩家互動)
            setTimeout(() => {
                hideAllFrames();
                document.getElementById('f7').style.display = 'flex';
                playDeepDrone(70, 1.0);
            }, 7500);
        }

        function forceYes() {
            const btnNo = document.getElementById('opt-no');
            if (btnNo.textContent !== "2. Yes") {
                playGlitchNoise(0.08, 0.3);
                btnNo.textContent = "2. Yes";
            }
        }

        function choosePuppet() {
            playDeepDrone(120, 0.4);
            hideAllFrames();
            document.getElementById('f8').style.display = 'flex';

            // 顯示藍色線條笑臉 -> 1.0 秒醞釀後爆發震撼重擊 SLAM!
            setTimeout(() => {
                playCinematicSlam();
                document.body.classList.add('screen-shake');
                const flash = document.getElementById('flash');
                flash.style.opacity = "1";

                setTimeout(() => {
                    document.body.classList.remove('screen-shake');
                    flash.style.opacity = "0";
                }, 180);

                setTimeout(() => {
                    document.getElementById('cutscene-overlay').style.opacity = "0";
                    setTimeout(() => {
                        document.getElementById('cutscene-overlay').style.display = "none";
                        document.getElementById('profile-ui').classList.add('active');
                    }, 500);
                }, 600);

            }, 1000);
        }

        function replayCutscene() {
            document.getElementById('profile-ui').classList.remove('active');
            const overlay = document.getElementById('cutscene-overlay');
            overlay.style.display = "flex";
            overlay.style.opacity = "1";
            document.getElementById('start-btn').style.display = "block";
            hideAllFrames();
            document.getElementById('opt-no').textContent = "2. No";
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        /* Three.js 3D 背景渲染 */
        let scene, camera, renderer, coreBox;
        function init3D() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const canvasTile = document.createElement('canvas');
            canvasTile.width = 128; canvasTile.height = 128;
            const ctx = canvasTile.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#0012ff'; ctx.fillRect(0, 0, 64, 64); ctx.fillRect(64, 64, 64, 64);

            const floorTexture = new THREE.CanvasTexture(canvasTile);
            floorTexture.wrapS = THREE.RepeatWrapping; floorTexture.wrapT = THREE.RepeatWrapping;
            floorTexture.repeat.set(20, 20);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(250, 250),
                new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.3 })
            );
            floor.rotation.x = -Math.PI / 2; floor.position.y = -8;
            scene.add(floor);

            coreBox = new THREE.Mesh(
                new THREE.BoxGeometry(6, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0x0012ff, wireframe: true, emissive: 0x0012ff, emissiveIntensity: 0.8 })
            );
            coreBox.position.set(0, 4, 0);
            scene.add(coreBox);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const pLight = new THREE.PointLight(0x0055ff, 2, 80);
            pLight.position.set(0, 15, 0);
            scene.add(pLight);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (coreBox) {
                coreBox.rotation.y += 0.01;
                coreBox.rotation.x += 0.005;
                coreBox.position.y = 4 + Math.sin(Date.now() * 0.002) * 0.5;
            }
            renderer.render(scene, camera);
        }

        function pulseCore() {
            initAudio(); playCinematicSlam();
            const flash = document.getElementById('flash');
            flash.style.opacity = "0.6";
            setTimeout(() => { flash.style.opacity = "0"; }, 100);
            if (coreBox) {
                coreBox.scale.set(1.5, 1.5, 1.5);
                setTimeout(() => { coreBox.scale.set(1, 1, 1); }, 200);
            }
        }

        window.onload = init3D;
    </script>
</body>
</html>
