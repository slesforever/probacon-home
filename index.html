<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile - Eye Zoom Transition</title>
    <style>
        :root {
            --bg-dark: #050508;
            --accent-crimson: #ff2a5f;
            --accent-gold: #ffb700;
            --accent-cyan: #00f0ff;
            --glass-bg: rgba(15, 15, 25, 0.75);
            --glass-border: rgba(255, 42, 95, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
            color: #fff;
        }

        /* 暗黑質感背景與掃描線 */
        .viewport-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at center, rgba(30, 10, 20, 0.6) 0%, var(--bg-dark) 80%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 4px;
            z-index: 1;
        }

        /* 噪點紋理覆蓋 */
        .noise-overlay {
            position: absolute;
            inset: 0;
            background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.015) 0, rgba(0,0,0,0.15) 2px, transparent 4px);
            pointer-events: none;
            z-index: 2;
        }

        /* 眼睛容器與放大轉場 */
        .eye-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.8s ease;
        }

        .eye-wrapper {
            position: relative;
            width: 280px;
            height: 160px;
            cursor: pointer;
            filter: drop-shadow(0 0 25px rgba(255, 42, 95, 0.4));
            transition: filter 0.3s ease;
        }

        .eye-wrapper:hover {
            filter: drop-shadow(0 0 35px rgba(255, 42, 95, 0.8));
        }

        .eye-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* 眼瞼與虹膜動畫 */
        .eyelid-top, .eyelid-bottom {
            fill: #0a0a12;
            stroke: var(--accent-crimson);
            stroke-width: 2;
            transition: d 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .iris {
            transform-origin: center;
            transition: transform 0.6s ease, fill 0.5s ease;
        }

        .pupil {
            transform-origin: center;
            transition: transform 0.4s ease;
        }

        .click-hint {
            margin-top: 30px;
            font-size: 14px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 0.9; transform: scale(1); }
        }

        /* 特效過渡：鏡頭推進眼睛內部 */
        .eye-stage.zooming {
            transform: scale(45);
            opacity: 0;
            pointer-events: none;
        }

        /* Flash 閃光與 Glitch 效果 */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.4s ease;
        }

        .flash-overlay.active {
            opacity: 0.85;
        }

        /* 個人資料卡 Container */
        .profile-container {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
            transition: opacity 1s ease 0.4s, transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
        }

        .profile-container.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }

        .profile-card {
            width: 720px;
            max-width: 90%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 42, 95, 0.15);
            position: relative;
            clip-path: polygon(
                0 0, 
                calc(100% - 20px) 0, 100% 20px, 
                100% 100%, 
                20px 100%, 0 calc(100% - 20px)
            );
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .avatar-mini {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--accent-crimson);
            background: #111 url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=300') center/cover;
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.5);
        }

        .header-text h2 {
            font-size: 26px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 42, 95, 0.5);
        }

        .header-text p {
            font-size: 13px;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .data-group {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 20px;
            border-left: 3px solid var(--accent-crimson);
            border-radius: 4px;
        }

        .data-label {
            font-size: 11px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .data-value {
            font-size: 15px;
            color: #eee;
            font-weight: 500;
        }

        .bgm-controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .music-tag {
            font-size: 12px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--accent-crimson);
            color: var(--accent-crimson);
            padding: 8px 18px;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: var(--accent-crimson);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.6);
        }

        /* 隱藏的 YouTube Player */
        #youtube-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="viewport-bg"></div>
    <div class="noise-overlay"></div>
    <div class="flash-overlay" id="flash"></div>

    <!-- 眼球開合與放大轉場舞台 -->
    <div class="eye-stage" id="eyeStage">
        <div class="eye-wrapper" id="eyeButton">
            <svg class="eye-svg" viewBox="0 0 200 100">
                <defs>
                    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#000" />
                        <stop offset="60%" stop-color="#ff1a4a" />
                        <stop offset="100%" stop-color="#7a001e" />
                    </radialGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- 外眼眶線條 -->
                <path d="M 10,50 Q 100,-10 190,50 Q 100,110 10,50 Z" fill="none" stroke="rgba(255,42,95,0.3)" stroke-width="1.5" />

                <!-- 虹膜與瞳孔 -->
                <g class="iris-group">
                    <circle class="iris" cx="100" cy="50" r="30" fill="url(#irisGrad)" filter="url(#glow)" />
                    <circle class="pupil" id="pupil" cx="100" cy="50" r="12" fill="#000" />
                    <circle cx="92" cy="42" r="3" fill="#fff" opacity="0.8" />
                </g>

                <!-- 上下眼瞼（初始呈半閉合狀態） -->
                <path class="eyelid-top" id="eyelidTop" d="M 10,50 Q 100,35 190,50 Q 100,-10 10,50 Z" />
                <path class="eyelid-bottom" id="eyelidBottom" d="M 10,50 Q 100,65 190,50 Q 100,110 10,50 Z" />
            </svg>
        </div>
        <div class="click-hint">[ 點擊凝視 · 喚醒資料庫 ]</div>
    </div>

    <!-- 個人資料卡 -->
    <div class="profile-container" id="profileContainer">
        <div class="profile-card">
            <div class="card-header">
                <div class="avatar-mini"></div>
                <div class="header-text">
                    <h2>SLES // ARCHIVE</h2>
                    <p>STATUS: AWAKENED / GAME DEVELOPER & WRITER</p>
                </div>
            </div>
            <div class="card-body">
                <div class="data-group">
                    <div class="data-label">Identity Alias</div>
                    <div class="data-value">Sles (創作者 / 腳本師)</div>
                </div>
                <div class="data-group">
                    <div class="data-label">Core Domain</div>
                    <div class="data-value">Roblox Luau & Web Frontend</div>
                </div>
                <div class="data-group">
                    <div class="data-label">Narrative Style</div>
                    <div class="data-value">Dark Gothic / Tragedy / Emotional Mechanics</div>
                </div>
                <div class="data-group">
                    <div class="data-label">Active Project</div>
                    <div class="data-value">Project Moon Style Web Archive</div>
                </div>
            </div>
            <div class="bgm-controls">
                <div class="music-tag">
                    <span>♫ BGM: FIND YOUR FLAME (feat. @hongmika)</span>
                </div>
                <button class="btn-reset" id="btnReset">CLOSE EYE</button>
            </div>
        </div>
    </div>

    <!-- YouTube 音樂播放器載入 -->
    <div id="youtube-player"></div>

    <script>
        // YouTube API 載入
        let player;
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'V35svE-8XtA', // FIND YOUR FLAME
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'V35svE-8XtA'
                }
            });
        }

        // DOM 元素控制
        const eyeButton = document.getElementById('eyeButton');
        const eyeStage = document.getElementById('eyeStage');
        const eyelidTop = document.getElementById('eyelidTop');
        const eyelidBottom = document.getElementById('eyelidBottom');
        const pupil = document.getElementById('pupil');
        const flash = document.getElementById('flash');
        const profileContainer = document.getElementById('profileContainer');
        const btnReset = document.getElementById('btnReset');

        let isOpened = false;

        // 觸發開眼與放大轉場
        eyeButton.addEventListener('click', () => {
            if (isOpened) return;
            isOpened = true;

            // 步驟 1: 眼瞼完全張開，瞳孔放大
            eyelidTop.setAttribute('d', 'M 10,50 Q 100,-25 190,50 Q 100,-10 10,50 Z');
            eyelidBottom.setAttribute('d', 'M 10,50 Q 100,125 190,50 Q 100,110 10,50 Z');
            pupil.style.transform = 'scale(1.8)';

            // 播放背景音樂
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }

            // 步驟 2: 延遲後進行極速放大（Zoom In into pupil）
            setTimeout(() => {
                eyeStage.classList.add('zooming');
                flash.classList.add('active');

                setTimeout(() => {
                    flash.classList.remove('active');
                }, 400);

                // 步驟 3: 展示個人資料卡
                setTimeout(() => {
                    profileContainer.classList.add('active');
                }, 600);
            }, 500);
        });

        // 重置回到閉眼狀態
        btnReset.addEventListener('click', () => {
            profileContainer.classList.remove('active');

            setTimeout(() => {
                eyeStage.classList.remove('zooming');
                eyelidTop.setAttribute('d', 'M 10,50 Q 100,35 190,50 Q 100,-10 10,50 Z');
                eyelidBottom.setAttribute('d', 'M 10,50 Q 100,65 190,50 Q 100,110 10,50 Z');
                pupil.style.transform = 'scale(1)';
                isOpened = false;

                if (player && typeof player.pauseVideo === 'function') {
                    player.pauseVideo();
                }
            }, 600);
        });
    </script>
</body>
</html>
