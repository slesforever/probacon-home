<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>probaon // Illusionary Cutscene</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Three.js 3D 庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --blue-pure: #0012ff;
            --blue-bright: #0066ff;
            --blue-glow: rgba(0, 18, 255, 0.85);
            --bg-void: #000000;
            --white: #ffffff;
            --font-serif: 'Cinzel', serif;
            --font-mono: 'Space Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
        }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-void);
            color: #fff;
            font-family: var(--font-mono);
            overflow: hidden;
        }

        #webgl-container { position: fixed; inset: 0; z-index: 1; }

        .scanlines {
            position: fixed; inset: 0; pointer-events: none; z-index: 90;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
            background-size: 100% 4px; opacity: 0.7;
        }

        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
            background: radial-gradient(circle at center, transparent 15%, rgba(0, 0, 0, 0.96) 90%);
        }

        /* 畫面重震動特效 */
        .shake-impact {
            animation: shakeImpact 0.25s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeImpact {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-12px, 8px) rotate(-1.5deg); }
            40% { transform: translate(14px, -10px) rotate(1.5deg); }
            60% { transform: translate(-10px, 12px) rotate(-1deg); }
            80% { transform: translate(8px, -6px) rotate(0.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Cutscene 畫布 */
        #cutscene-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; text-align: center;
            transition: opacity 0.4s ease;
        }

        .start-btn {
            padding: 18px 50px;
            background: transparent;
            border: 2px solid var(--blue-pure);
            color: #fff;
            font-family: var(--font-serif);
            font-size: 1.3rem; font-weight: 900;
            letter-spacing: 6px; cursor: pointer;
            box-shadow: 0 0 35px var(--blue-glow);
            transition: all 0.25s ease;
            z-index: 110;
        }

        .start-btn:hover {
            background: var(--blue-pure);
            box-shadow: 0 0 70px var(--blue-pure);
            transform: scale(1.05);
        }

        /* 彈性登場衝擊動畫 */
        .cutscene-frame {
            position: absolute; inset: 0;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 30px;
        }

        .cutscene-frame.active {
            display: flex;
            animation: framePunchIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes framePunchIn {
            0% { transform: scale(1.35); opacity: 0; filter: blur(12px); }
            60% { transform: scale(0.97); opacity: 1; filter: blur(0); }
            100% { transform: scale(1); opacity: 1; filter: blur(0); }
        }

        .frame-blue { background-color: var(--blue-pure); color: #fff; }
        .frame-white { background-color: #ffffff; color: var(--blue-pure); }
        .frame-black { background-color: #000000; color: var(--blue-pure); }

        /* 天使圖騰容器與動態控制 */
        .angel-icon-box {
            width: 240px; height: 240px;
            margin-bottom: 25px;
            display: flex; justify-content: center; align-items: center;
            filter: drop-shadow(0 0 30px var(--blue-bright));
        }

        .angel-icon-box svg { width: 100%; height: 100%; }

        /* SVG 內部旋轉與脈衝動畫 */
        .spin-cw { transform-origin: center; animation: spinCW 8s linear infinite; }
        .spin-ccw { transform-origin: center; animation: spinCCW 6s linear infinite; }
        .pulse-glow { animation: pulseGlow 1.2s ease-in-out infinite alternate; }
        .float-icon { animation: floatIcon 2.5s ease-in-out infinite alternate; }

        @keyframes spinCW { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinCCW { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        @keyframes pulseGlow {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 15px var(--blue-bright)); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 45px var(--blue-bright)); }
        }
        @keyframes floatIcon {
            0% { transform: translateY(-8px); }
            100% { transform: translateY(8px); }
        }

        /* 10s~12s 暴走段落：藍框從最外緣極細平滑向內延伸變粗 */
        #frame-glitch-scene {
            background-color: var(--blue-pure) !important;
            position: absolute; inset: 0;
            overflow: hidden;
        }

        /* 中央黑色方塊：初始 inset 為 2px，2秒內過渡到 16vw 14vh */
        .glitch-black-box {
            position: absolute;
            inset: 2px;
            background-color: #000000;
            z-index: 2;
            box-shadow: 0 0 50px rgba(0,0,0,0.95);
            transition: inset 2.0s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .glitch-black-box.expand-inward {
            inset: 16vw 14vh;
        }

        /* 垂直文字列雨 */
        #glitch-columns-container {
            position: absolute; inset: 0;
            z-index: 10; pointer-events: none;
        }

        .text-column {
            position: absolute;
            top: -5%;
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-family: var(--font-serif);
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            line-height: 1.15;
        }

        .column-pixelated {
            filter: blur(2.5px) contrast(180%);
            opacity: 0.8;
        }

        .column-sharp {
            filter: none;
            opacity: 1;
            text-shadow: 0 0 12px rgba(255,255,255,0.9);
        }

        /* 笑臉爆發 */
        .smile-zoom-implode {
            animation: smileZoom 0.65s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes smileZoom {
            0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 20px var(--blue-pure)); }
            50% { transform: scale(1.4) rotate(-8deg); filter: drop-shadow(0 0 50px var(--blue-bright)); }
            100% { transform: scale(5.5) rotate(15deg); opacity: 0; filter: drop-shadow(0 0 150px #fff); }
        }

        .jp-text { font-size: 2.5rem; font-weight: bold; letter-spacing: 8px; }
        .en-text { font-size: 1.8rem; letter-spacing: 5px; font-weight: bold; }

        .puppet-box {
            display: flex; flex-direction: column; gap: 20px;
            align-items: center;
        }

        .puppet-title {
            font-size: 2.2rem; letter-spacing: 5px; color: #fff;
            margin-bottom: 30px; font-weight: bold;
        }

        .puppet-opt {
            background: transparent; border: none;
            color: #fff; font-family: var(--font-mono);
            font-size: 1.4rem; letter-spacing: 3px;
            cursor: pointer; padding: 10px 28px;
            transition: color 0.1s;
        }

        .puppet-opt:hover {
            color: var(--blue-bright);
            text-shadow: 0 0 18px var(--blue-bright);
        }

        .flash-bang {
            position: fixed; inset: 0; z-index: 200;
            background: #ffffff; opacity: 0; pointer-events: none;
        }

        .shockwave-ring {
            position: fixed; top: 50%; left: 50%;
            width: 100px; height: 100px;
            margin-left: -50px; margin-top: -50px;
            border-radius: 50%;
            border: 8px solid var(--blue-bright);
            box-shadow: 0 0 50px var(--blue-bright), inset 0 0 30px var(--blue-pure);
            pointer-events: none; z-index: 190;
            opacity: 0; transform: scale(0.1);
        }

        .shockwave-active {
            animation: shockwaveExpand 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes shockwaveExpand {
            0% { opacity: 1; transform: scale(0.1); border-width: 20px; }
            100% { opacity: 0; transform: scale(25); border-width: 1px; }
        }

        /* Profile 卡片 UI */
        #profile-ui {
            position: fixed; inset: 0; z-index: 10;
            pointer-events: none;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: scale(1.6) rotateX(25deg) translateY(-80px);
            perspective: 1000px;
            transition: opacity 0.3s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }

        #profile-ui.active {
            opacity: 1;
            transform: scale(1) rotateX(0deg) translateY(0);
        }

        .profile-card {
            pointer-events: auto;
            width: 90%; max-width: 520px;
            background: rgba(2, 4, 12, 0.92);
            border: 1px solid var(--blue-pure);
            box-shadow: 0 0 70px rgba(0, 18, 255, 0.5), inset 0 0 30px rgba(0, 18, 255, 0.25);
            backdrop-filter: blur(16px);
            padding: 35px 40px;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px; margin-bottom: 20px; font-size: 0.75rem;
        }

        .rarity-badge {
            color: #fff; font-weight: bold; letter-spacing: 2px;
            background: var(--blue-pure); padding: 3px 10px;
            box-shadow: 0 0 12px var(--blue-pure);
        }

        .biome-badge {
            color: var(--blue-bright); letter-spacing: 1px;
            border: 1px solid rgba(0, 85, 255, 0.6); padding: 3px 8px;
        }

        .user-title {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 6vw, 3.8rem);
            font-style: italic; font-weight: 900;
            letter-spacing: 4px; color: #fff;
            text-shadow: 0 0 20px var(--blue-pure), 0 0 40px #fff;
            line-height: 1;
        }

        .user-sub {
            font-size: 0.9rem; color: rgba(255, 255, 255, 0.7);
            letter-spacing: 4px; margin-top: 6px; margin-bottom: 22px;
        }

        .tab-menu {
            display: flex; gap: 8px; margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px;
        }

        .tab-btn {
            background: transparent; border: none; color: rgba(255, 255, 255, 0.5);
            font-family: var(--font-mono); font-size: 0.75rem; font-weight: bold;
            letter-spacing: 2px; cursor: pointer; padding: 4px 10px;
        }

        .tab-btn.active, .tab-btn:hover {
            color: #fff; background: rgba(0, 85, 255, 0.25);
            border-bottom: 2px solid var(--blue-bright);
        }

        .tab-content { display: none; flex-direction: column; gap: 10px; font-size: 0.8rem; }
        .tab-content.active { display: flex; }

        .data-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.03); padding: 9px 14px;
            border-left: 3px solid var(--blue-pure);
        }

        .data-key { color: rgba(255, 255, 255, 0.5); }
        .data-val { color: #fff; font-weight: bold; }

        .card-actions { margin-top: 25px; display: flex; gap: 12px; }

        .btn-ui {
            flex: 1; padding: 12px;
            background: transparent; border: 1px solid var(--blue-pure);
            color: #fff; font-family: var(--font-serif); font-weight: bold;
            letter-spacing: 2px; cursor: pointer; transition: all 0.2s ease;
        }

        .btn-ui:hover {
            background: var(--blue-pure); box-shadow: 0 0 25px var(--blue-pure);
        }
    </style>
</head>
<body>

    <!-- 隱藏式 YouTube 背景音樂 -->
    <div id="yt-player-container" style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; top:-9999px;">
        <div id="yt-player"></div>
    </div>

    <div id="webgl-container"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="flash-bang" id="flash"></div>
    <div class="shockwave-ring" id="shockwave"></div>

    <!-- Cutscene 畫布 -->
    <div id="cutscene-overlay">

        <button class="start-btn" id="start-btn" onclick="startIllusionaryCutscene()">ROLL ILLUSIONARY</button>

        <!-- Frame 1 (0.0s ~ 2.5s): 天使圖騰 1 (Seraphim 六翼熾天使 - 帶旋轉與脈衝) -->
        <div class="cutscene-frame frame-white" id="f1">
            <div class="angel-icon-box float-icon">
                <svg viewBox="0 0 100 100" style="color: var(--blue-pure);">
                    <!-- 順時針旋轉外環 -->
                    <circle class="spin-cw" cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="10 6" />
                    <!-- 逆時針旋轉中環 -->
                    <circle class="spin-ccw" cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="16 4" />
                    <!-- 旋轉八角星芒 -->
                    <g class="spin-cw" style="animation-duration: 12s;">
                        <path d="M50 6 L58 38 L90 46 L58 54 L50 86 L42 54 L10 46 L42 38 Z" fill="currentColor" opacity="0.85" />
                        <path d="M50 16 L55 38 L77 43 L55 48 L50 70 L45 48 L23 43 L45 38 Z" fill="#fff" opacity="0.6" />
                    </g>
                    <!-- 核心瞳孔 -->
                    <circle cx="50" cy="46" r="6" fill="#fff"/>
                    <path d="M 30 46 Q 50 26 70 46 Q 50 66 30 46 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
                </svg>
            </div>
            <div class="jp-text pulse-glow">列車が死ぬ</div>
        </div>

        <!-- Frame 2 (2.5s ~ 5.0s) -->
        <div class="cutscene-frame frame-blue" id="f2">
            <div class="en-text pulse-glow">Is it time to wake up?</div>
        </div>

        <!-- Frame 3 (5.0s ~ 7.5s): 天使圖騰 2 (Ophanim 智天使眼環 - 雙向旋轉) -->
        <div class="cutscene-frame frame-blue" id="f3">
            <div class="angel-icon-box float-icon">
                <svg viewBox="0 0 100 100">
                    <!-- 順時針旋轉眼環 1 -->
                    <g class="spin-cw">
                        <circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="18 8" />
                        <circle cx="50" cy="8" r="3.5" fill="#fff" />
                        <circle cx="50" cy="92" r="3.5" fill="#fff" />
                        <circle cx="8" cy="50" r="3.5" fill="#fff" />
                        <circle cx="92" cy="50" r="3.5" fill="#fff" />
                    </g>
                    <!-- 逆時針旋轉眼環 2 -->
                    <g class="spin-ccw" style="animation-duration: 5s;">
                        <circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="12 6" />
                        <circle cx="50" cy="20" r="2.5" fill="var(--blue-bright)" />
                        <circle cx="50" cy="80" r="2.5" fill="var(--blue-bright)" />
                        <circle cx="20" cy="50" r="2.5" fill="var(--blue-bright)" />
                        <circle cx="80" cy="50" r="2.5" fill="var(--blue-bright)" />
                    </g>
                    <!-- 核心幾何邊框與瞳孔 -->
                    <polygon points="50,18 62,50 50,82 38,50" fill="none" stroke="#fff" stroke-width="2"/>
                    <circle cx="50" cy="50" r="5" fill="#fff" class="pulse-glow"/>
                </svg>
            </div>
            <div class="jp-text pulse-glow">どこにいますか？</div>
        </div>

        <!-- Frame 4 (7.5s ~ 10.0s) -->
        <div class="cutscene-frame frame-white" id="f5">
            <div class="en-text pulse-glow" style="color: var(--blue-pure);">you belong to here.</div>
        </div>

        <!-- Frame 5 (10.0s ~ 12.0s 暴走段落：藍框由最外緣向內延伸，音樂停止並伴隨 Glitch 逐字音效) -->
        <div class="cutscene-frame" id="frame-glitch-scene">
            <div class="glitch-black-box" id="glitch-black-box"></div>
            <div id="glitch-columns-container"></div>
        </div>

        <!-- Frame 6 (12.0s 選項頁) -->
        <div class="cutscene-frame frame-black" id="f7">
            <div class="puppet-box">
                <div class="puppet-title">will you be my puppet?</div>
                <button class="puppet-opt" onclick="choosePuppet()">1. Yes</button>
                <button class="puppet-opt" id="opt-no" onmouseover="forceYes()" onclick="choosePuppet()">2. No</button>
            </div>
        </div>

        <!-- Frame 7 (笑臉) -->
        <div class="cutscene-frame frame-black" id="f8">
            <div class="svg-icon-box" id="smile-box" style="width: 160px; height: 160px; filter: drop-shadow(0 0 25px var(--blue-pure));">
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="43" fill="none" stroke="var(--blue-pure)" stroke-width="7" />
                    <circle cx="34" cy="38" r="7.5" fill="var(--blue-pure)" />
                    <circle cx="66" cy="38" r="7.5" fill="var(--blue-pure)" />
                    <path d="M 26 58 Q 50 84 74 58" fill="none" stroke="var(--blue-pure)" stroke-width="7" stroke-linecap="round" />
                </svg>
            </div>
        </div>
    </div>

    <!-- probaon UI -->
    <div id="profile-ui">
        <div class="profile-card">
            <div class="card-header">
                <span class="rarity-badge">1 IN 100,000,000</span>
                <span class="biome-badge">CYBERSPACE // ILLUSIONARY</span>
            </div>

            <div class="user-title">probaon</div>
            <div class="user-sub">-</div>

            <div class="tab-menu">
                <button class="tab-btn active" onclick="switchTab('profile')">PROFILE</button>
                <button class="tab-btn" onclick="switchTab('skills')">SKILLS</button>
                <button class="tab-btn" onclick="switchTab('projects')">PROJECTS</button>
            </div>

            <div class="tab-content active" id="tab-profile">
                <div class="data-row"><span class="data-key">ALIAS</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">ROLE</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">SPECIALTY</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">STATUS</span><span class="data-val">-</span></div>
            </div>

            <div class="tab-content" id="tab-skills">
                <div class="data-row"><span class="data-key">SKILL I</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">SKILL II</span><span class="data-val">-</span></div>
            </div>

            <div class="tab-content" id="tab-projects">
                <div class="data-row"><span class="data-key">PROJECT I</span><span class="data-val">-</span></div>
                <div class="data-row"><span class="data-key">PROJECT II</span><span class="data-val">-</span></div>
            </div>

            <div class="card-actions">
                <button class="btn-ui" onclick="replayCutscene()">ROLL AGAIN</button>
                <button class="btn-ui" onclick="pulseCore()">PULSE CORE</button>
            </div>
        </div>
    </div>

    <!-- YouTube API 載入 -->
    <script>
        let ytPlayer;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                videoId: 'JBgq8cG2D6o', // Sol's RNG Illusionary Music
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'playsinline': 1
                }
            });
        }

        /* Web Audio API 音效系統 */
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // 高頻電子 Glitch Pop 音效 (用於 10~12s 彈字)
        function playGlitchPop() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            const freqs = [1200, 1800, 2400, 3200, 800, 4000, 1500];
            const freq = freqs[Math.floor(Math.random() * freqs.length)];
            
            osc.type = Math.random() > 0.5 ? 'square' : 'sawtooth';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function triggerFlashAndShake() {
            document.body.classList.remove('shake-impact');
            void document.body.offsetWidth;
            document.body.classList.add('shake-impact');

            const flash = document.getElementById('flash');
            flash.style.opacity = '0.35';
            setTimeout(() => { flash.style.opacity = '0'; }, 50);
        }

        function hideAllFrames() {
            document.querySelectorAll('.cutscene-frame').forEach(el => {
                el.classList.remove('active');
                el.style.display = 'none';
            });
        }

        function showFrame(id) {
            hideAllFrames();
            const frame = document.getElementById(id);
            frame.style.display = 'flex';
            void frame.offsetWidth;
            frame.classList.add('active');
            triggerFlashAndShake();
        }

        /* 產生垂直文字直排，並同步播放彈字音效 */
        function spawnGlitchColumn(container) {
            const col = document.createElement('div');
            col.className = 'text-column';

            const xPositions = [4, 12, 22, 36, 52, 66, 78, 88];
            const chosenX = xPositions[Math.floor(Math.random() * xPositions.length)];
            col.style.left = chosenX + '%';

            const isBlurry = Math.random() > 0.4;
            if (isBlurry) {
                col.classList.add('column-pixelated');
                col.style.fontSize = (0.85 + Math.random() * 0.3) + 'rem';
            } else {
                col.classList.add('column-sharp');
                col.style.fontSize = (1.1 + Math.random() * 0.4) + 'rem';
            }

            const rowCount = Math.floor(18 + Math.random() * 8);
            for (let i = 0; i < rowCount; i++) {
                const line = document.createElement('div');
                line.textContent = 'no, not yet.';
                col.appendChild(line);
            }

            container.appendChild(col);
            
            // 彈出文字時觸發特製 Glitch 音效與畫面微震
            playGlitchPop();
            triggerFlashAndShake();
        }

        /* 順暢動畫與時間軸 */
        function startIllusionaryCutscene() {
            initAudio();
            document.getElementById('start-btn').style.display = "none";

            // 1. 音樂開始播放 (0.0s)
            if (ytPlayer && ytPlayer.playVideo) {
                try {
                    ytPlayer.seekTo(0);
                    ytPlayer.playVideo();
                } catch(e) { console.log(e); }
            }

            // 0.0s ~ 2.5s: Frame 1 (列車が死ぬ + 天使 1)
            showFrame('f1');

            // 2.5s ~ 5.0s: Frame 2 (Is it time to wake up?)
            setTimeout(() => { showFrame('f2'); }, 2500);

            // 5.0s ~ 7.5s: Frame 3 (どこにいますか？ + 天使眼環 2)
            setTimeout(() => { showFrame('f3'); }, 5000);

            // 7.5s ~ 10.0s: Frame 4 (you belong to here.)
            setTimeout(() => { showFrame('f5'); }, 7500);

            // 10.0s ~ 12.0s (暴走段落)：音樂突然【停止】，轉為純寂靜 + Glitch 音效，藍框向內壓迫
            setTimeout(() => {
                // 音樂在此精確時間點驟然中斷！
                if (ytPlayer) {
                    if (ytPlayer.pauseVideo) ytPlayer.pauseVideo();
                    else if (ytPlayer.stopVideo) ytPlayer.stopVideo();
                }

                hideAllFrames();
                const glitchScene = document.getElementById('frame-glitch-scene');
                const container = document.getElementById('glitch-columns-container');
                const blackBox = document.getElementById('glitch-black-box');

                container.innerHTML = '';
                
                // 重置黑色方塊為極細外框 (inset: 2px)
                blackBox.classList.remove('expand-inward');
                glitchScene.style.display = 'block';
                triggerFlashAndShake();

                // 觸發「藍邊由最外緣 2px，在 2 秒內向內延伸縮小」的動畫
                requestAnimationFrame(() => {
                    blackBox.classList.add('expand-inward');
                });

                // 生成中央 wake up. 文字
                const wakeCol = document.createElement('div');
                wakeCol.className = 'text-column column-sharp';
                wakeCol.style.left = '42%';
                wakeCol.style.fontSize = '1.3rem';
                for(let i = 0; i < 3; i++) {
                    const line = document.createElement('div');
                    line.textContent = 'wake up.';
                    wakeCol.appendChild(line);
                }
                container.appendChild(wakeCol);

                // 在 10s ~ 12s 這 2 秒內持續刷出 vertical no, not yet.，每次刷出播放專屬 Glitch 音效
                let count = 0;
                const interval = setInterval(() => {
                    spawnGlitchColumn(container);
                    count++;
                    if (count >= 13) clearInterval(interval);
                }, 120);

            }, 10000);

            // 12.0s: 順暢接續 Puppet 選項
            setTimeout(() => {
                showFrame('f7');
            }, 12000);
        }

        function forceYes() {
            const btnNo = document.getElementById('opt-no');
            if (btnNo.textContent !== "2. Yes") {
                playGlitchPop();
                btnNo.textContent = "2. Yes";
            }
        }

        function choosePuppet() {
            hideAllFrames();
            
            const f8 = document.getElementById('f8');
            const smileBox = document.getElementById('smile-box');
            f8.style.display = 'flex';
            smileBox.classList.remove('smile-zoom-implode');

            setTimeout(() => {
                smileBox.classList.add('smile-zoom-implode');
            }, 200);

            setTimeout(() => {
                trigger3DExplosion();

                document.body.classList.add('shake-impact');

                const shockwave = document.getElementById('shockwave');
                const flash = document.getElementById('flash');

                shockwave.classList.remove('shockwave-active');
                void shockwave.offsetWidth;
                shockwave.classList.add('shockwave-active');

                flash.style.backgroundColor = "#0012ff";
                flash.style.opacity = "1";
                setTimeout(() => {
                    flash.style.backgroundColor = "#ffffff";
                    setTimeout(() => { flash.style.opacity = "0"; }, 120);
                }, 80);

                document.getElementById('cutscene-overlay').style.opacity = "0";
                
                setTimeout(() => {
                    document.getElementById('cutscene-overlay').style.display = "none";
                    document.body.classList.remove('shake-impact');
                    document.getElementById('profile-ui').classList.add('active');
                }, 250);

            }, 800);
        }

        function replayCutscene() {
            document.getElementById('profile-ui').classList.remove('active');
            const overlay = document.getElementById('cutscene-overlay');
            overlay.style.display = "flex";
            overlay.style.opacity = "1";
            document.getElementById('start-btn').style.display = "block";
            hideAllFrames();
            document.getElementById('opt-no').textContent = "2. No";
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        /* Three.js 3D 背景 */
        let scene, camera, renderer, coreBox;
        let particleSystem, particleVelocities = [];

        function init3D() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const canvasTile = document.createElement('canvas');
            canvasTile.width = 128; canvasTile.height = 128;
            const ctx = canvasTile.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#0012ff'; ctx.fillRect(0, 0, 64, 64); ctx.fillRect(64, 64, 64, 64);

            const floorTexture = new THREE.CanvasTexture(canvasTile);
            floorTexture.wrapS = THREE.RepeatWrapping; floorTexture.wrapT = THREE.RepeatWrapping;
            floorTexture.repeat.set(20, 20);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(250, 250),
                new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.3 })
            );
            floor.rotation.x = -Math.PI / 2; floor.position.y = -8;
            scene.add(floor);

            coreBox = new THREE.Mesh(
                new THREE.BoxGeometry(6, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0x0012ff, wireframe: true, emissive: 0x0012ff, emissiveIntensity: 0.8 })
            );
            coreBox.position.set(0, 4, 0);
            scene.add(coreBox);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const pLight = new THREE.PointLight(0x0055ff, 2, 80);
            pLight.position.set(0, 15, 0);
            scene.add(pLight);

            animate();
        }

        function trigger3DExplosion() {
            if (particleSystem) scene.remove(particleSystem);

            const count = 350;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            particleVelocities = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = 0;
                positions[i * 3 + 1] = 4;
                positions[i * 3 + 2] = 0;

                const speed = 0.6 + Math.random() * 1.8;
                const theta = Math.random() * Math.PI * 2;
                const phi = (Math.random() - 0.5) * Math.PI;

                particleVelocities.push({
                    x: Math.cos(theta) * Math.cos(phi) * speed,
                    y: Math.sin(phi) * speed,
                    z: Math.sin(theta) * Math.cos(phi) * speed
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const mat = new THREE.PointsMaterial({
                color: 0x00aaff,
                size: 0.9,
                transparent: true,
                opacity: 1,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);
            camera.position.z = 24;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (coreBox) {
                coreBox.rotation.y += 0.01;
                coreBox.rotation.x += 0.005;
                coreBox.position.y = 4 + Math.sin(Date.now() * 0.002) * 0.5;
            }

            camera.position.z += (30 - camera.position.z) * 0.05;

            if (particleSystem) {
                const pos = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < particleVelocities.length; i++) {
                    pos[i * 3] += particleVelocities[i].x;
                    pos[i * 3 + 1] += particleVelocities[i].y;
                    pos[i * 3 + 2] += particleVelocities[i].z;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
                particleSystem.material.opacity -= 0.015;

                if (particleSystem.material.opacity <= 0) {
                    scene.remove(particleSystem);
                    particleSystem = null;
                }
            }

            renderer.render(scene, camera);
        }

        function pulseCore() {
            initAudio(); trigger3DExplosion();
            const flash = document.getElementById('flash');
            flash.style.opacity = "0.6";
            setTimeout(() => { flash.style.opacity = "0"; }, 100);
            if (coreBox) {
                coreBox.scale.set(1.5, 1.5, 1.5);
                setTimeout(() => { coreBox.scale.set(1, 1, 1); }, 200);
            }
        }

        window.onload = init3D;
    </script>
</body>
