<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NULLSCAPE // DIGITAL DESCENDANT</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:ital,wght@1,700;1,900&family=EB+Garamond:ital,wght@1,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-void: #04010a;
            --null-cyan: #00d2ff;
            --null-magenta: #ff0055;
            --null-purple: #8a00ff;
            --panel-width: 720px;
            --panel-bg: rgba(10, 4, 22, 0.88);
            --border-purple: rgba(138, 0, 255, 0.45);
            --border-cyan: rgba(0, 210, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-void);
            color: #ebd9ff;
            font-family: 'Share Tech Mono', monospace;
        }

        /* --------------------------------------------------
           全螢幕畫布與視覺濾鏡 (Canvas & Overlays)
        -------------------------------------------------- */
        #null-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .noise-layer {
            position: fixed;
            inset: 0;
            z-index: 2;
            opacity: 0.16;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .scanline-layer {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.35) 50%,
                rgba(0, 0, 0, 0.35)
            );
            background-size: 100% 4px;
        }

        .vignette-layer {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 30%, rgba(4, 1, 10, 0.82) 75%, #04010a 100%);
        }

        .flash-overlay {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .flash-overlay.active {
            opacity: 0.95;
        }

        /* --------------------------------------------------
           開場凝視眼睛層 (Splash Eye Stage)
        -------------------------------------------------- */
        #splash-stage {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.8s ease;
        }

        #splash-stage.zooming {
            transform: scale(40);
            opacity: 0;
            pointer-events: none;
        }

        .eye-box-splash {
            width: 260px;
            height: 150px;
            position: relative;
            filter: drop-shadow(0 0 20px rgba(255, 0, 85, 0.6));
            animation: eyePulse 3s infinite alternate ease-in-out;
        }

        @keyframes eyePulse {
            0% { filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.4)) drop-shadow(0 0 30px rgba(138, 0, 255, 0.2)); }
            100% { filter: drop-shadow(0 0 30px rgba(255, 0, 85, 0.85)) drop-shadow(0 0 50px rgba(0, 210, 255, 0.5)); }
        }

        /* 眨眼動畫容器 */
        .eye-blink-wrapper {
            width: 100%;
            height: 100%;
            transform-origin: center center;
            animation: blinkCycle 7s infinite ease-in-out;
        }

        @keyframes blinkCycle {
            0%, 94%, 98%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.03); }
        }

        .splash-hint {
            margin-top: 30px;
            font-family: 'Cinzel Decorative', serif;
            font-style: italic;
            font-size: 0.85rem;
            letter-spacing: 5px;
            color: var(--null-cyan);
            text-shadow: 0 0 12px var(--null-cyan);
            animation: pulseHint 2s infinite alternate ease-in-out;
        }

        @keyframes pulseHint {
            0% { opacity: 0.35; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* --------------------------------------------------
           螢幕兩側半透明菱形切頁按鈕 (Diamond Nav Buttons)
        -------------------------------------------------- */
        .nav-diamond {
            position: fixed;
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
            width: 52px;
            height: 52px;
            background: rgba(0, 210, 255, 0.06);
            border: 1.5px solid var(--null-cyan);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.25);
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            opacity: 0;
            pointer-events: none;
        }

        .nav-diamond.active {
            opacity: 0.8;
            pointer-events: auto;
        }

        .nav-diamond.left-btn { left: clamp(15px, 3.5vw, 45px); }
        .nav-diamond.right-btn { 
            right: clamp(15px, 3.5vw, 45px); 
            border-color: var(--null-magenta);
            background: rgba(255, 0, 85, 0.06);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.25);
        }

        .nav-diamond:hover {
            opacity: 1;
            transform: translateY(-50%) rotate(45deg) scale(1.15);
            background: rgba(0, 210, 255, 0.22);
            box-shadow: 0 0 25px var(--null-cyan);
        }

        .nav-diamond.right-btn:hover {
            background: rgba(255, 0, 85, 0.22);
            box-shadow: 0 0 25px var(--null-magenta);
        }

        .nav-diamond-icon {
            transform: rotate(-45deg);
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 8px #ffffff;
        }

        /* --------------------------------------------------
           720px 核心主介面面板 (Main 720px Panel Stage)
        -------------------------------------------------- */
        .main-stage {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.88);
            pointer-events: none;
            transition: opacity 1s ease 0.3s, transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
        }

        .main-stage.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .null-panel {
            width: var(--panel-width);
            max-width: 92vw;
            background: var(--panel-bg);
            border: 1px solid var(--border-purple);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), inset 0 0 30px rgba(138, 0, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 35px 40px;
            position: relative;
            clip-path: polygon(
                0 16px, 16px 0, 
                calc(100% - 16px) 0, 100% 16px, 
                100% calc(100% - 16px), calc(100% - 16px) 100%, 
                16px 100%, 0 calc(100% - 16px)
            );
        }

        .corner-tag {
            position: absolute;
            width: 8px;
            height: 8px;
            border: 1px solid var(--null-cyan);
            transform: rotate(45deg);
        }
        .ct-tl { top: 12px; left: 12px; }
        .ct-tr { top: 12px; right: 12px; }
        .ct-bl { bottom: 12px; left: 12px; }
        .ct-br { bottom: 12px; right: 12px; }

        .panel-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid rgba(255, 0, 85, 0.25);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .mini-eye-box {
            width: 130px;
            height: 75px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 12px rgba(255, 0, 85, 0.5));
            cursor: pointer;
            transition: transform 0.25s ease;
        }

        .mini-eye-box:hover {
            transform: scale(1.08);
        }

        .nullscape-title {
            font-family: 'Cinzel Decorative', serif;
            font-style: italic;
            font-weight: 900;
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            letter-spacing: 6px;
            background: linear-gradient(135deg, #00d2ff 0%, #8a00ff 50%, #ff0055 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .nullscape-sub {
            font-family: 'EB Garamond', serif;
            font-style: italic;
            font-size: 0.85rem;
            color: rgba(235, 217, 255, 0.7);
            letter-spacing: 4px;
            margin-top: 4px;
        }

        .audio-bar {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid var(--border-cyan);
            padding: 12px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .audio-text {
            font-size: 0.78rem;
            color: var(--null-cyan);
            letter-spacing: 1.5px;
        }

        .audio-btn {
            background: transparent;
            border: 1px solid var(--null-cyan);
            color: var(--null-cyan);
            padding: 5px 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .audio-btn:hover {
            background: var(--null-cyan);
            color: #000;
            box-shadow: 0 0 12px var(--null-cyan);
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 25px;
            min-height: 160px;
        }

        .data-card {
            background: rgba(4, 1, 10, 0.75);
            border-left: 3px solid var(--null-magenta);
            padding: 12px 16px;
            transition: border-color 0.3s;
        }

        .data-card:hover {
            border-left-color: var(--null-cyan);
        }

        .data-label {
            font-size: 0.65rem;
            color: rgba(235, 217, 255, 0.5);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .data-value {
            font-size: 0.9rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(0, 210, 255, 0.3);
        }

        .panel-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: rgba(235, 217, 255, 0.4);
            letter-spacing: 2px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 15px;
        }

        #youtube-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 畫布與全螢幕濾鏡 -->
    <canvas id="null-canvas"></canvas>

    <svg class="noise-layer">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
    </svg>
    <div class="scanline-layer"></div>
    <div class="vignette-layer"></div>
    <div class="flash-overlay" id="flash-overlay"></div>

    <!-- 開場凝視眼睛層 (Splash Eye Stage) -->
    <div id="splash-stage">
        <div class="eye-box-splash">
            <div class="eye-blink-wrapper">
                <!-- 重新設計之高精度鋸齒尖刺眼睛 SVG -->
                <svg viewBox="0 0 240 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- 外側血紅漸層 -->
                        <linearGradient id="redBorderGrad" x1="0" y1="0" x2="240" y2="140" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ff0044"/>
                            <stop offset="50%" stop-color="#b3001b"/>
                            <stop offset="100%" stop-color="#660000"/>
                        </linearGradient>

                        <!-- 眼窩內部深藍紫雜訊漸層 -->
                        <radialGradient id="scleraGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#3d1b7a"/>
                            <stop offset="60%" stop-color="#180736"/>
                            <stop offset="100%" stop-color="#080112"/>
                        </radialGradient>

                        <!-- 瞳孔放射霓虹漸層 -->
                        <radialGradient id="pupilCoreGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#00ffff"/>
                            <stop offset="35%" stop-color="#8000ff"/>
                            <stop offset="70%" stop-color="#0a0326"/>
                            <stop offset="100%" stop-color="#020008"/>
                        </radialGradient>

                        <!-- 電光紋路 Glow -->
                        <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur"/>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                        </filter>
                    </defs>

                    <!-- 1. 最外層紅邊 (銳利杏仁狀眼框) -->
                    <path d="M 20 70 Q 120 10 220 70 Q 120 130 20 70 Z" stroke="url(#redBorderGrad)" stroke-width="10" stroke-linejoin="round"/>

                    <!-- 2. 第二層純白內襯邊框 -->
                    <path d="M 20 70 Q 120 10 220 70 Q 120 130 20 70 Z" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

                    <!-- 3. 黑色銳利鋸齒尖刺睫毛 (Spike Eyelashes) -->
                    <path d="
                        M 25 70 
                        Q 45 42 65 40 L 60 22 L 80 35 
                        Q 100 28 120 28 L 120 8 L 128 28 
                        Q 148 28 168 37 L 175 22 L 180 41 
                        Q 200 48 215 70 
                        Q 195 95 175 98 L 182 116 L 165 102 
                        Q 145 110 120 110 L 120 130 L 115 110 
                        Q 95 110 75 102 L 68 116 L 62 97 
                        Q 40 90 25 70 Z" 
                        fill="#05010d" stroke="#120224" stroke-width="2"/>

                    <!-- 4. 眼窩底色 -->
                    <path d="M 32 70 Q 120 22 208 70 Q 120 118 32 70 Z" fill="url(#scleraGrad)"/>

                    <!-- 5. 隨滑鼠位移的瞳孔與虹膜組 (Pupil & Iris Group) -->
                    <g id="splash-pupil-group">
                        <!-- 虹膜外圍光圈 -->
                        <ellipse cx="120" cy="70" rx="36" ry="34" fill="url(#pupilCoreGrad)"/>
                        
                        <!-- 閃電微脈衝線條 -->
                        <path d="M 92 68 L 108 65 L 115 72 M 148 70 L 132 73 L 125 66" stroke="#00d2ff" stroke-width="1.5" filter="url(#glowEffect)" opacity="0.85"/>
                        <path d="M 120 42 L 118 55 L 124 60 M 120 98 L 122 85 L 116 80" stroke="#ff0055" stroke-width="1.5" filter="url(#glowEffect)" opacity="0.85"/>

                        <!-- 深邃核心瞳孔 -->
                        <ellipse cx="120" cy="70" rx="18" ry="22" fill="#03000a" stroke="#8a00ff" stroke-width="2"/>
                        <ellipse cx="120" cy="70" rx="8" ry="12" fill="#000000"/>

                        <!-- 高光反射 (Specular Highlights) -->
                        <circle cx="110" cy="60" r="4.5" fill="#ffffff" opacity="0.9"/>
                        <circle cx="130" cy="78" r="2.5" fill="#00d2ff" opacity="0.8"/>
                    </g>
                </svg>
            </div>
        </div>
        <div class="splash-hint">[ CLICK EYE TO ENTER VOID ]</div>
    </div>

    <!-- 左右螢幕半透明菱形按鈕 -->
    <div class="nav-diamond left-btn" id="btn-prev">
        <span class="nav-diamond-icon">&lt;</span>
    </div>
    <div class="nav-diamond right-btn" id="btn-next">
        <span class="nav-diamond-icon">&gt;</span>
    </div>

    <!-- 720px 主面板階段 -->
    <div class="main-stage" id="main-stage">
        <div class="null-panel">
            <div class="corner-tag ct-tl"></div><div class="corner-tag ct-tr"></div>
            <div class="corner-tag ct-bl"></div><div class="corner-tag ct-br"></div>

            <div class="panel-header">
                <div class="mini-eye-box" id="mini-eye-trigger">
                    <div class="eye-blink-wrapper">
                        <!-- 同款 Mini SVG 眼睛 -->
                        <svg viewBox="0 0 240 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M 20 70 Q 120 10 220 70 Q 120 130 20 70 Z" stroke="url(#redBorderGrad)" stroke-width="10"/>
                            <path d="M 20 70 Q 120 10 220 70 Q 120 130 20 70 Z" stroke="#ffffff" stroke-width="4"/>
                            <path d="M 25 70 Q 45 42 65 40 L 60 22 L 80 35 Q 100 28 120 28 L 120 8 L 128 28 Q 148 28 168 37 L 175 22 L 180 41 Q 200 48 215 70 Q 195 95 175 98 L 182 116 L 165 102 Q 145 110 120 110 L 120 130 L 115 110 Q 95 110 75 102 L 68 116 L 62 97 Q 40 90 25 70 Z" fill="#05010d"/>
                            <path d="M 32 70 Q 120 22 208 70 Q 120 118 32 70 Z" fill="url(#scleraGrad)"/>
                            <g id="mini-pupil-group">
                                <ellipse cx="120" cy="70" rx="36" ry="34" fill="url(#pupilCoreGrad)"/>
                                <ellipse cx="120" cy="70" rx="18" ry="22" fill="#03000a" stroke="#8a00ff" stroke-width="2"/>
                                <circle cx="110" cy="60" r="4.5" fill="#ffffff" opacity="0.9"/>
                            </g>
                        </svg>
                    </div>
                </div>

                <div class="nullscape-title">NULLSCAPE</div>
                <div class="nullscape-sub" id="sector-sub">DIGITAL DESCENDANT // VOID ARCHIVE</div>
            </div>

            <div class="audio-bar">
                <div class="audio-text">♫ TRACK: #1 NULLSCAPE - DIGITAL DESCENDANT</div>
                <button class="audio-btn" id="audio-toggle-btn">[ PAUSE BGM ]</button>
            </div>

            <div class="data-grid" id="data-grid"></div>

            <div class="panel-footer">
                <span id="page-index">PAGE 01 / 03</span>
                <span>SYSTEM_STATUS: AWAKENED</span>
            </div>
        </div>
    </div>

    <!-- YouTube 背景音樂音源 -->
    <div id="youtube-player"></div>

    <script>
        /* --------------------------------------------------
           1. 動態眼動追蹤機制 (Pupil Cursor Tracking & Micro-Saccades)
        -------------------------------------------------- */
        const splashPupil = document.getElementById('splash-pupil-group');
        const miniPupil = document.getElementById('mini-pupil-group');

        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener('mousemove', (e) => {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;

            // 計算座標偏移向量
            const dx = (e.clientX - cx) / cx;
            const dy = (e.clientY - cy) / cy;

            targetX = dx * 16; // 最大位移限制 16px
            targetY = dy * 12;
        });

        function updatePupilPosition() {
            // 平滑內插 (Lerp)
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            // 微小隨機震顫 (Micro-saccades)
            const jitterX = (Math.random() - 0.5) * 0.6;
            const jitterY = (Math.random() - 0.5) * 0.6;

            const transformStr = `translate(${currentX + jitterX}px, ${currentY + jitterY}px)`;

            if (splashPupil) splashPupil.style.transform = transformStr;
            if (miniPupil) miniPupil.style.transform = transformStr;

            requestAnimationFrame(updatePupilPosition);
        }
        updatePupilPosition();

        /* --------------------------------------------------
           2. YouTube Iframe API 控制器
        -------------------------------------------------- */
        let ytPlayer = null;
        let isAudioPlaying = false;

        const ytScript = document.createElement('script');
        ytScript.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(ytScript);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'Sts__Z-Qe7s', // #1 Nullscape by DIGITAL DESCENDANT
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'Sts__Z-Qe7s'
                }
            });
        }

        /* --------------------------------------------------
           3. 多 Sector 資料分頁 (純空值系統標籤)
        -------------------------------------------------- */
        const archiveSectors = [
            {
                sub: "DIGITAL DESCENDANT // SECTOR 01",
                data: [
                    { label: "ARCHIVE_ID", value: "[ NULL ]" },
                    { label: "CLEARANCE", value: "[ UNKNOWN ]" },
                    { label: "EGO_STATE", value: "[ VACANT_SLOT ]" },
                    { label: "ALIGNMENT", value: "[ UNBOUND ]" }
                ]
            },
            {
                sub: "RECORDS DATABASE // SECTOR 02",
                data: [
                    { label: "LOG_ENTRY_01", value: "[ UNASSIGNED DATA ]" },
                    { label: "LOG_ENTRY_02", value: "[ UNASSIGNED DATA ]" },
                    { label: "LOG_ENTRY_03", value: "[ UNASSIGNED DATA ]" },
                    { label: "ENCRYPTION", value: "[ NONE ]" }
                ]
            },
            {
                sub: "VOID CONNECTIVITY // SECTOR 03",
                data: [
                    { label: "SIGNAL_SOURCE", value: "[ DISCONNECTED ]" },
                    { label: "NODE_STATUS", value: "[ STANDBY ]" },
                    { label: "LINK_PROTOCOL", value: "[ NULL_PORT ]" },
                    { label: "DESTINATION", value: "[ VACANT ]" }
                ]
            }
        ];

        let currentSectorIndex = 0;

        function renderSector(index) {
            const sector = archiveSectors[index];
            document.getElementById('sector-sub').textContent = sector.sub;
            document.getElementById('page-index').textContent = `PAGE 0${index + 1} / 0${archiveSectors.length}`;

            const grid = document.getElementById('data-grid');
            grid.innerHTML = sector.data.map(item => `
                <div class="data-card">
                    <div class="data-label">${item.label}</div>
                    <div class="data-value">${item.value}</div>
                </div>
            `).join('');
        }

        function switchSector(dir) {
            if (dir === 'next') {
                currentSectorIndex = (currentSectorIndex + 1) % archiveSectors.length;
            } else {
                currentSectorIndex = (currentSectorIndex - 1 + archiveSectors.length) % archiveSectors.length;
            }
            renderSector(currentSectorIndex);
        }

        document.getElementById('btn-next').addEventListener('click', () => switchSector('next'));
        document.getElementById('btn-prev').addEventListener('click', () => switchSector('prev'));

        /* --------------------------------------------------
           4. 複合 Canvas 畫布引擎 (3D 棋盤格 + 虛空鎖鏈 + 漂浮粒塵)
        -------------------------------------------------- */
        const canvas = document.getElementById('null-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let animTime = 0;
        let isAwakened = false;

        const particles = Array.from({ length: 90 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 2.5 + 0.6,
            vx: (Math.random() - 0.5) * 0.4,
            vy: -Math.random() * 0.6 - 0.2,
            alpha: Math.random()
        }));

        function drawCanvasScene() {
            animTime += 0.015;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // 1. 深邃虛空漸層背景
            const bgGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, Math.max(w, h) * 0.85);
            bgGrad.addColorStop(0, '#1a0433');
            bgGrad.addColorStop(0.55, '#080114');
            bgGrad.addColorStop(1, '#04010a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // 2. 滾動扭曲 3D 棋盤格隧道 (Checkerboard Void Tunnel)
            ctx.save();
            ctx.translate(cx, cy);

            const totalRings = 20;
            for (let i = totalRings; i > 0; i--) {
                const z = i - (animTime % 1);
                const scale = 380 / (z * 1.8);
                const rot = animTime * 0.12 + z * 0.07;

                ctx.save();
                ctx.rotate(Math.sin(rot) * 0.18);

                const size = 110 * scale;
                const segments = 12;

                for (let j = 0; j < segments; j++) {
                    const a1 = (j / segments) * Math.PI * 2;
                    const a2 = ((j + 1) / segments) * Math.PI * 2;

                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a1) * size, Math.sin(a1) * size);
                    ctx.lineTo(Math.cos(a2) * size, Math.sin(a2) * size);
                    ctx.lineTo(Math.cos(a2) * (size * 1.14), Math.sin(a2) * (size * 1.14));
                    ctx.lineTo(Math.cos(a1) * (size * 1.14), Math.sin(a1) * (size * 1.14));
                    ctx.closePath();

                    if ((i + j) % 2 === 0) {
                        ctx.fillStyle = `rgba(0, 210, 255, ${0.1 + (1 - z / totalRings) * 0.22})`;
                    } else {
                        ctx.fillStyle = `rgba(12, 3, 25, ${0.45 + (1 - z / totalRings) * 0.45})`;
                    }
                    ctx.fill();
                    ctx.strokeStyle = `rgba(138, 0, 255, ${0.08 + (1 - z / totalRings) * 0.18})`;
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
                ctx.restore();
            }
            ctx.restore();

            // 3. 旋轉哥德鎖鏈幾何印記 (Gothic Chain Ring)
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(-animTime * 0.05);

            ctx.strokeStyle = 'rgba(255, 0, 85, 0.15)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(0, 0, 210, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0, 210, 255, 0.12)';
            for (let k = 0; k < 4; k++) {
                ctx.rotate(Math.PI / 2);
                ctx.strokeRect(-140, -140, 280, 280);
            }
            ctx.restore();

            // 4. 漂浮虛空粒塵 (Void Dust)
            particles.forEach(p => {
                p.y += p.vy;
                p.x += p.vx + Math.sin(animTime + p.y * 0.01) * 0.3;
                if (p.y < 0) { p.y = h; p.x = Math.random() * w; }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 210, 255, ${0.2 + Math.sin(animTime + p.alpha) * 0.15})`;
                ctx.fill();
            });

            requestAnimationFrame(drawCanvasScene);
        }

        /* --------------------------------------------------
           5. 轉場互動 (Splash Zoom-In & Awakened State)
        -------------------------------------------------- */
        const splashStage = document.getElementById('splash-stage');
        const mainStage = document.getElementById('main-stage');
        const flashOverlay = document.getElementById('flash-overlay');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const audioBtn = document.getElementById('audio-toggle-btn');

        function triggerAwaken() {
            if (isAwakened) return;
            isAwakened = true;

            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.playVideo();
                isAudioPlaying = true;
            }

            splashStage.classList.add('zooming');
            flashOverlay.classList.add('active');

            setTimeout(() => {
                flashOverlay.classList.remove('active');
                splashStage.style.display = 'none';

                mainStage.classList.add('active');
                btnPrev.classList.add('active');
                btnNext.classList.add('active');
            }, 650);
        }

        splashStage.addEventListener('click', triggerAwaken);
        document.getElementById('mini-eye-trigger').addEventListener('click', toggleAudio);

        function toggleAudio() {
            if (!ytPlayer) return;
            if (isAudioPlaying) {
                ytPlayer.pauseVideo();
                audioBtn.textContent = '[ PLAY BGM ]';
                audioBtn.style.borderColor = 'var(--null-cyan)';
                audioBtn.style.color = 'var(--null-cyan)';
            } else {
                ytPlayer.playVideo();
                audioBtn.textContent = '[ PAUSE BGM ]';
                audioBtn.style.borderColor = 'var(--null-magenta)';
                audioBtn.style.color = 'var(--null-magenta)';
            }
            isAudioPlaying = !isAudioPlaying;
        }

        audioBtn.addEventListener('click', toggleAudio);

        renderSector(0);
        drawCanvasScene();
    </script>
</body>
</html>
