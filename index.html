<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>probaon // Illusionary Cutscene [Ultimate Edition]</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root {
    --blue-deep: #00083a;
    --blue-pure: #0012ff;
    --blue-bright: #0066ff;
    --blue-ice: #7fd0ff;
    --blue-glow: rgba(0, 18, 255, 0.85);
    --magenta: #ff2bd6;
    --acid: #d4ff00;
    --bg-void: #000;
    --font-serif: 'Cinzel', serif;
    --font-mono: 'Space Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body, html { width: 100%; height: 100%; background: var(--bg-void); color: #fff; font-family: var(--font-mono); overflow: hidden; }

#webgl-container { position: fixed; inset: 0; z-index: 1; }

.scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 90;
    background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.4) 50%);
    background-size: 100% 4px; opacity: .6;
    animation: scanDrift 6s linear infinite;
}
@keyframes scanDrift { to { background-position: 0 40px; } }

.vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(circle at center, transparent 15%, rgba(0,0,0,.96) 90%);
}
.grain {
    position: fixed; inset: -50%; pointer-events: none; z-index: 91; opacity: .09;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grainMove .5s steps(4) infinite;
}
@keyframes grainMove {
    0% { transform: translate(0,0); } 25% { transform: translate(-3%,2%); }
    50% { transform: translate(2%,-3%); } 75% { transform: translate(-2%,-1%); } 100% { transform: translate(0,0); }
}

/* CRT 螢幕干擾層 */
.crt-glitch-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 92;
    background: radial-gradient(circle, transparent 60%, rgba(0, 18, 255, 0.35) 100%);
    mix-blend-mode: color-dodge; opacity: 0.85;
}

/* 硬體加速提示 */
.seraphim-box, .rgb-split, .shard, .glitch-slice {
    will-change: transform, opacity;
}

/* ===== 衝擊震動 ===== */
.shake-impact { animation: shakeImpact .22s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shakeImpact {
    0% { transform: translate(0,0) scale(1); filter: none; }
    20% { transform: translate(-14px,10px) scale(1.02); filter: drop-shadow(-4px 0 var(--magenta)) drop-shadow(4px 0 cyan); }
    40% { transform: translate(16px,-12px) scale(.99); filter: drop-shadow(5px 0 var(--magenta)) drop-shadow(-5px 0 cyan); }
    60% { transform: translate(-10px,14px) scale(1.01); filter: none; }
    80% { transform: translate(8px,-6px) scale(1); }
    100% { transform: translate(0,0) scale(1); filter: none; }
}

/* ===== 換頁前搖 ===== */
.pre-transition { animation: preTransition .5s ease-in forwards !important; }
@keyframes preTransition {
    0% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.1); filter: brightness(2) drop-shadow(0 0 40px var(--blue-bright)); }
    80% { transform: scale(1.22) rotate(1.5deg); opacity: .8; filter: invert(1); }
    100% { transform: scale(1.5); opacity: 0; filter: brightness(3); }
}

/* ===== Cutscene ===== */
#cutscene-overlay {
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: flex; justify-content: center; align-items: center;
    flex-direction: column; text-align: center; transition: opacity .4s ease;
    overflow: hidden;
}

.start-btn {
    position: relative; padding: 18px 50px; background: transparent;
    border: 2px solid var(--blue-pure); color: #fff;
    font-family: var(--font-serif); font-size: 1.3rem; font-weight: 900;
    letter-spacing: 6px; cursor: pointer; box-shadow: 0 0 35px var(--blue-glow);
    transition: all .25s ease; z-index: 110;
    animation: startPulse 2.2s ease-in-out infinite;
}
.start-btn::before, .start-btn::after {
    content: ''; position: absolute; inset: -10px; border: 1px solid rgba(0,102,255,.5);
    animation: startRing 2.2s ease-out infinite;
}
.start-btn::after { animation-delay: 1.1s; }
@keyframes startPulse { 0%,100% { box-shadow: 0 0 25px var(--blue-glow);} 50% { box-shadow: 0 0 60px var(--blue-glow), 0 0 100px rgba(0,102,255,.4);} }
@keyframes startRing { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.5,2); opacity: 0; } }
.start-btn:hover { background: var(--blue-pure); box-shadow: 0 0 70px var(--blue-pure); transform: scale(1.05); }

.cutscene-frame {
    position: absolute; inset: 0; display: none; flex-direction: column;
    justify-content: center; align-items: center; padding: 30px; overflow: hidden;
}
.cutscene-frame.active { display: flex; animation: framePunchIn .35s cubic-bezier(.175,.885,.32,1.275) forwards; }
.cutscene-frame.active.slow-in { animation: frameSlowIn 1.1s cubic-bezier(.16,1,.3,1) forwards; }
.cutscene-frame.active.zoom-in { animation: frameZoomIn .45s cubic-bezier(.2,.9,.2,1) forwards; }

@keyframes framePunchIn {
    0% { transform: scale(1.3); opacity: 0; filter: blur(10px); }
    60% { transform: scale(.98); opacity: 1; filter: blur(0); }
    100% { transform: scale(1); opacity: 1; filter: blur(0); }
}
@keyframes frameSlowIn {
    0% { transform: scale(.82); opacity: 0; filter: blur(18px); }
    100% { transform: scale(1); opacity: 1; filter: blur(0); }
}
@keyframes frameZoomIn {
    0% { transform: scale(.2); opacity: 0; filter: blur(14px) brightness(3); }
    70% { transform: scale(1.06); opacity: 1; filter: blur(0) brightness(1.2); }
    100% { transform: scale(1); opacity: 1; filter: none; }
}

.frame-blue { background: radial-gradient(circle at 50% 45%, #1a2dff 0%, var(--blue-pure) 45%, #00094d 110%); color: #fff; }
.frame-white { background: radial-gradient(circle at 50% 45%, #fff 0%, #e8ecff 55%, #b9c4ff 120%); color: var(--blue-pure); }
.frame-black { background: radial-gradient(circle at 50% 50%, #02041a 0%, #000 70%); color: var(--blue-pure); }

.rays {
    position: absolute; left: 50%; top: 45%; width: 220vmax; height: 220vmax;
    margin: -110vmax 0 0 -110vmax; pointer-events: none; opacity: .22;
    background: repeating-conic-gradient(from 0deg, currentColor 0deg 3deg, transparent 3deg 12deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 55%);
    mask-image: radial-gradient(circle, #000 0%, transparent 55%);
    animation: raySpin 40s linear infinite;
}
.rays.reverse { animation-direction: reverse; animation-duration: 28s; }
@keyframes raySpin { to { transform: rotate(360deg); } }

.bg-grid {
    position: absolute; inset: 0; pointer-events: none; opacity: .12;
    background-image: linear-gradient(currentColor 1px, transparent 1px), linear-gradient(90deg, currentColor 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
    mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
    animation: gridMove 8s linear infinite;
}
@keyframes gridMove { to { background-position: 60px 60px; } }

.shard {
    position: absolute; pointer-events: none; width: 0; height: 0; opacity: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-bottom: 22px solid currentColor;
    animation: shardRise linear infinite;
}
@keyframes shardRise {
    0% { transform: translateY(20vh) rotate(0deg) scale(.6); opacity: 0; }
    15% { opacity: .55; }
    100% { transform: translateY(-120vh) rotate(540deg) scale(1.3); opacity: 0; }
}

.seraphim-box {
    width: min(460px, 82vw); height: min(300px, 52vw);
    margin-bottom: 25px; display: flex; justify-content: center; align-items: center;
    position: relative; filter: drop-shadow(0 0 28px var(--blue-glow)); z-index: 3;
}
.seraphim-box svg { width: 100%; height: 100%; overflow: visible; }
.float-anim { animation: floatAnim 3.2s ease-in-out infinite alternate; }
@keyframes floatAnim {
    0% { transform: translateY(-10px) scale(.98); }
    100% { transform: translateY(10px) scale(1.03); }
}

.sv-ring-a { transform-origin: 200px 70px; animation: ringSpin 9s linear infinite; }
.sv-ring-b { transform-origin: 200px 70px; animation: ringSpin 6s linear infinite reverse; }
.sv-ring-c { transform-origin: 200px 70px; animation: ringSpin 14s linear infinite; }
@keyframes ringSpin { to { transform: rotate(360deg); } }

.sv-wing { transform-box: fill-box; opacity: 0; animation: wingUnfold .9s cubic-bezier(.2,1.1,.3,1) forwards; }
.sv-wing.L { transform-origin: 100% 50%; }
.sv-wing.R { transform-origin: 0% 50%; }
@keyframes wingUnfold {
    0% { opacity: 0; transform: scaleX(.05) rotate(var(--rot,0deg)); }
    100% { opacity: 1; transform: scaleX(1) rotate(0deg); }
}
.sv-wings-flap { transform-origin: 200px 130px; animation: wingFlap 2.4s ease-in-out infinite alternate; }
@keyframes wingFlap { 0% { transform: scaleY(.94) scaleX(.98);} 100% { transform: scaleY(1.05) scaleX(1.03);} }

.sv-eye-outer { transform-origin: 200px 130px; animation: eyeBreathe 1.8s ease-in-out infinite alternate; }
@keyframes eyeBreathe { 0% { transform: scale(.94);} 100% { transform: scale(1.1); } }
.sv-pupil { animation: pupilLook 5s ease-in-out infinite; }
@keyframes pupilLook {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-9px,2px); }
    45% { transform: translate(8px,-2px); }
    70% { transform: translate(0,4px); }
}
.sv-lid { transform-origin: 200px 130px; animation: blink 5.5s infinite; }
@keyframes blink { 0%,92%,100% { transform: scaleY(0);} 95% { transform: scaleY(1);} }
.sv-orbit { transform-origin: 200px 130px; animation: ringSpin 11s linear infinite; }
.sv-spark { animation: sparkTwinkle 1.4s ease-in-out infinite alternate; }
@keyframes sparkTwinkle { 0% { opacity: .2; } 100% { opacity: 1; } }
.sv-dash { stroke-dasharray: 4 8; animation: dashFlow 2s linear infinite; }
@keyframes dashFlow { to { stroke-dashoffset: -48; } }
.sv-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: drawIn 1.2s ease-out forwards; }
@keyframes drawIn { to { stroke-dashoffset: 0; } }

.jp-text { font-size: clamp(1.8rem, 6vw, 2.8rem); font-weight: bold; letter-spacing: 8px; position: relative; z-index: 3; }
.en-text { font-size: clamp(1.4rem, 5vw, 2.2rem); letter-spacing: 6px; font-weight: bold; position: relative; z-index: 3; }

.rgb-split { position: relative; display: inline-block; animation: rgbJitter 2.8s steps(1) infinite; }
.rgb-split::before, .rgb-split::after {
    content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%;
    pointer-events: none; mix-blend-mode: screen; opacity: .85;
}
.rgb-split::before { color: var(--magenta); transform: translate(-3px, 0); animation: rgbA 2.8s steps(1) infinite; }
.rgb-split::after { color: #00f0ff; transform: translate(3px, 0); animation: rgbB 2.8s steps(1) infinite; }
.frame-white .rgb-split::before { color: #ff2b7a; mix-blend-mode: multiply; }
.frame-white .rgb-split::after { color: #00b7ff; mix-blend-mode: multiply; }
@keyframes rgbA { 0%,100% { transform: translate(-2px,0);} 20% { transform: translate(-7px,1px);} 22% { transform: translate(-2px,0);} 70% { transform: translate(-9px,-2px); clip-path: inset(30% 0 40% 0);} 72% { transform: translate(-2px,0); clip-path: none;} }
@keyframes rgbB { 0%,100% { transform: translate(2px,0);} 20% { transform: translate(7px,-1px);} 22% { transform: translate(2px,0);} 70% { transform: translate(9px,2px); clip-path: inset(55% 0 10% 0);} 72% { transform: translate(2px,0); clip-path: none;} }
@keyframes rgbJitter { 0%,100% { transform: translate(0,0);} 71% { transform: translate(2px,0);} 72% { transform: translate(0,0);} }

.wipe-reveal { clip-path: inset(0 100% 0 0); }
.active .wipe-reveal { animation: wipeReveal .7s cubic-bezier(.7,0,.2,1) .25s forwards; }
@keyframes wipeReveal { to { clip-path: inset(0 0 0 0); } }

.wipe-bar {
    position: absolute; left: 0; right: 0; top: 50%; height: 100%; pointer-events: none;
    transform: translateY(-50%) scaleX(0); transform-origin: left;
    background: var(--magenta); mix-blend-mode: screen; z-index: 4;
}
.active .wipe-bar { animation: wipeBar .7s cubic-bezier(.7,0,.2,1) .25s forwards; }
@keyframes wipeBar { 0% { transform: translateY(-50%) scaleX(0); transform-origin: left; } 50% { transform: translateY(-50%) scaleX(1); transform-origin: left;} 51% { transform-origin: right;} 100% { transform: translateY(-50%) scaleX(0); transform-origin: right; } }

.text-wrap { position: relative; display: inline-block; }
.color-strike { position: fixed; inset: 0; z-index: 195; pointer-events: none; opacity: 0; mix-blend-mode: difference; }

/* 暴走段落 */
#frame-glitch-scene { background: var(--blue-pure) !important; position: absolute; inset: 0; overflow: hidden; }
.glitch-black-box {
    position: absolute; inset: 2px; background: #000; z-index: 2;
    box-shadow: 0 0 60px rgba(0,0,0,.98); transition: inset 2s cubic-bezier(.25,1,.5,1);
}
.glitch-black-box.expand-inward { inset: 18vw 15vh; }
.glitch-bg-angel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 90vh; height: 60vh; opacity: .3; z-index: 3; pointer-events: none;
    filter: drop-shadow(0 0 30px var(--blue-bright));
}
#glitch-columns-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; }

/* 聖痕警告旋轉環 */
.glitch-warning-ring {
    position: absolute; top: 50%; left: 50%;
    width: 650px; height: 650px; margin: -325px 0 0 -325px;
    border: 2px dashed var(--acid); border-radius: 50%;
    pointer-events: none; z-index: 11; opacity: 0.75;
    animation: warningSpin 4s linear infinite;
    font-family: var(--font-mono); font-size: 0.85rem; color: var(--acid);
    letter-spacing: 5px; display: flex; justify-content: center; align-items: center;
    text-shadow: 0 0 10px var(--acid);
}
@keyframes warningSpin { to { transform: rotate(360deg); } }

.text-column {
    position: absolute; top: -10%; display: flex; flex-direction: column; gap: 4px;
    font-family: var(--font-serif); font-weight: 900; color: #fff;
    white-space: nowrap; line-height: 1.05; text-transform: lowercase;
    animation: colDrop 1.6s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes colDrop { 0% { transform: translateY(-30vh); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(8vh); } }
.column-pixelated { filter: blur(2px) contrast(200%); opacity: .85; }
.column-sharp { filter: none; opacity: 1; text-shadow: 0 0 16px rgba(255,255,255,.95), 0 0 30px var(--blue-bright); }
.column-strike { color: var(--acid) !important; text-shadow: 0 0 20px var(--acid), 0 0 40px var(--magenta) !important; }
.glitch-slice {
    position: absolute; left: 0; right: 0; z-index: 12; pointer-events: none;
    background: var(--blue-pure); mix-blend-mode: difference; opacity: .9;
    animation: sliceFlash .18s steps(2) forwards;
}
@keyframes sliceFlash { 0% { transform: translateX(-4%);} 50% { transform: translateX(5%);} 100% { transform: translateX(0); opacity: 0; } }

.pop-item { opacity: 0; transform: scale(.8) translateY(20px); transition: opacity .25s ease-out, transform .25s cubic-bezier(.175,.885,.32,1.25); }
.pop-item.show { opacity: 1; transform: scale(1) translateY(0); }
.puppet-box { display: flex; flex-direction: column; gap: 20px; align-items: center; position: relative; z-index: 3; }
.puppet-title { font-size: clamp(1.6rem, 6vw, 2.4rem); letter-spacing: 5px; color: #fff; margin-bottom: 30px; font-weight: bold; font-family: var(--font-serif); text-shadow: 0 0 25px var(--blue-bright); }
.puppet-opt {
    background: transparent; border: none; color: #fff; font-family: var(--font-mono);
    font-size: 1.5rem; letter-spacing: 4px; cursor: pointer; padding: 10px 30px;
    transition: color .1s, transform .1s, text-shadow .1s;
}
.puppet-opt:hover { color: var(--blue-bright); text-shadow: 0 0 20px var(--blue-bright), 3px 0 var(--magenta), -3px 0 cyan; transform: scale(1.08); }
.puppet-eye {
    position: absolute; width: min(70vw, 520px); opacity: .18; z-index: 1; pointer-events: none;
    animation: floatAnim 4s ease-in-out infinite alternate;
}

.smile-zoom-implode { animation: smileZoom .65s cubic-bezier(.7,0,.84,0) forwards; }
@keyframes smileZoom {
    0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 20px var(--blue-pure)); }
    50% { transform: scale(1.4) rotate(-8deg); filter: drop-shadow(0 0 50px var(--blue-bright)); }
    100% { transform: scale(5.5) rotate(15deg); opacity: 0; filter: drop-shadow(0 0 150px #fff); }
}

.flash-bang { position: fixed; inset: 0; z-index: 200; background: #fff; opacity: 0; pointer-events: none; }
.shockwave-ring {
    position: fixed; top: 50%; left: 50%; width: 100px; height: 100px; margin: -50px 0 0 -50px;
    border-radius: 50%; border: 8px solid var(--blue-bright);
    box-shadow: 0 0 50px var(--blue-bright), inset 0 0 30px var(--blue-pure);
    pointer-events: none; z-index: 190; opacity: 0; transform: scale(.1);
}
.shockwave-active { animation: shockwaveExpand .6s cubic-bezier(.1,.8,.3,1) forwards; }
@keyframes shockwaveExpand { 0% { opacity: 1; transform: scale(.1); border-width: 20px; } 100% { opacity: 0; transform: scale(25); border-width: 1px; } }

.letterbox { position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 95; transition: height .8s cubic-bezier(.7,0,.2,1); pointer-events: none; }
.letterbox.top { top: 0; } .letterbox.bottom { bottom: 0; }
body.cinema .letterbox { height: 9vh; }

#profile-ui {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; justify-content: center; align-items: center;
    opacity: 0; transform: scale(1.6) rotateX(25deg) translateY(-80px); perspective: 1000px;
    transition: opacity .3s ease, transform .6s cubic-bezier(.175,.885,.32,1.25);
}
#profile-ui.active { opacity: 1; transform: scale(1) rotateX(0) translateY(0); }
.profile-card {
    pointer-events: auto; width: 90%; max-width: 520px; background: rgba(2,4,12,.92);
    border: 1px solid var(--blue-pure);
    box-shadow: 0 0 70px rgba(0,18,255,.5), inset 0 0 30px rgba(0,18,255,.25);
    backdrop-filter: blur(16px); padding: 35px 40px;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
}
.card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,.15); padding-bottom: 10px; margin-bottom: 20px; font-size: .75rem; }
.rarity-badge { color: #fff; font-weight: bold; letter-spacing: 2px; background: var(--blue-pure); padding: 3px 10px; box-shadow: 0 0 12px var(--blue-pure); }
.biome-badge { color: var(--blue-bright); letter-spacing: 1px; border: 1px solid rgba(0,85,255,.6); padding: 3px 8px; }
.user-title { font-family: var(--font-serif); font-size: clamp(2.5rem, 6vw, 3.8rem); font-style: italic; font-weight: 900; letter-spacing: 4px; color: #fff; text-shadow: 0 0 20px var(--blue-pure), 0 0 40px #fff; line-height: 1; }
.user-sub { font-size: .9rem; color: rgba(255,255,255,.7); letter-spacing: 4px; margin-top: 6px; margin-bottom: 22px; }
.tab-menu { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,.1); padding-bottom: 8px; }
.tab-btn { background: transparent; border: none; color: rgba(255,255,255,.5); font-family: var(--font-mono); font-size: .75rem; font-weight: bold; letter-spacing: 2px; cursor: pointer; padding: 4px 10px; }
.tab-btn.active, .tab-btn:hover { color: #fff; background: rgba(0,85,255,.25); border-bottom: 2px solid var(--blue-bright); }
.tab-content { display: none; flex-direction: column; gap: 10px; font-size: .8rem; }
.tab-content.active { display: flex; }
.data-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,.03); padding: 9px 14px; border-left: 3px solid var(--blue-pure); }
.data-key { color: rgba(255,255,255,.5); }
.data-val { color: #fff; font-weight: bold; }
.card-actions { margin-top: 25px; display: flex; gap: 12px; }
.btn-ui { flex: 1; padding: 12px; background: transparent; border: 1px solid var(--blue-pure); color: #fff; font-family: var(--font-serif); font-weight: bold; letter-spacing: 2px; cursor: pointer; transition: all .2s ease; }
.btn-ui:hover { background: var(--blue-pure); box-shadow: 0 0 25px var(--blue-pure); }
</style>
</head>
<body>

<div id="yt-player-container" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:-9999px;">
    <div id="yt-player"></div>
</div>

<div id="webgl-container"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>
<div class="crt-glitch-overlay"></div>
<div class="letterbox top"></div>
<div class="letterbox bottom"></div>
<div class="flash-bang" id="flash"></div>
<div class="color-strike" id="strike"></div>
<div class="shockwave-ring" id="shockwave"></div>

<div id="cutscene-overlay">
    <button class="start-btn" id="start-btn" onclick="startIllusionaryCutscene()">ROLL ILLUSIONARY</button>

    <!-- 範本 Templates -->
    <template id="tpl-a">
        <svg viewBox="0 0 400 260">
            <g class="sv-ring-c" fill="none" stroke="currentColor" opacity=".35"><circle cx="200" cy="70" r="58" stroke-width="1" class="sv-dash"/></g>

<script>
/* ================= YouTube 背景音樂 ================= */
let ytPlayer;
const ytTag = document.createElement('script');
ytTag.src = "https://www.youtube.com/iframe_api";
document.getElementsByTagName('script')[0].parentNode.insertBefore(ytTag, document.getElementsByTagName('script')[0]);
function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
        height: '0', width: '0', videoId: 'JBgq8cG2D6o',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1 }
    });
}

/* ================= 計時器管理 ================= */
let timers = [];
function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearAllTimers() { timers.forEach(clearTimeout); timers = []; }

/* ================= 大天使 SVG 注入 ================= */
function injectInto(id, tplId) {
    const target = document.getElementById(`svg-container-${id}`);
    const tpl = document.getElementById(tplId);
    if (target && tpl) { target.innerHTML = ''; target.appendChild(tpl.content.cloneNode(true)); }
}
function injectSeraphimSVGs() {
    injectInto('f1', 'tpl-a');
    injectInto('f2', 'tpl-b');
    injectInto('f3', 'tpl-a');
    injectInto('f5', 'tpl-c');
    injectInto('glitch', 'tpl-d');
    injectInto('puppet', 'tpl-d');
}

/* 漂浮碎片 */
function addShards(frame, color, n = 14) {
    frame.querySelectorAll('.shard').forEach(s => s.remove());
    for (let i = 0; i < n; i++) {
        const s = document.createElement('div');
        s.className = 'shard';
        s.style.color = color;
        s.style.left = (Math.random() * 100) + '%';
        s.style.top = (60 + Math.random() * 40) + '%';
        s.style.animationDuration = (3 + Math.random() * 4) + 's';
        s.style.animationDelay = (-Math.random() * 5) + 's';
        s.style.transform = `scale(${0.5 + Math.random()})`;
        frame.appendChild(s);
    }
}

/* ================= Web Audio (劇院級音效合成) ================= */
let audioCtx;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playGlitchPop() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    const freqs = [1500, 2200, 2900, 3600, 900, 4500, 1800];
    osc.type = Math.random() > .4 ? 'square' : 'sawtooth';
    osc.frequency.setValueAtTime(freqs[Math.floor(Math.random() * freqs.length)], t);
    osc.frequency.exponentialRampToValueAtTime(100, t + .06);
    gain.gain.setValueAtTime(.3, t);
    gain.gain.exponentialRampToValueAtTime(.001, t + .06);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(t + .06);
}

/* 升級版：極致重低音衝擊 (Extreme Sub-Bass Boom) */
function playExtremeImpact(strength = 1) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    const distortion = audioCtx.createWaveShaper();

    function makeCurve(amount) {
        let k = amount, n = 44100, curve = new Float32Array(n);
        for (let i = 0; i < n; ++i) {
            let x = i * 2 / n - 1;
            curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
        }
        return curve;
    }
    distortion.curve = makeCurve(300);

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(280, t);
    osc.frequency.exponentialRampToValueAtTime(22, t + 0.45);

    gain.gain.setValueAtTime(0.9 * strength, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);

    osc.connect(distortion);
    distortion.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(); osc.stop(t + 0.52);
}

function playRiser(dur = .5) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, t);
    osc.frequency.exponentialRampToValueAtTime(2400, t + dur);
    gain.gain.setValueAtTime(.001, t);
    gain.gain.exponentialRampToValueAtTime(.18, t + dur * .9);
    gain.gain.exponentialRampToValueAtTime(.001, t + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(t + dur);
}

function playNoiseBurst(dur = .12) {
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const gain = audioCtx.createGain(); gain.gain.value = .25;
    src.connect(gain); gain.connect(audioCtx.destination); src.start();
}

/* ================= 視覺特效 ================= */
function triggerFlashAndShake() {
    document.body.classList.remove('shake-impact');
    void document.body.offsetWidth;
    document.body.classList.add('shake-impact');
    const flash = document.getElementById('flash');
    flash.style.opacity = '.4';
    setTimeout(() => flash.style.opacity = '0', 50);
}
function colorStrike(color = '#ff2bd6', ms = 110) {
    const el = document.getElementById('strike');
    el.style.background = color;
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', ms);
}
function hideAllFrames() {
    document.querySelectorAll('.cutscene-frame').forEach(el => {
        el.classList.remove('active', 'pre-transition', 'slow-in', 'zoom-in');
        el.style.display = 'none';
    });
}
function showFrame(id, style = 'punch') {
    hideAllFrames();
    const frame = document.getElementById(id);
    frame.style.display = 'flex';
    void frame.offsetWidth;
    if (style === 'slow') frame.classList.add('slow-in');
    if (style === 'zoom') frame.classList.add('zoom-in');
    frame.classList.add('active');
    if (style !== 'slow') { triggerFlashAndShake(); playExtremeImpact(style === 'zoom' ? 1 : .7); }
    const isWhite = frame.classList.contains('frame-white');
    addShards(frame, isWhite ? '#0012ff' : '#7fd0ff');
    const scr = frame.querySelector('[data-final]');
    if (scr) scrambleText(scr, scr.dataset.final);
}
function prepareTransition(id) {
    const frame = document.getElementById(id);
    if (frame) { frame.classList.add('pre-transition'); playGlitchPop(); playRiser(.5); }
}

const SCR = 'abcdefghijklmnopqrstuvwxyz#@%&01?/\\';
function scrambleText(el, finalText) {
    let frame = 0;
    const total = 22;
    const iv = setInterval(() => {
        const progress = frame / total;
        let out = '';
        for (let i = 0; i < finalText.length; i++) {
            const ch = finalText[i];
            if (ch === ' ') { out += ' '; continue; }
            out += (i / finalText.length < progress) ? ch : SCR[Math.floor(Math.random() * SCR.length)];
        }
        el.textContent = out;
        if (++frame > total) { el.textContent = finalText; clearInterval(iv); }
    }, 34);
}

function animateProfileData() {
    document.querySelectorAll('.data-val').forEach(el => {
        const target = el.getAttribute('data-target');
        if (target) scrambleText(el, target);
    });
}

function spawnGlitchColumn(container, strike = false) {
    const col = document.createElement('div');
    col.className = 'text-column';
    const xs = [2, 14, 28, 44, 60, 74, 86];
    col.style.left = xs[Math.floor(Math.random() * xs.length)] + '%';
    if (Math.random() > .35) {
        col.classList.add('column-pixelated');
        col.style.fontSize = (2.2 + Math.random() * .8) + 'rem';
    } else {
        col.classList.add('column-sharp');
        col.style.fontSize = (2.6 + Math.random() * 1.2) + 'rem';
    }
    if (strike) col.classList.add('column-strike');
    const rows = Math.floor(8 + Math.random() * 5);
    for (let i = 0; i < rows; i++) {
        const line = document.createElement('div');
        line.textContent = 'no, not yet.';
        col.appendChild(line);
    }
    container.appendChild(col);

    if (Math.random() > .5) {
        const sl = document.createElement('div');
        sl.className = 'glitch-slice';
        sl.style.top = (Math.random() * 90) + '%';
        sl.style.height = (3 + Math.random() * 10) + '%';
        container.appendChild(sl);
        setTimeout(() => sl.remove(), 200);
    }
    playGlitchPop(); playNoiseBurst(.06);
    triggerFlashAndShake();
}

/* ================= 主時間軸 ================= */
function startIllusionaryCutscene() {
    clearAllTimers();
    initAudio();
    injectSeraphimSVGs();
    document.getElementById('start-btn').style.display = 'none';
    document.body.classList.add('cinema');
    camKick(-8);

    if (ytPlayer && ytPlayer.playVideo) {
        try { ytPlayer.seekTo(0); ytPlayer.playVideo(); } catch (e) { console.log(e); }
    }

    showFrame('f1', 'zoom');
    later(() => prepareTransition('f1'), 1550);

    later(() => { showFrame('f2', 'punch'); camKick(-5); }, 2000);
    later(() => prepareTransition('f2'), 3550);

    later(() => { showFrame('f3', 'slow'); camKick(6, true); }, 4000);
    later(() => prepareTransition('f3'), 6900);

    later(() => { showFrame('f5', 'zoom'); colorStrike('#ff2bd6', 120); camKick(-10); }, 7400);
    later(() => prepareTransition('f5'), 9100);

    later(() => {
        if (ytPlayer) { if (ytPlayer.pauseVideo) ytPlayer.pauseVideo(); else if (ytPlayer.stopVideo) ytPlayer.stopVideo(); }
        hideAllFrames();
        const glitchScene = document.getElementById('frame-glitch-scene');
        const container = document.getElementById('glitch-columns-container');
        const blackBox = document.getElementById('glitch-black-box');
        container.innerHTML = '';
        blackBox.classList.remove('expand-inward');
        glitchScene.style.display = 'block';
        triggerFlashAndShake(); colorStrike('#d4ff00', 90); playExtremeImpact(1.3);
        if (coreBox) coreBox.scale.set(1.4, 1.4, 1.4);
        requestAnimationFrame(() => blackBox.classList.add('expand-inward'));

        const wakeCol = document.createElement('div');
        wakeCol.className = 'text-column column-sharp';
        wakeCol.style.left = '38%'; wakeCol.style.fontSize = '3.2rem';
        for (let i = 0; i < 3; i++) { const l = document.createElement('div'); l.textContent = 'wake up.'; wakeCol.appendChild(l); }
        container.appendChild(wakeCol);

        let count = 0;
        const interval = setInterval(() => {
            spawnGlitchColumn(container, count % 5 === 4);
            if (count % 4 === 0) camKick((Math.random() - .5) * 14);
            if (++count >= 14) clearInterval(interval);
        }, 120);
        timers.push(interval);
    }, 9600);

    later(() => {
        if (coreBox) coreBox.scale.set(1, 1, 1);
        const opt2 = document.getElementById('puppet-opt2');
        opt2.textContent = '2. No';
        const title = document.getElementById('puppet-title');
        const opt1 = document.getElementById('puppet-opt1');
        [title, opt1, opt2].forEach(e => e.classList.remove('show'));
        showFrame('f7', 'slow');
        later(() => { title.classList.add('show'); playGlitchPop(); triggerFlashAndShake(); playExtremeImpact(.6); }, 500);
        later(() => { opt1.classList.add('show'); playGlitchPop(); triggerFlashAndShake(); }, 1100);
        later(() => { opt2.classList.add('show'); playGlitchPop(); triggerFlashAndShake(); colorStrike('#ff2bd6', 80); }, 1700);
    }, 12000);
}

function forceYes() {
    const btn = document.getElementById('puppet-opt2');
    if (btn.textContent !== '2. Yes') {
        playGlitchPop(); playNoiseBurst(.1); triggerFlashAndShake();
        colorStrike('#d4ff00', 70);
        btn.textContent = '2. Yes';
    }
}

function choosePuppet() {
    forceYes();
    clearAllTimers();
    hideAllFrames();
    const f8 = document.getElementById('f8');
    const smileBox = document.getElementById('smile-box');
    f8.style.display = 'flex';
    smileBox.classList.remove('smile-zoom-implode');
    
    playRiser(.7);
    if (coreBox) coreBox.scale.set(0.15, 0.15, 0.15); // 核心瞬間聚攏蓄力

    later(() => smileBox.classList.add('smile-zoom-implode'), 200);
    later(() => {
        trigger3DExplosion(); playExtremeImpact(1.8); playNoiseBurst(.35);
        document.body.classList.add('shake-impact');
        const shockwave = document.getElementById('shockwave');
        const flash = document.getElementById('flash');
        shockwave.classList.remove('shockwave-active'); void shockwave.offsetWidth;
        shockwave.classList.add('shockwave-active');
        flash.style.backgroundColor = '#0012ff'; flash.style.opacity = '1';
        setTimeout(() => {
            flash.style.backgroundColor = '#fff';
            setTimeout(() => { flash.style.opacity = '0'; flash.style.backgroundColor = '#fff'; }, 120);
        }, 80);
        document.body.classList.remove('cinema');
        document.getElementById('cutscene-overlay').style.opacity = '0';
        later(() => {
            document.getElementById('cutscene-overlay').style.display = 'none';
            document.body.classList.remove('shake-impact');
            document.getElementById('profile-ui').classList.add('active');
            animateProfileData();
        }, 250);
    }, 800);
}

function replayCutscene() {
    clearAllTimers();
    document.getElementById('profile-ui').classList.remove('active');
    const overlay = document.getElementById('cutscene-overlay');
    overlay.style.display = 'flex'; overlay.style.opacity = '1';
    document.getElementById('start-btn').style.display = 'block';
    hideAllFrames();
}

function switchTab(tabName, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
}

/* ================= Three.js 3D 背景 (含分頁節能與記憶體釋放) ================= */
let scene, camera, renderer, coreBox, coreInner, ringA, ringB;
let particleSystem, particleVelocities = [];
let camTargetZ = 30, camTargetX = 0, camTargetRoll = 0, camSlowPush = false;
let isPageActive = true;

document.addEventListener('visibilitychange', () => {
    isPageActive = !document.hidden;
});

function camKick(z, slow = false) {
    if (!camera) return;
    camSlowPush = slow;
    if (slow) { camTargetZ = 30 + z * -1.5; camera.position.z = 30; }
    else { camera.position.z = 30 + z; camTargetZ = 30; }
    camTargetRoll = (Math.random() - .5) * .12;
    setTimeout(() => { camTargetRoll = 0; if (slow) { camSlowPush = false; camTargetZ = 30; } }, slow ? 2800 : 180);
}

function init3D() {
    const container = document.getElementById('webgl-container');
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.015);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 30);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const tile = document.createElement('canvas');
    tile.width = 128; tile.height = 128;
    const ctx = tile.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = '#0012ff'; ctx.fillRect(0, 0, 64, 64); ctx.fillRect(64, 64, 64, 64);
    const floorTexture = new THREE.CanvasTexture(tile);
    floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(20, 20);

    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(250, 250),
        new THREE.MeshStandardMaterial({ map: floorTexture, roughness: .3 })
    );
    floor.rotation.x = -Math.PI / 2; floor.position.y = -8;
    scene.add(floor);

    coreBox = new THREE.Mesh(
        new THREE.BoxGeometry(6, 6, 6),
        new THREE.MeshStandardMaterial({ color: 0x0012ff, wireframe: true, emissive: 0x0012ff, emissiveIntensity: .8 })
    );
    coreBox.position.set(0, 4, 0);
    scene.add(coreBox);

    coreInner = new THREE.Mesh(
        new THREE.IcosahedronGeometry(2.4, 0),
        new THREE.MeshStandardMaterial({ color: 0x7fd0ff, wireframe: true, emissive: 0x0066ff, emissiveIntensity: 1 })
    );
    coreInner.position.set(0, 4, 0);
    scene.add(coreInner);

    ringA = new THREE.Mesh(new THREE.TorusGeometry(7, .05, 8, 80), new THREE.MeshBasicMaterial({ color: 0x0066ff }));
    ringB = new THREE.Mesh(new THREE.TorusGeometry(9, .04, 8, 80), new THREE.MeshBasicMaterial({ color: 0x7fd0ff }));
    ringA.position.set(0, 4, 0); ringB.position.set(0, 4, 0);
    scene.add(ringA); scene.add(ringB);

    const dustGeo = new THREE.BufferGeometry();
    const dp = new Float32Array(300 * 3);
    for (let i = 0; i < 300; i++) {
        dp[i * 3] = (Math.random() - .5) * 120;
        dp[i * 3 + 1] = Math.random() * 40 - 6;
        dp[i * 3 + 2] = (Math.random() - .5) * 120;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dp, 3));
    window.dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x7fd0ff, size: .25, transparent: true, opacity: .7 }));
    scene.add(window.dust);

    scene.add(new THREE.AmbientLight(0xffffff, .8));
    const pLight = new THREE.PointLight(0x0055ff, 2, 80);
    pLight.position.set(0, 15, 0);
    scene.add(pLight);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    injectSeraphimSVGs();
    animate();
}

function trigger3DExplosion() {
    if (particleSystem) {
        scene.remove(particleSystem);
        particleSystem.geometry.dispose();
        particleSystem.material.dispose();
    }
    const count = 450;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    particleVelocities = [];
    for (let i = 0; i < count; i++) {
        positions[i * 3] = 0; positions[i * 3 + 1] = 4; positions[i * 3 + 2] = 0;
        const speed = .6 + Math.random() * 1.8;
        const theta = Math.random() * Math.PI * 2;
        const phi = (Math.random() - .5) * Math.PI;
        particleVelocities.push({
            x: Math.cos(theta) * Math.cos(phi) * speed,
            y: Math.sin(phi) * speed,
            z: Math.sin(theta) * Math.cos(phi) * speed
        });
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleSystem = new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0x00aaff, size: .9, transparent: true, opacity: 1, blending: THREE.AdditiveBlending
    }));
    scene.add(particleSystem);
    camera.position.z = 22;
}

function animate() {
    requestAnimationFrame(animate);
    if (!isPageActive) return;

    const t = Date.now() * .001;

    if (coreBox) {
        coreBox.rotation.y += .012; coreBox.rotation.x += .006;
        coreBox.position.y = 4 + Math.sin(t * 2) * .5;
        coreInner.rotation.y -= .02; coreInner.rotation.z += .012;
        coreInner.position.y = coreBox.position.y;
        ringA.rotation.x = t * .6; ringA.rotation.y = t * .3;
        ringB.rotation.x = -t * .4; ringB.rotation.z = t * .5;
        ringA.position.y = ringB.position.y = coreBox.position.y;
        const s = coreBox.scale.x;
        coreInner.scale.setScalar(s); ringA.scale.setScalar(s); ringB.scale.setScalar(s);
    }
    if (window.dust) window.dust.rotation.y = t * .02;

    const ease = camSlowPush ? .012 : .07;
    camera.position.z += (camTargetZ - camera.position.z) * ease;
    camera.rotation.z += (camTargetRoll - camera.rotation.z) * .15;
    camera.position.x = Math.sin(t * .4) * 1.2;
    camera.lookAt(0, 4, 0);

    if (particleSystem) {
        const pos = particleSystem.geometry.attributes.position.array;
        for (let i = 0; i < particleVelocities.length; i++) {
            pos[i * 3] += particleVelocities[i].x;
            pos[i * 3 + 1] += particleVelocities[i].y;
            pos[i * 3 + 2] += particleVelocities[i].z;
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
        particleSystem.material.opacity -= .015;
        if (particleSystem.material.opacity <= 0) {
            scene.remove(particleSystem);
            particleSystem.geometry.dispose();
            particleSystem.material.dispose();
            particleSystem = null;
        }
    }
    renderer.render(scene, camera);
}

function pulseCore() {
    initAudio(); trigger3DExplosion(); playExtremeImpact(.9);
    const flash = document.getElementById('flash');
    flash.style.opacity = '.6';
    setTimeout(() => flash.style.opacity = '0', 100);
    if (coreBox) {
        coreBox.scale.set(1.5, 1.5, 1.5);
        setTimeout(() => coreBox.scale.set(1, 1, 1), 200);
    }
}

window.onload = init3D;
