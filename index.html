<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID // REQUIEM</title>
    <!-- 使用古典、優雅的襯線字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            background-color: #030105; /* 極致的暗紫黑 */
            color: #d8c8e3;
            font-family: 'Cinzel', 'Noto Serif TC', serif; /* 古典字體 */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 柔和、不規則的深紫霧氣 */
        .abyssal-mist {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 40%, rgba(50, 15, 75, 0.15) 0%, rgba(15, 4, 25, 0.8) 60%, #030105 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* 灰燼畫布 */
        #ash-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            opacity: 0.7;
        }

        /* 古老石碑感的內容區塊 (無明顯邊框) */
        .relic-card {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 420px;
            padding: 60px 40px;
            background: rgba(10, 3, 15, 0.4);
            border-top: 1px solid rgba(100, 60, 140, 0.15);
            border-bottom: 1px solid rgba(100, 60, 140, 0.15);
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            animation: fade-in 2s ease-in-out;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 頂部與底部的古典菱形裝飾 */
        .relic-card::before, .relic-card::after {
            content: '◆';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(100, 60, 140, 0.3);
            font-size: 10px;
        }
        .relic-card::before { top: 20px; }
        .relic-card::after { bottom: 20px; }

        /* 名字 / 銘文標題 */
        .name-engraved {
            font-size: 1.8rem;
            font-weight: 600;
            color: #e5d9f2;
            letter-spacing: 8px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(100, 60, 140, 0.5);
            text-transform: uppercase;
        }

        /* 稱號 / 墓誌銘 */
        .title-epitaph {
            font-size: 0.85rem;
            color: #9c84b5;
            letter-spacing: 4px;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* 故事 / 簡介文本 */
        .lore-text {
            font-size: 0.9rem;
            line-height: 2;
            color: #a895be;
            margin-bottom: 45px;
            text-align: justify;
            text-align-last: center;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* 連結列 */
        .path-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .path-link {
            text-decoration: none;
            color: #8c73a6;
            font-size: 0.8rem;
            letter-spacing: 3px;
            padding: 8px 20px;
            transition: all 0.5s ease;
            position: relative;
        }

        /* 滑鼠懸停時的微光與底線 */
        .path-link::after {
            content: '';
            position: absolute;
            bottom: 0; left: 50%;
            width: 0; height: 1px;
            background: #cba8f0;
            transition: all 0.5s ease;
            transform: translateX(-50%);
        }

        .path-link:hover {
            color: #e5d9f2;
            text-shadow: 0 0 10px rgba(120, 80, 160, 0.7);
        }

        .path-link:hover::after {
            width: 100%;
            box-shadow: 0 0 8px rgba(120, 80, 160, 0.8);
        }

    </style>
</head>
<body>
    <div class="abyssal-mist"></div>
    <canvas id="ash-canvas"></canvas>

    <div class="relic-card">
        <div class="name-engraved">[ 這裡填寫名字 ]</div>
        <div class="title-epitaph">The Abyssal Wanderer</div>
        
        <div class="lore-text">
            [ 這裡輸入簡介。不需要多餘的裝飾，用最純粹的文字寫下你的故事、信仰，或是曾經歷過的黑暗。 ]
        </div>

        <div class="path-links">
            <a href="#" class="path-link">第一道封印 / 連結</a>
            <a href="#" class="path-link">第二道封印 / 連結</a>
            <a href="#" class="path-link">深淵歸途 / 連結</a>
        </div>
    </div>

    <script>
        // 緩慢向上飄散的灰燼/塵埃系統 (非科技感星空)
        const canvas = document.getElementById('ash-canvas');
        const ctx = canvas.getContext('2d');
        let ashes = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ashes = [];
            const particleCount = Math.floor(window.innerWidth / 15); // 控制灰燼數量
            
            for (let i = 0; i < particleCount; i++) {
                ashes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speedY: Math.random() * -0.5 - 0.2, // 緩慢向上
                    speedX: Math.random() * 0.4 - 0.2,   // 微微左右飄動
                    opacity: Math.random() * 0.5 + 0.1,
                    fadeRate: (Math.random() * 0.005) + 0.001,
                    fadingOut: Math.random() > 0.5
                });
            }
        }

        function drawAshes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < ashes.length; i++) {
                let ash = ashes[i];
                
                // 移動邏輯
                ash.y += ash.speedY;
                ash.x += ash.speedX;

                // 閃爍/漸隱邏輯
                if (ash.fadingOut) {
                    ash.opacity -= ash.fadeRate;
                    if (ash.opacity <= 0.05) ash.fadingOut = false;
                } else {
                    ash.opacity += ash.fadeRate;
                    if (ash.opacity >= 0.6) ash.fadingOut = true;
                }

                // 邊界重置 (回到畫面底部)
                if (ash.y < -10) {
                    ash.y = canvas.height + 10;
                    ash.x = Math.random() * canvas.width;
                }
                if (ash.x > canvas.width + 10) ash.x = -10;
                if (ash.x < -10) ash.x = canvas.width + 10;

                // 繪製灰燼 (柔和的紫灰色)
                ctx.beginPath();
                ctx.arc(ash.x, ash.y, ash.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(160, 130, 190, ${ash.opacity})`;
                ctx.fill();
            }
            requestAnimationFrame(drawAshes);
        }

        window.addEventListener('resize', init);
        init();
        drawAshes();
    </script>
</body>
</html>
