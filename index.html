<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULLSCAPE // ABYSS</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #030106;
            color: #e9d5ff;
            font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* 深淵暗角 */
        body::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #030106 100%);
            z-index: 5; pointer-events: none;
        }

        #starfield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .terminal-card {
            position: relative; z-index: 10;
            width: 90%; max-width: 460px;
            background: rgba(12, 4, 20, 0.75);
            border: 1px solid #7e22ce44; padding: 35px;
            box-shadow: 0 0 40px rgba(126, 34, 206, 0.2), inset 0 0 15px rgba(168, 85, 247, 0.05);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }

        .terminal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            padding-bottom: 12px; margin-bottom: 24px;
            font-size: 0.7rem; color: #c084fc; letter-spacing: 2px;
        }

        .glitch-title {
            font-size: 1.8rem; font-weight: 700; color: #ffffff;
            letter-spacing: 4px; text-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
            margin-bottom: 8px; text-transform: uppercase;
        }

        .subtitle { font-size: 0.8rem; color: #a855f7; margin-bottom: 24px; letter-spacing: 1px; }

        .info-block {
            background: rgba(168, 85, 247, 0.05);
            border-left: 2px solid #a855f7; padding: 12px 16px;
            font-size: 0.82rem; line-height: 1.6; color: #d8b4fe; margin-bottom: 28px;
        }

        .action-list { display: flex; flex-direction: column; gap: 12px; }

        .action-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(168, 85, 247, 0.15);
            color: #c4b5fd; text-decoration: none; font-size: 0.8rem;
            letter-spacing: 1px; transition: all 0.2s ease;
        }

        .action-item:hover {
            background: rgba(168, 85, 247, 0.15); color: #ffffff;
            border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transform: translateX(5px);
        }

        .action-item::after { content: '>'; font-weight: bold; color: #a855f7; }

        .footer-tag {
            margin-top: 24px; font-size: 0.65rem; color: rgba(168, 85, 247, 0.5);
            text-align: right; letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>

    <div class="terminal-card">
        <div class="terminal-header">
            <span>[ NULL_ZONE ]</span>
            <span>DATA // 0xVOID</span>
        </div>

        <div class="glitch-title">[YOUR_NAME]</div>
        <div class="subtitle">[YOUR_SUBTITLE_OR_ROLE]</div>

        <div class="info-block">
            > [個人簡介句第一行]<br>
            > [個人簡介句第二行]
        </div>

        <div class="action-list">
            <a href="#" class="action-item"><span>[ 按鈕一文字 ]</span></a>
            <a href="#" class="action-item"><span>[ 按鈕二文字 ]</span></a>
            <a href="#" class="action-item"><span>[ 按鈕三文字 ]</span></a>
        </div>

        <div class="footer-tag">CONNECTION // STABLE</div>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    z: Math.random() * canvas.width, o: Math.random()
                });
            }
        }

        function draw() {
            ctx.fillStyle = '#030106'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];
                star.z -= 0.6; // 星塵向後退的速度
                if (star.z <= 0) star.z = canvas.width;

                let k = 128 / star.z;
                let px = (star.x - canvas.width / 2) * k + canvas.width / 2;
                let py = (star.y - canvas.height / 2) * k + canvas.height / 2;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    let size = (1 - star.z / canvas.width) * 2.5;
                    // 虛空紫紅漸變星塵
                    ctx.fillStyle = `rgba(168, 85, 247, ${1 - star.z / canvas.width})`;
                    ctx.fillRect(px, py, size, size);
                }
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init(); draw();
    </script>
</body>
</html>
