<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料虛空模板 - NULL SPACE</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --primary-neon: #ff00ff; /* 霓虹粉 */
            --secondary-neon: #00ffff; /* 電光藍 */
            --tertiary-neon: #8a2be2; /* 深紫色 */
            --flame-red: #ff4500; /* 火焰紅 */
            --font-family: 'Courier New', Courier, monospace; /* 像素字體 */
            --glitch-animation-duration: 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 0;
            overflow: hidden; /* 防止捲動，因為是單頁應用 */
            position: relative;
        }

        /* --- 1. 開頭動畫與音樂觸發頁 (#intro-overlay) --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36z8gAFmACYgNZAFAAVwAAAP//wM8H0wAAAABJRU5ErkJggg=='); /* 雜訊背景 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 1s ease-out;
            cursor: pointer;
        }

        #intro-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #pixel-eyes-container {
            position: relative;
            width: 150px;
            height: 100px;
            margin-bottom: 20px;
        }

        #pixel-eyes {
            width: 100%;
            height: auto;
            image-rendering: pixelated; /* 強化像素效果 */
            filter: drop-shadow(0 0 10px var(--secondary-neon));
            animation: pulse-eyes 2s infinite ease-in-out;
        }

        @keyframes pulse-eyes {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px var(--secondary-neon)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px var(--secondary-neon)); }
        }

        #trigger-text {
            color: var(--primary-neon);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: glitch-text var(--glitch-animation-duration) infinite, flicker 3s infinite;
        }

        @keyframes glitter-text {
            0% { transform: translate(0); text-shadow: -1px 0 var(--secondary-neon), 1px 0 var(--tertiary-neon); }
            20% { transform: translate(1px, 1px); }
            40% { transform: translate(-1px, -1px); text-shadow: 1px 0 var(--secondary-neon), -1px 0 var(--tertiary-neon); }
            60% { transform: translate(1px, -1px); }
            80% { transform: translate(-1px, 1px); }
            100% { transform: translate(0); }
        }

        @keyframes flicker {
            0%, 10%, 10.1%, 15%, 15.1%, 20%, 20.1%, 25%, 25.1%, 50%, 50.1%, 65%, 65.1%, 80%, 80.1%, 90%, 90.1%, 100% { opacity: 1; }
            10% { opacity: 0; }
            15% { opacity: 0; }
            20% { opacity: 0; }
            25% { opacity: 0; }
            50% { opacity: 0; }
            65% { opacity: 0; }
            80% { opacity: 0; }
            90% { opacity: 0; }
        }

        /* --- 酷炫的點擊爆炸粒子動畫 --- */
        #particle-burst-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            z-index: 1001;
            display: none;
            pointer-events: none;
        }

        #particle-burst-container.active {
            display: block;
        }

        .burst-particle {
            position: absolute;
            background: var(--text-color);
            border-radius: 50%;
            pointer-events: none;
            image-rendering: pixelated;
        }

        /* --- 2. 主頁面內容 (#main-container) --- */
        #main-container {
            opacity: 0;
            transition: opacity 1s ease-in;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        #main-container.fade-in {
            opacity: 1;
        }

        /* 導航列 */
        #nav-bar {
            background-color: #000;
            border-bottom: 2px solid var(--tertiary-neon);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .nav-link {
            color: var(--secondary-neon);
            text-decoration: none;
            text-transform: uppercase;
            margin: 0 15px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .nav-link:hover {
            color: var(--primary-neon);
            text-shadow: 0 0 5px var(--primary-neon);
        }

        /* 內容展示區 */
        #content-area {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            width: 100%;
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }

        .view.active {
            opacity: 1;
            transform: translateX(0);
        }

        /* 切頁動畫：離開的視圖向左滑動 */
        .view.prev {
            transform: translateX(-100%);
        }

        /* --- 視圖背景和風格 --- */
        #home-view {
            background: radial-gradient(circle, var(--flame-red) 10%, #4b0082 50%, #000 80%);
            background-blend-mode: overlay;
            filter: contrast(120%);
        }

        #about-view {
            background-color: var(--tertiary-neon);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.2) 2px, rgba(0,0,0,0.2) 4px); /* 網格雜訊 */
        }

        #projects-view {
            background-color: #000;
            background-image: linear-gradient(0deg, #111 25%, transparent 25%, transparent 50%, #111 50%, #111 75%, transparent 75%, transparent);
            background-size: 20px 20px; /* 幾何圖騰背景 */
        }

        /* --- 標題和文字風格 --- */
        #null-space-title {
            color: var(--primary-neon);
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: glitch-text var(--glitch-animation-duration) infinite, pulse-red 4s infinite;
        }

        @keyframes glitch-text {
            0% { transform: translate(0); text-shadow: -1px 0 var(--secondary-neon), 1px 0 var(--flame-red); }
            20% { transform: translate(2px, 2px); }
            40% { transform: translate(-2px, -2px); text-shadow: 1px 0 var(--secondary-neon), -1px 0 var(--flame-red); }
            60% { transform: translate(2px, -2px); }
            80% { transform: translate(-2px, 2px); }
            100% { transform: translate(0); }
        }

        @keyframes pulse-red {
            0%, 100% { text-shadow: 0 0 5px var(--flame-red), -1px 0 var(--secondary-neon), 1px 0 var(--flame-red); }
            50% { text-shadow: 0 0 20px var(--flame-red), -1px 0 var(--secondary-neon), 1px 0 var(--flame-red); }
        }

        .data-block {
            border: 2px solid var(--tertiary-neon);
            padding: 15px;
            margin: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #eee;
            image-rendering: pixelated;
        }

        /*作品集卡片 */
        #project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 80%;
            margin-top: 20px;
        }

        .project-card {
            border: 2px solid #333;
            background-color: #111;
            padding: 15px;
            text-align: center;
            transition: border-color 0.3s ease, transform 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .project-card:hover {
            border-color: var(--secondary-neon);
            transform: scale(1.05);
        }

        .project-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .project-card:hover::after {
            transform: translateX(100%);
        }

        /*作品集卡片中的圖騰圖示佔位符 */
        .project-icon {
            width: 40px;
            height: 40px;
            background-color: var(--tertiary-neon);
            border-radius: 5px;
            margin: 0 auto 10px;
            filter: drop-shadow(0 0 5px var(--tertiary-neon));
        }

        /* 頁尾 */
        #footer {
            background-color: #000;
            border-top: 2px solid var(--tertiary-neon);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            font-size: 0.8rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            color: #ccc;
            margin: 0 10px;
        }

        .contact-item svg {
            fill: var(--secondary-neon);
            width: 20px;
            height: 20px;
            margin-right: 5px;
            filter: drop-shadow(0 0 5px var(--secondary-neon));
        }

        /* 用於展示 closed-eye face (`image_5.png`) 和其它像素元素 */
        .pixel-element {
            width: 80px;
            height: auto;
            image-rendering: pixelated;
        }

    </style>
</head>
