<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULLSCAPE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@1,700;1,900&family=EB+Garamond:ital,wght@1,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-void: #08020f;
            --null-cyan: #00d2ff;
            --null-magenta: #e100ff;
            --null-purple: #4a0080;
            --panel-bg: rgba(13, 5, 25, 0.82);
            --border-purple: rgba(160, 32, 240, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-void);
            color: #e5d0ff;
            font-family: 'Share Tech Mono', monospace;
        }

        /* 3D 棋盤格虛空 Canvas */
        #void-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* 雜訊噪點質感 */
        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            opacity: 0.18;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .vignette-overlay {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 30%, rgba(8, 2, 15, 0.85) 75%, #08020f 100%);
        }

        /* 螢幕兩側半透明菱形按鈕 */
        .nav-diamond {
            position: fixed;
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
            width: 50px;
            height: 50px;
            background: rgba(0, 210, 255, 0.08);
            border: 1.5px solid var(--null-cyan);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .nav-diamond.left { left: clamp(15px, 4vw, 45px); }
        .nav-diamond.right { 
            right: clamp(15px, 4vw, 45px); 
            border-color: var(--null-magenta);
            background: rgba(225, 0, 255, 0.08);
            box-shadow: 0 0 15px rgba(225, 0, 255, 0.3);
        }

        .nav-diamond:hover {
            transform: translateY(-50%) rotate(45deg) scale(1.12);
            background: rgba(0, 210, 255, 0.25);
            box-shadow: 0 0 25px var(--null-cyan);
        }

        .nav-diamond.right:hover {
            background: rgba(225, 0, 255, 0.25);
            box-shadow: 0 0 25px var(--null-magenta);
        }

        .nav-diamond span {
            transform: rotate(-45deg);
            font-size: 1.2rem;
            color: #fff;
            font-weight: bold;
        }

        /* 720px 核心主面板 */
        .stage-container {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-panel {
            width: 720px;
            max-width: 90vw;
            background: var(--panel-bg);
            border: 1px solid var(--border-purple);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(74, 0, 128, 0.3);
            backdrop-filter: blur(12px);
            padding: 35px 40px;
            position: relative;
        }

        /* HEADER 區域與原生藝術眼睛 */
        .panel-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(225, 0, 255, 0.2);
            padding-bottom: 20px;
        }

        .eye-wrapper {
            width: 150px;
            height: 90px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px rgba(225, 0, 255, 0.4));
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .eye-wrapper:hover {
            transform: scale(1.05);
        }

        /* 重現圖片同款 Nullscape Italic Gradient 標題 */
        .nullscape-title {
            font-family: 'Cinzel', serif;
            font-style: italic;
            font-weight: 900;
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            letter-spacing: 6px;
            background: linear-gradient(135deg, #00d2ff 0%, #9000ff 50%, #ff0055 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .nullscape-sub {
            font-family: 'EB Garamond', serif;
            font-style: italic;
            font-size: 0.9rem;
            color: rgba(229, 208, 255, 0.7);
            letter-spacing: 3px;
            margin-top: 4px;
        }

        /* 音樂列 */
        .audio-bar {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 210, 255, 0.25);
            padding: 12px 18px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .audio-info {
            font-size: 0.8rem;
            color: var(--null-cyan);
            letter-spacing: 1px;
        }

        .audio-btn {
            background: transparent;
            border: 1px solid var(--null-cyan);
            color: var(--null-cyan);
            padding: 5px 14px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--null-cyan);
            color: #000;
            box-shadow: 0 0 10px var(--null-cyan);
        }

        /* 資料顯示區（純淨無個人資訊） */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .data-box {
            background: rgba(5, 2, 12, 0.7);
            border-left: 2px solid var(--null-magenta);
            padding: 12px 15px;
        }

        .data-label {
            font-size: 0.7rem;
            color: rgba(229, 208, 255, 0.5);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .data-val {
            font-size: 0.9rem;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .panel-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: rgba(229, 208, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 12px;
        }

        #youtube-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 畫布與濾鏡 -->
    <canvas id="void-canvas"></canvas>

    <svg class="noise-overlay">
        <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#noise)"/>
    </svg>
    <div class="vignette-overlay"></div>

    <!-- 左右螢幕半透明菱形按鈕 -->
    <div class="nav-diamond left" onclick="changePage(-1)">
        <span>&lt;</span>
    </div>
    <div class="nav-diamond right" onclick="changePage(1)">
        <span>&gt;</span>
    </div>

    <!-- 720px 主面板 -->
    <div class="stage-container">
        <div class="main-panel">
            
            <div class="panel-header">
                <!-- 精確還原 image_4608fe.png 造型的向量眼睛 SVG -->
                <div class="eye-wrapper" onclick="toggleAudio()">
                    <svg viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- 最外層紅邊 -->
                        <path d="M 15 60 Q 100 -5 185 60 Q 100 125 15 60 Z" stroke="#cc0011" stroke-width="12" stroke-linejoin="round"/>
                        <!-- 第二層白邊 -->
                        <path d="M 15 60 Q 100 -5 185 60 Q 100 125 15 60 Z" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
                        
                        <!-- 鋸齒刺狀黑色睫毛外框 -->
                        <path d="M 22 60 
                            C 35 35, 50 18, 65 22 C 72 10, 85 12, 100 15 C 115 12, 128 10, 135 22 C 150 18, 165 35, 178 60 
                            C 165 85, 150 102, 135 98 C 128 110, 115 108, 100 105 C 85 108, 72 110, 65 98 C 50 102, 35 85, 22 60 Z" 
                            fill="#000000" stroke="#0a0314" stroke-width="3"/>
                        
                        <!-- 眼睛內膜底色（深藍紫漸層） -->
                        <path d="M 30 60 Q 100 22 170 60 Q 100 98 30 60 Z" fill="url(#eyeGrad)"/>
                        
                        <!-- 電光紋路 -->
                        <path d="M 45 55 L 70 50 L 85 58 M 155 55 L 130 52 L 115 60" stroke="#8a40ff" stroke-width="1.5" opacity="0.8"/>

                        <!-- 深藍/黑 瞳孔 -->
                        <path d="M 72 60 C 72 40, 128 40, 128 60 C 128 80, 72 80, 72 60 Z" fill="url(#pupilGrad)"/>

                        <defs>
                            <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#4d2b99"/>
                                <stop offset="50%" stop-color="#24105c"/>
                                <stop offset="100%" stop-color="#0e0426"/>
                            </linearGradient>
                            <radialGradient id="pupilGrad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#020008"/>
                                <stop offset="70%" stop-color="#0a1240"/>
                                <stop offset="100%" stop-color="#18277a"/>
                            </radialGradient>
                        </defs>
                    </svg>
                </div>

                <div class="nullscape-title">NULLSCAPE</div>
                <div class="nullscape-sub">DIGITAL DESCENDANT</div>
            </div>

            <!-- 音樂播放控制區 -->
            <div class="audio-bar">
                <div class="audio-info" id="track-name">TRACK: #1 NULLSCAPE</div>
                <button class="audio-btn" id="play-btn" onclick="toggleAudio()">[ PLAY BGM ]</button>
            </div>

            <!-- 數據資料區 -->
            <div class="data-grid">
                <div class="data-box">
                    <div class="data-label">ARCHIVE_ID</div>
                    <div class="data-val">[ NULL ]</div>
                </div>
                <div class="data-box">
                    <div class="data-label">SECTOR</div>
                    <div class="data-val">[ VOID_01 ]</div>
                </div>
                <div class="data-box">
                    <div class="data-label">ENTRY_LOG</div>
                    <div class="data-val">[ VACANT ]</div>
                </div>
                <div class="data-box">
                    <div class="data-label">STATUS</div>
                    <div class="data-val">[ UNBOUND ]</div>
                </div>
            </div>

            <div class="panel-footer">
                <span id="page-num">PAGE 1 / 3</span>
                <span>NULLSCAPE ARCHIVE</span>
            </div>
        </div>
    </div>

    <!-- YouTube 背景音樂控制 -->
    <div id="youtube-player"></div>

    <script>
        /* --- 背景音樂播放器 API --- */
        let player = null;
        let isPlaying = false;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'Sts__Z-Qe7s',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'Sts__Z-Qe7s'
                }
            });
        }

        function toggleAudio() {
            const btn = document.getElementById('play-btn');
            if (!player) return;
            
            if (!isPlaying) {
                player.playVideo();
                btn.innerText = '[ PAUSE BGM ]';
                btn.style.borderColor = 'var(--null-magenta)';
                btn.style.color = 'var(--null-magenta)';
            } else {
                player.pauseVideo();
                btn.innerText = '[ PLAY BGM ]';
                btn.style.borderColor = 'var(--null-cyan)';
                btn.style.color = 'var(--null-cyan)';
            }
            isPlaying = !isPlaying;
        }

        let currentPage = 1;
        function changePage(dir) {
            currentPage += dir;
            if (currentPage > 3) currentPage = 1;
            if (currentPage < 1) currentPage = 3;
            document.getElementById('page-num').innerText = `PAGE ${currentPage} / 3`;
        }

        /* --- 3D 棋盤格超現實虛空 Canvas (致敬 image_460bac.jpg 氛圍) --- */
        const canvas = document.getElementById('void-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;

        function drawCheckerboardVoid() {
            time += 0.015;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // 背景紫藍深邃漸層
            const bgGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h) * 0.8);
            bgGrad.addColorStop(0, '#1c0336');
            bgGrad.addColorStop(0.5, '#0a0117');
            bgGrad.addColorStop(1, '#04000a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // 繪製滾動扭曲的 3D 棋盤格路徑 (Checkerboard Ribbon)
            ctx.save();
            ctx.translate(cx, cy);

            const totalRings = 22;
            for (let i = totalRings; i > 0; i--) {
                const z = i - (time % 1);
                const scale = 400 / (z * 1.8);
                const rot = time * 0.15 + z * 0.08;

                ctx.save();
                ctx.rotate(Math.sin(rot) * 0.2);

                const size = 120 * scale;
                const segments = 12;

                for (let j = 0; j < segments; j++) {
                    const angle1 = (j / segments) * Math.PI * 2;
                    const angle2 = ((j + 1) / segments) * Math.PI * 2;

                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angle1) * size, Math.sin(angle1) * size);
                    ctx.lineTo(Math.cos(angle2) * size, Math.sin(angle2) * size);
                    ctx.lineTo(Math.cos(angle2) * (size * 1.15), Math.sin(angle2) * (size * 1.15));
                    ctx.lineTo(Math.cos(angle1) * (size * 1.15), Math.sin(angle1) * (size * 1.15));
                    ctx.closePath();

                    // 黑白藍紫交錯棋盤格
                    if ((i + j) % 2 === 0) {
                        ctx.fillStyle = `rgba(0, 210, 255, ${0.12 + (1 - z / totalRings) * 0.25})`;
                    } else {
                        ctx.fillStyle = `rgba(10, 2, 20, ${0.4 + (1 - z / totalRings) * 0.5})`;
                    }
                    ctx.fill();
                    ctx.strokeStyle = `rgba(180, 0, 255, ${0.1 + (1 - z / totalRings) * 0.2})`;
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
                ctx.restore();
            }
            ctx.restore();

            requestAnimationFrame(drawCheckerboardVoid);
        }

        drawCheckerboardVoid();
    </script>
</body>
</html>
