<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol's RNG // 𝚒𝚕𝚕𝚞𝚜𝚒𝚘𝚗𝚊𝚛𝚢 Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --cyan: #00f0ff;
            --magenta: #ff0055;
            --bg-dark: #040508;
            --panel-bg: rgba(8, 12, 18, 0.88);
            --font-tech: 'Chakra Petch', sans-serif;
            --font-code: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: var(--font-tech);
            overflow: hidden;
        }

        /* --- Scanline & Vignette Effect --- */
        .scanlines {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 10;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            opacity: 0.7;
        }

        .vignette {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 9;
            background: radial-gradient(circle, transparent 40%, rgba(2, 3, 5, 0.9) 100%);
        }

        /* --- Canvas 背景 (傀儡線 + 粒子) --- */
        #puppet-canvas {
            position: fixed; inset: 0;
            z-index: 1;
            background: radial-gradient(circle at center, #0a0d14 0%, #030406 100%);
        }

        /* --- 主展示卡片 (Sol's RNG Aura Showcase Style) --- */
        .container {
            position: relative; z-index: 5;
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        .aura-card {
            width: 90%; max-width: 540px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(255, 0, 85, 0.1);
            backdrop-filter: blur(12px);
            padding: 35px 40px;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 25px 100%, 0 calc(100% - 25px));
            transition: transform 0.1s ease-out;
        }

        /* 頂部機率與 Biome 標籤 */
        .aura-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px; margin-bottom: 20px;
            font-family: var(--font-code); font-size: 0.75rem;
        }

        .rarity-tag {
            color: var(--magenta);
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--magenta);
            font-weight: bold;
        }

        .biome-tag {
            color: var(--cyan);
            letter-spacing: 1px;
            background: rgba(0, 240, 255, 0.1);
            padding: 2px 8px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        /* 標題 RGB Glitch 特效 */
        .glitch-title {
            font-size: clamp(2.2rem, 5vw, 3rem);
            font-weight: 700;
            color: #fff;
            letter-spacing: 4px;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .glitch-title::before, .glitch-title::after {
            content: attr(data-text);
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8;
        }

        .glitch-title::before {
            left: 2px; color: var(--magenta);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: -2px; color: var(--cyan);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(50px, 9999px, 80px, 0); }
            40% { clip: rect(20px, 9999px, 60px, 0); }
            100% { clip: rect(70px, 9999px, 90px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(60px, 9999px, 90px, 0); }
            30% { clip: rect(10px, 9999px, 40px, 0); }
            70% { clip: rect(40px, 9999px, 70px, 0); }
            100% { clip: rect(30px, 9999px, 50px, 0); }
        }

        .aura-sub {
            font-family: var(--font-code);
            font-size: 0.85rem; color: rgba(255, 255, 255, 0.6);
            letter-spacing: 3px; margin-top: 5px; margin-bottom: 25px;
        }

        /* 內容數據列 */
        .info-grid {
            display: flex; flex-direction: column; gap: 14px;
            font-family: var(--font-code);
        }

        .info-item {
            display: flex; justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-left: 3px solid var(--cyan);
        }

        .info-item.accent {
            border-left-color: var(--magenta);
        }

        .info-key { color: rgba(255, 255, 255, 0.5); font-size: 0.75rem; letter-spacing: 1px; }
        .info-val { color: #fff; font-size: 0.85rem; font-weight: bold; letter-spacing: 1px; }

        /* 按鈕區 */
        .action-bar {
            margin-top: 30px; display: flex; gap: 12px;
        }

        .btn-glitch {
            flex: 1; padding: 12px;
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            font-family: var(--font-tech); font-weight: bold;
            letter-spacing: 2px; cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .btn-glitch:hover {
            background: var(--cyan); color: #000;
            box-shadow: 0 0 20px var(--cyan);
        }

        .btn-glitch.danger {
            border-color: var(--magenta); color: var(--magenta);
        }

        .btn-glitch.danger:hover {
            background: var(--magenta); color: #fff;
            box-shadow: 0 0 20px var(--magenta);
        }

        /* 全螢幕 Flash 特效 */
        #glitch-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: var(--magenta); opacity: 0;
            pointer-events: none; transition: opacity 0.05s ease;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div id="glitch-overlay"></div>

    <!-- 傀儡線 Canvas -->
    <canvas id="puppet-canvas"></canvas>

    <div class="container">
        <div class="aura-card" id="card">
            <div class="aura-header">
                <span class="rarity-tag">CHALLENGED+ // 1 IN 10,000,000</span>
                <span class="biome-tag">CYBERSPACE</span>
            </div>

            <div class="glitch-title" data-text="𝚒𝚕𝚕𝚞𝚜𝚒𝚘𝚗𝚊𝚛𝚢">𝚒𝚕𝚕𝚞𝚜𝚒𝚘𝚗𝚊𝚛𝚢</div>
            <div class="aura-sub">███'█ PERFECT PUPPET 2</div>

            <div class="info-grid">
                <div class="info-item">
                    <span class="info-key">SYSTEM ARCHITECT</span>
                    <span class="info-val">Sles</span>
                </div>
                <div class="info-item accent">
                    <span class="info-key">AUDIO TRACK</span>
                    <span class="info-val">aakairo - PERFECT PUPPET 2</span>
                </div>
                <div class="info-item">
                    <span class="info-key">MECHANICS</span>
                    <span class="info-val">CFrame & Motor6D Jitter</span>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn-glitch" id="btn-trigger">OVERRIDE</button>
                <button class="btn-glitch danger" id="btn-pulse">PULSE</button>
            </div>
        </div>
    </div>

    <script>
        /* --- 1. Canvas 動態傀儡線 (Puppet Threads) 物理模擬 --- */
        const canvas = document.getElementById('puppet-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouseX = 0, mouseY = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // 建立 14 條縱向「傀儡線」
        const threads = [];
        const threadCount = 14;

        for (let i = 0; i < threadCount; i++) {
            threads.push({
                xRatio: (i + 1) / (threadCount + 1),
                nodes: 15,
                offsets: new Array(15).fill(0),
                speed: 0.02 + Math.random() * 0.03,
                color: Math.random() > 0.3 ? 'rgba(0, 240, 255, 0.35)' : 'rgba(255, 0, 85, 0.4)'
            });
        }

        let time = 0;
        function animate() {
            ctx.clearRect(0, 0, width, height);
            time += 0.05;

            // 繪製微弱網格
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
            ctx.lineWidth = 1;
            for(let x = 0; x < width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }

            // 繪製傀儡線
            threads.forEach((t) => {
                const baseX = t.xRatio * width;
                ctx.beginPath();
                ctx.strokeStyle = t.color;
                ctx.lineWidth = 1.5;

                for (let j = 0; j <= t.nodes; j++) {
                    const y = (j / t.nodes) * height;
                    
                    // 滑鼠排斥效果 + 鋸齒波故障抖動
                    const distToMouse = Math.hypot(baseX - mouseX, y - mouseY);
                    let jitter = Math.sin(time + j) * 3;
                    
                    if (distToMouse < 150) {
                        jitter += (150 - distToMouse) * (baseX < mouseX ? -0.4 : 0.4);
                    }

                    const currentX = baseX + jitter;
                    if (j === 0) ctx.moveTo(currentX, y);
                    else ctx.lineTo(currentX, y);

                    // 傀儡線節點發光
                    if (j % 4 === 0) {
                        ctx.fillStyle = t.color;
                        ctx.fillRect(currentX - 2, y - 2, 4, 4);
                    }
                }
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }
        animate();

        /* --- 2. Web Audio API 音效與故障觸發 --- */
        let audioCtx;
        function playGlitchSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        const overlay = document.getElementById('glitch-overlay');
        const card = document.getElementById('card');

        function triggerEffect() {
            playGlitchSound();
            overlay.style.opacity = '0.6';
            card.style.transform = `translate(${(Math.random()-0.5)*20}px, ${(Math.random()-0.5)*20}px) scale(0.98)`;
            
            setTimeout(() => {
                overlay.style.opacity = '0';
                card.style.transform = 'translate(0, 0) scale(1)';
            }, 80);
        }

        document.getElementById('btn-trigger').addEventListener('click', triggerEffect);
        document.getElementById('btn-pulse').addEventListener('click', () => {
            for(let i=0; i<3; i++) setTimeout(triggerEffect, i*100);
        });
    </script>
</body>
</html>
